---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - "ладно... давай ещё раз разберёмся, что такое 🗜️  маппер"
  - "маппер — это чип в картридже, который управляет тем, как консоль читает данные ROM"
  - "он позволяет играм использовать больше кода и графики, переключая банки между несколькими чипами 🤖  PRG-ROM или 👾  CHR-ROM"
  - "некоторые мапперы добавляют особые возможности: меняют отражение на лету или вызывают прерывание на определённой строке развёртки 🌠"
  - "чем больше мапперов поддерживает эмулятор, тем больше игр с ним совместимы 👾"
  - "BrokenNEEES поддерживает самые распространённые мапперы (~0-4~)"
  - "но при передаче управления тебе достался только маппер 0 — <NROM>"
  responses:
  - "что такое переключение банков? [bank]"

bank:
  messages:
  - "переключение банков позволяет картриджу менять часть ROM, которую консоль видит в данный момент"
  - "консоль «видит» лишь ограниченный диапазон памяти, а маппер выбирает, какой банк в него отображается"
  - "например, у игры может быть 256 КБ 🤖  PRG-ROM, но CPU может адресовать только 32 КБ одновременно"
  - "маппер по необходимости подставляет разные блоки по 32 КБ 🐏"
  - "так можно запускать гораздо более крупные игры без дополнительных адресных линий и памяти в консоли"
  - "по сути, картридж решает, <какие данные> консоль видит в каждый момент"
  responses:
  - "а как игра выбирает нужный блок? [howdoes]"

howdoes:
  messages:
  - "она записывает в определённые адреса памяти — обычно в области 💾  картриджа, $4020-$FFFF"
  - "маппер перехватывает запись и по записанному значению выбирает видимый банк ROM"
  - "например, число, записанное в $8000, может указать мапперу сменить текущий банк PRG-ROM"
  - "так код игры сам управляет тем, к какому блоку данных или кода обратиться дальше"
  responses:
  - "а как это делает <NROM>? [nrom]"

nrom:
  messages:
  - "никак 🤣"
  - "<NROM> — простейший тип картриджа: в нём вообще нет чипа маппера!"
  - "🧠  CPU и 🖥️  PPU постоянно подключены к фиксированным частям ROM"
  - "обычно там 32 КБ PRG-ROM и 8 КБ CHR-ROM, а иногда — CHR-RAM"
  - "для небольших игр он идеален, а эмулировать его проще всего 🧩"
  - |-
    посмотри эти файлы, чтобы понять, как он работает:
      📄  ~/docs/lib/Mapper.ru.md~
      📄  ~/tmpl/mappers/0_NROM.js~
      📄  ~/tmpl/mappers/mappers.js~
  responses:
  - "▶️  продолжить [end]"
