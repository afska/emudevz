exercise:
  messages:
  - |-
    📚  crée une classe 📏  `UxROM` qui étend `Mapper` :
    **constructor()** :
      **->** initialise ```javascript this.page = 0```
    **cpuRead(address)** :
      **->** si `address` est entre $4020-$7FFF :
        **->** retourne 0
      **->** si `address` est entre $8000-$BFFF :
        **->** retourne ```javascript this.$getPrgPage(this.page)[address - 0x8000]```
      **->** si `address` est entre $C000-$FFFF :
        **->** retourne ```javascript this.$getPrgPage(this.prgPages.length - 1)[address - 0xC000]```
    **cpuWrite(address, value)** :
      **->** si `address` est >= $8000 :
        **->** définit `value` comme la <page courante>
    **ppuRead(address)** :
      **->** retourne ```javascript this.$getChrPage(0)[address]```
    **ppuWrite(address, value)** :
      **->** si non ```javascript this.cartridge.header.usesChrRam```:
        **->** retourne (seule la CHR-RAM est inscriptible)
      **->** assigne ```javascript this.$getChrPage(0)[address] = value```
    **getSaveState()** :
      **->** retourne un objet combinant ```javascript super.getSaveState()``` avec un autre incluant la <page courante>
    **setSaveState(saveState)** :
      **->** appelle ```javascript super.setSaveState(saveState)``` mais restaure aussi la <page courante>
  - |-
    📚  ajoute ta classe `UxROM` à 📄  ~/code/mappers/mappers.js~
      (si tu n'as pas le fichier, crée-le depuis 📄  ~/tmpl/mappers/mappers.js~)
  - |-
    pour tester ce mapper, tu peux lancer un de ces jeux :
      💦 🏛️  <Böbl>
      🦅 🧷  <Crowborg>
      🦟 🍳  <Filthy Kitchen>
      🌌 🔫  <Isostasy Demo>
      🕊️ 🛰️  <Spacegulls>
      🦸 🤸  <Super Tilt Bro>
      🏭 🔩  <TroubleAt2A03>
      🐺 🌲  <WolfSpirit>
      🐺 ⛓️  <Wolfling>
  responses:
  - ▶️  continuer [end]
