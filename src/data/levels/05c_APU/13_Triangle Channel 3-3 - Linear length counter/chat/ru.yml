main:
  messages:
  - "мы уже говорили, что у треугольного канала два счётчика длины 📏"
  - "второй — линейный счётчик длины; у него 3 главных отличия:"
  - |-
    🎯  он позволяет игре задать нужную длину напрямую, без таблицы предустановленных значений
      (но ограничения всё равно есть: поле занимает лишь 7 бит, так что максимальная длина — 127)
  - |-
    ⛓️  его значение загружается не сразу:
      - запись в 📏  TriangleLengthControl задаёт <значение перезагрузки>
      - запись в 🕛  TriangleTimerHighLCL устанавливает <флаг перезагрузки>, и отложенное значение загружается на следующем тактовом событии
  - "🕒  он обновляется каждую четверть кадра, а не половину"
  - "канал должен замолкать, когда любой из счётчиков равен 0"
  responses:
  - "понятно [exercise]"

exercise:
  messages:
  - |- 
    📚  создай класс 📏  `LinearLengthCounter`, <унаследованный> от `LengthCounter`, со следующим:
    **constructor()**:
      **->** вызывает ```javascript super()```
      **->** задаёт ```javascript this.reload = 0```
      **->** задаёт ```javascript this.reloadFlag = false```
    **fullReset()**:
      **->** вызывает ```javascript this.reset()```
      **->** задаёт ```javascript this.reload = 0```
      **->** задаёт ```javascript this.reloadFlag = false```
    **clock(isEnabled, isHalted)**:
      **->** если `!isEnabled`:
        **->** вызывает ```javascript this.reset()```
        **->** выходит из метода

      **->** если установлен флаг перезагрузки:
        **->** записывает значение перезагрузки в ```javascript this.counter```
      **->** иначе:
        **->** вызывает ```javascript super.clock(isEnabled, false);```
      
      **->** если `!isHalted`:
          **->** сбрасывает флаг перезагрузки
  - |-
    📚  в 🔺  `TriangleChannel`:
    **->** импортируй класс 📏  `LinearLengthCounter` и добавь свойство `linearLengthCounter` с новым экземпляром
    **->** измени **sample()**, чтобы <ранний выход> также учитывал ```javascript !this.linearLengthCounter.isActive()```
    **->** реализуй:
    **quarterFrame()**:
      **->** вызывает метод `clock(...)` линейного счётчика длины
        (первым аргументом передай ```javascript this.isEnabled()```)
        (флаг остановки возьми тот же, что у обычного счётчика длины — он у них общий!)
  - |-
    📚  реализуй в 📏  `TriangleLengthControl`:
    **onLoad()**:
      **->** через ```javascript this.addField(...)``` задаёт 7-битное поле `linearCounterReload`, начиная с бита 0
    **onWrite(value)**:
      **->** __сохрани текущее поведение__
      **->** записывает новую длину в свойство `reload` линейного счётчика длины канала
        (<значение перезагрузки> берётся напрямую из ```javascript this.linearCounterReload```)
  - |-
    📚  реализуй в 🕛  `TriangleTimerHighLCL`:
    **onWrite(value)**:
      **->** __сохрани текущее поведение__
      **->** устанавливает флаг перезагрузки линейного счётчика длины канала
  - "📚  в 🎛️  `APUControl` после вызова `reset()` у счётчика длины также вызывай `fullReset()` у линейного счётчика длины, если `enableTriangle` равен 0"
  responses: []
