---
main:
  messages:
  - "наконец-то добавим <звук> в наш эмулятор! 🔊"
  - "с ним всё не так наглядно, как с <видео>, так что сначала придётся кое-что объяснить"
  responses:
  - "как это работает? [how]"

how:
  messages:
  - "🌊  <звук> задаётся волнами, которые напрямую описывают движение динамика"
  - "🎵  когда динамик вибрирует с определённой частотой, получается нота"
  - "📈  время <непрерывно>, поэтому компьютеры хранят волны как поток отсчётов: чисел, задающих высоту волны в конкретный момент"
  - "🔢  в NEEES отсчёты — это числа от ~0 до 15~, а при эмуляции APU мы отправляем звуковой карте 44100 отсчётов в секунду"
  - "это называется частотой дискретизации"
  responses:
  - "(*) как выглядит волна? [wave]"
  - "как APU создаёт отсчёты? [samples]"

wave:
  messages:
  - "она... <периодическая>!"
  - <{wave_square.png}>
  - "это прямоугольная волна на максимальной громкости — одна из типичных форм волны APU"
  - "период — это время одного полного повторения"
  - "`period = 1 / frequency`, так что чем короче период, тем выше нота"
  - "чем больше амплитуда, тем громче звук"
  - "и, как уже говорилось, всё это хранится как поток отсчётов"
  - "вот волна посложнее"
  - <{wave.png}>
  - "её форму можно сохранить как <последовательность точек>"
  - "тех самых отсчётов!"
  responses:
  - ...how

samples:
  messages:
  - "как CPU и PPU, APU работает по циклам 🚲"
  - "цикл — это наименьшая единица времени: один такт, за который внутреннее состояние устройства меняется на один шаг"
  - "🔊  APU работает <в 2 раза> медленнее 🧠  CPU"
  - "поэтому циклы APU медленнее: каждый длится ~вдвое дольше~ цикла CPU"
  - <{unit_speeds.png}>
  responses:
  - "с чего начнём? [exercise]"

exercise:
  messages:
  - "📚  создай файл с кодом APU по шаблону 📄  ~/tmpl/apu/APU.js~"
  - |-
    📚  чтобы отслеживать время, добавь этот метод:
    **step(onSample)**:
      **->** увеличивает счётчик отсчётов
      **->** если пора сформировать новый отсчёт:
        **->** сбрасывает счётчик отсчётов
        **->** вызывает `onSample(...)` с текущим отсчётом (```javascript this.sample```)
  - "📚  затем импортируй свой файл из 📄  ~/code/index.js~"
  - "и добавь соответствующий ключ `APU` в экспортируемый объект"
  responses:
  - "(*) как понять, что пора формировать новый отсчёт? [time]"

time:
  messages:
  - "каждый вызов `step(...)` — это цикл APU, а APU работает на частоте 894887 Гц"
  - "чтобы получать 44100 отсчётов в секунду, просто раздели одно на другое!"
  - "894887 / 44100 — это 20 циклов APU на отсчёт"
  - "значит, новый отсчёт нужно выдавать, когда ```javascript this.sampleCounter``` достигает 20"
  responses:
  - ...exercise
