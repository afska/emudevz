---
main:
  messages:
  - on va enfin ajouter <l'audio> à notre émulateur ! 🔊
  - c'est moins intuitif que la <vidéo>, donc je dois d'abord expliquer quelques trucs
  responses:
  - comment ça marche ? [how]

how:
  messages:
  - 🌊  <l'audio> fonctionne en définissant des ondes qui correspondent directement à ce que font les haut-parleurs
  - 🎵  quand un haut-parleur vibre à une fréquence particulière, il crée une note
  - 📈  puisque le temps est une <unité continue>, les ordinateurs stockent les ondes sous forme d'échantillons — des nombres qui définissent la hauteur de l'onde à un instant précis
  - 🔢  dans le NEEES, les échantillons sont des nombres dans la plage ~0-15~, et lors de l'émulation de l'APU, on envoie 44100 échantillons par seconde à la carte son
  - c'est ce qu'on appelle la fréquence d'échantillonnage
  responses:
  - (*) à quoi ressemble une onde ? [wave]
  - comment l'APU génère les échantillons ? [samples]

wave:
  messages:
  - elle est... <périodique> !
  - <{wave_square.png}>
  - c'est une onde carrée à volume maximum, une forme d'onde courante utilisée par l'APU
  - la période indique le temps nécessaire pour effectuer une répétition complète
  - "`period = 1 / frequency`, donc les périodes plus basses donnent des notes plus aiguës"
  - plus l'amplitude est grande, plus le volume est élevé
  - et comme je l'ai dit, elles sont stockées comme un flux d'échantillons
  - voilà une onde plus complexe
  - <{wave.png}>
  - tu peux voir comment stocker la forme d'onde comme une <séquence de points>
  - les échantillons !
  responses:
  - ...how

samples:
  messages:
  - comme le CPU et le PPU, l'APU fonctionne avec des cycles 🚲
  - un cycle est la plus petite unité de temps, correspondant à un tick d'horloge pendant lequel il met à jour son état interne d'un pas
  - l'APU 🔊  tourne <2x> plus lentement que le CPU 🧠
  - donc les cycles APU sont plus lents (chaque cycle APU dure, en temps réel, ~deux fois plus longtemps~ qu'un cycle CPU)
  - <{unit_speeds.png}>
  responses:
  - comment on commence ? [exercise]

exercise:
  messages:
  - 📚  crée un fichier pour le code de l'APU, en utilisant 📄  ~/tmpl/apu/APU.js~ comme modèle
  - |-
    📚  pour suivre le timing, ajoute cette méthode :
    **step(onSample)**:
      **->** incrémente le compteur d'échantillons
      **->** si c'est le moment de produire un nouvel échantillon :
        **->** remet le compteur d'échantillons à zéro
        **->** appelle `onSample(...)` avec l'échantillon courant (```javascript this.sample```)
  - 📚  ensuite, importe ton fichier depuis 📄  ~/code/index.js~
  - et ajoute la clé `APU` correspondante à l'objet exporté
  responses:
  - (*) comment je sais quand c'est le moment de produire un nouvel échantillon ? [time]

time:
  messages:
  - chaque appel à `step(...)` correspond à un cycle APU, et l'APU tourne à 894887 Hz
  - pour produire 44100 échantillons par seconde, divise les deux !
  - 894887 / 44100 nous donne 20 cycles APU par échantillon
  - donc tu dois fournir un nouvel échantillon chaque fois que ```javascript this.sampleCounter``` atteint 20
  responses:
  - ...exercise
