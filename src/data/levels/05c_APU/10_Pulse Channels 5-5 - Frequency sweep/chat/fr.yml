main:
  messages:
  - si tu as lancé l'émulateur, tu as probablement remarqué que les <sons de saut> et autres <sfx> sonnent un peu...
  - sans inspiration
  - l'unité de balayage peut modifier progressivement la fréquence vers le haut ou le bas, créant le meilleur effet de saut produit par des <plombiers> ! 👨‍ 🔧
  responses:
  - comment ça marche ? [how]

how:
  messages:
  - un peu comme l'enveloppe, mais au lieu de changer le <volume>, ça change le timer du canal, ce qui affecte la <hauteur tonale> !
  - c'est un peu plus complexe quand même, parce que le changement n'est pas <constant>
  - "les jeux écrivent 4 paramètres dans 🧹  PulseSweep :"
  - ⏰  une période de diviseur, qui détermine à quelle vitesse la fréquence va changer
  - ➗  un <compteur de décalage>, qui détermine à quel point la transition sera progressive
  - ⛔  un <flag de négation>, qui détermine si le changement est vers le bas ou vers le haut
  - 🔛  un <flag d'activation>, qui active l'unité de balayage
  - <{frequency_sweep.png;30x30}>
  - |-
    à chaque demi-trame le diviseur décompte, et si le compteur atteint 0, il calcule la quantité de changement comme ça :
      ```javascript const sweepDelta = channel.timer >> shiftCount;```
  - |-
    ensuite, selon le <flag de négation>, il augmente ou diminue le timer :
      ```javascript channel.timer += sweepDelta * (negateFlag ? -1 : 1);```
  responses:
  - (*) que fait le <décalage à droite> ? [shifting]
  - super, j'imagine qu'on peut maintenant le coder [exercise]

shifting:
  messages:
  - "`number >> 1` décale les bits de `number` vers la droite, une fois"
  - ça divise le nombre par 2
  - "`number >> 2` le fait deux fois, et donc divise le nombre par 4"
  - donc, en pratique, des <compteurs de décalage> plus élevés mènent à des changements plus progressifs
  responses:
  - ...how

exercise:
  messages:
  - |-
    📚  implémente dans 🧹  `PulseSweep` :
    **onLoad()**:
      **->** utilise ```javascript this.addField(...)``` pour définir 4 champs : `shiftCount`, `negateFlag`, `dividerPeriodMinusOne`, `enabledFlag`
      (utilise 📄  ~/docs/apu/audio_registers.en.md~ comme référence)
    **onWrite(value)**:
      **->** définit la valeur avec ```javascript this.setValue(...)```
  - |-
    📚  crée une classe 🧹  `FrequencySweep` avec ce qui suit :
    **constructor(channel)**:
      **->** sauvegarde le paramètre comme propriété (```javascript this.channel```)
      **->** met ```javascript this.startFlag = false```
      **->** met ```javascript this.dividerCount = 0```
      **->** met ```javascript this.mute = false```
    **clock()**:
      **->** si (
          le <flag d'activation> est activé <ET>
          le <compteur de décalage> est supérieur à 0 <ET>
          le <compteur de diviseur> est 0 <ET>
          ```javascript !this.mute```
        ):
          ```javascript const sweepDelta = this.channel.timer >> register.shiftCount;
          this.channel.timer += sweepDelta * (register.negateFlag ? -1 : 1);```
        (où `register` est, bien sûr, 🧹  PulseSweep)
      **->** si le <compteur de diviseur> est 0 <OU> si le <flag de départ> est activé
        **->** met ```javascript this.dividerCount``` à `dividerPeriodMinusOne` de 🧹  PulseSweep
        **->** efface le <flag de départ>
      **->** sinon :
        **->** décrémente le <compteur de diviseur>
    **muteIfNeeded()**:
      **->** met ```javascript this.mute = this.channel.timer < 8 || this.channel.timer > 0x7ff```
  - |-
    📚  dans 🟦  `PulseChannel` :
    **->** importe cette classe et ajoute une propriété `frequencySweep` avec une nouvelle instance (passe ```javascript this``` au constructeur !)
    **->** modifie **sample()** pour que le <retour anticipé> vérifie aussi ```javascript this.frequencySweep.mute```
    **->** modifie **step()** pour que :
      - il appelle la méthode `muteIfNeeded()` de `frequencySweep`
      - la méthode `updateTimer()` ne soit appelée que si `enabledFlag` de 🧹  PulseSweep est désactivé
    **->** implémente cette méthode :
    **halfFrame()**:
      **->** __continue à horloge le compteur de longueur comme avant__
      **->** appelle ```javascript this.frequencySweep.clock()```
  - |-
    📚  ah oui, dans 🧹  `PulseSweep`, encore un truc :
    **onWrite(value)**:
      **->** __conserve le comportement existant__
      **->** on doit activer le `startFlag` du `frequencySweep` du canal ici !
      (ça force le diviseur à se recharger au prochain tick)
