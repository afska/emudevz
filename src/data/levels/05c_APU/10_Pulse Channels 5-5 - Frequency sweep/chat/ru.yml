exercise:
  messages:
  - |-
    📚  реализуй в 🧹  `PulseSweep`:
    **onLoad()**:
      **->** через ```javascript this.addField(...)``` задаёт 4 поля: `shiftCount`, `negateFlag`, `dividerPeriodMinusOne`, `enabledFlag`
      (сверяйся с 📄  ~/docs/apu/audio_registers.ru.md~)
    **onWrite(value)**:
      **->** задаёт значение через ```javascript this.setValue(...)```
  - |-
    📚  создай класс 🧹  `FrequencySweep` со следующим:
    **constructor(channel)**:
      **->** сохраняет параметр в свойстве (```javascript this.channel```)
      **->** задаёт ```javascript this.startFlag = false```
      **->** задаёт ```javascript this.dividerCount = 0```
      **->** задаёт ```javascript this.mute = false```
    **clock()**:
      **->** если (
          <флаг включения> установлен <И>
          <число разрядов сдвига> больше 0 <И>
          <счётчик делителя> равен 0 <И>
          ```javascript !this.mute```
        ):
          ```javascript const sweepDelta = this.channel.timer >> register.shiftCount;
          this.channel.timer += sweepDelta * (register.negateFlag ? -1 : 1);```
        (где `register` — это, конечно, 🧹  PulseSweep)
      **->** если <счётчик делителя> равен 0 <ИЛИ> установлен <флаг запуска>
        **->** задаёт ```javascript this.dividerCount``` равным `dividerPeriodMinusOne` из 🧹  PulseSweep
        **->** сбрасывает <флаг запуска>
      **->** иначе:
        **->** уменьшает <счётчик делителя>
    **muteIfNeeded()**:
      **->** задаёт ```javascript this.mute = this.channel.timer < 8 || this.channel.timer > 0x7ff```
  - |-
    📚  в 🟦  `PulseChannel`:
    **->** импортируй этот класс и добавь свойство `frequencySweep` с новым экземпляром (передай ```javascript this``` в конструктор!)
    **->** измени **sample()**, чтобы <ранний выход> также учитывал ```javascript this.frequencySweep.mute```
    **->** измени **step()** так:
      - вызывается метод `muteIfNeeded()` у `frequencySweep`
      - метод `updateTimer()` вызывается только при сброшенном `enabledFlag` в 🧹  PulseSweep
    **->** реализуй этот метод:
    **halfFrame()**:
      **->** __продолжай обновлять счётчик длины, как раньше__
      **->** вызывает ```javascript this.frequencySweep.clock()```
  - |-
    📚  ах да, ещё кое-что в 🧹  `PulseSweep`:
    **onWrite(value)**:
      **->** __сохрани текущее поведение__
      **->** здесь нужно установить `startFlag` у `frequencySweep` канала!
      (тогда делитель перезагрузится на следующем такте)
