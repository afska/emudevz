exercise:
  messages:
  - ouais, pour nous c'est plus simple à implémenter
  - 📚  crée une classe `DMCChannel`, en utilisant 📄  ~/tmpl/apu/DMCChannel.js~ comme template
  - |-
    📚  dans 🔊  `APU` :
    **->** importe le canal et ajoute une clé `dmc` à ```javascript this.channels``` avec une nouvelle instance
      (note que le constructeur reçoit à la fois `apu` et `cpu` ! on en aura besoin plus tard !)
    **->** dans `step()`, avant d'incrémenter le compteur de samples, appelle ```javascript this.channels.dmc.step()```
    **->** aussi dans `step()`, ajoute le Canal DMC dans le mix :
      ```javascript const dmc = this.channels.dmc.sample();
      this.sample = (pulse1 + pulse2 + triangle + noise + dmc) * 0.01;

      onSample(this.sample, pulse1, pulse2, triangle, noise, dmc);```
  - |-
      📚  implémente dans 📥  `DMCLoad` :
      **onLoad()**:
        **->** utilise ```javascript this.addField(...)``` pour définir un champ `directLoad` de 7 bits à partir du bit 0
      **onWrite(value)**:
        **->** définit la valeur avec ```javascript this.setValue(...)```
        **->** définit le <sample de sortie> du canal à ```javascript this.directLoad```
  responses: []
