---
main:
  messages:
  - le 📦  Canal DMC donne aux jeux la capacité d'émettre leurs propres samples
  - ça permet de créer n'importe quelle forme d'onde ; pas seulement des ondes pulsées, triangulaires, ou du bruit !
  - "il a deux modes de fonctionnement :"
  - "📥  <Chargement direct> : les jeux chargent directement un sample 7 bits dans l'APU (haute qualité, mais gourmand en CPU)"
  - "🤏  <Delta Modulation> : l'APU décode automatiquement un flux DPCM en utilisant la technique de Delta Modulation, où chaque sample est stocké comme la différence (<delta>) par rapport au précédent (basse qualité, mais plus léger)"
  responses:
  - (*) le nom est marrant [name]
  - le chargement direct ça a l'air plus simple [exercise]

