exercise:
  messages:
  - "да, нам её проще реализовать"
  - "📚  создай класс `DMCChannel` по шаблону 📄  ~/tmpl/apu/DMCChannel.js~"
  - |-
    📚  в 🔊  `APU`:
    **->** импортируй канал и добавь ключ `dmc` в ```javascript this.channels``` с новым экземпляром
      (обрати внимание: конструктор принимает и `apu`, и `cpu`! позже это пригодится!)
    **->** в `step()`, перед увеличением счётчика отсчётов, вызывай ```javascript this.channels.dmc.step()```
    **->** там же, в `step()`, добавь канал DMC в смесь:
      ```javascript const dmc = this.channels.dmc.sample();
      this.sample = (pulse1 + pulse2 + triangle + noise + dmc) * 0.01;

      onSample(this.sample, pulse1, pulse2, triangle, noise, dmc);```
  - |-
      📚  реализуй в 📥  `DMCLoad`:
      **onLoad()**:
        **->** через ```javascript this.addField(...)``` задаёт 7-битное поле `directLoad`, начиная с бита 0
      **onWrite(value)**:
        **->** задаёт значение через ```javascript this.setValue(...)```
        **->** задаёт выходной отсчёт канала равным ```javascript this.directLoad```
  responses: []
