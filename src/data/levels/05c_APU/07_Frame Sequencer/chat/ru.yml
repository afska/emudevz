exercise:
  messages:
  - |-
    📚  реализуй в 🧮  `APUFrameCounter`:
    **onLoad()**:
      **->** через ```javascript this.addField(...)``` задаёт поле `use5StepSequencer` в бите 7
    **onWrite(value)**:
      **->** задаёт значение через ```javascript this.setValue(...)```
      **->** вызывает ```javascript this.apu.frameSequencer.reset()```
      **->** вызывает ```javascript this.apu.onQuarterFrameClock()```
      **->** вызывает ```javascript this.apu.onHalfFrameClock()```
  - |-
    📚  создай класс 🔀  `FrameSequencer` со следующим:
    **constructor(apu)**:
      **->** сохраняет параметр в свойстве (```javascript this.apu```)
      **->** вызывает ```javascript this.reset()```
    **reset()**:
      **->** обнуляет ```javascript this.counter```
        (это счётчик циклов!)
    **step()**:
      **->** увеличивает ```javascript this.counter```
      **->** определяет по добавленному полю, используется ли последовательность из пяти шагов
      **->** если наступила четверть кадра, вызывает ```javascript this.apu.onQuarterFrameClock()```
      **->** если наступила половина кадра, вызывает ```javascript this.apu.onHalfFrameClock()```
      **->** если это последний цикл последовательности, вызывает ```javascript this.reset()```
  - |-
    📚  в 🔊  `APU`:
    **->** добавь свойство `frameSequencer` с новым экземпляром
    **->** добавь методы `onQuarterFrameClock()` и `onHalfFrameClock()`, пока пустые
    **->** вызывай ```javascript this.frameSequencer.step()``` после увеличения счётчика отсчётов
      (до проверки, равен ли счётчик отсчётов 20)
  responses: []
