---
main:
  messages:
  - "les Canaux Pulse peuvent être mis en sourdine de plusieurs façons :"
  - 🔇  quand les jeux coupent le canal avec une écriture 🎛️  APUControl
  - 📏  quand le compteur de longueur est à 0
  - 🧹  quand l'unité de balayage est en sourdine
  - 🔈  quand le volume du canal est à 0
  - pour l'instant, on n'a couvert que la dernière situation
  - (en quelque sorte, on doit encore gérer l'enveloppe, mais ça viendra plus tard !)
  - "notre prochain objectif est de gérer les deux premiers : la mise en sourdine des canaux et le compteur de longueur !"
  responses:
  - et c'est quoi un compteur de longueur ? [length]

length:
  messages:
  - c'est ce que l'APU utilise pour suivre la <durée> des notes !
  - les jeux <chargent> sa valeur initiale pour indiquer la durée de la note
  - ensuite cette valeur est décrémentée à chaque demi-frame
  - et quand elle atteint 0, le canal est mis en sourdine ! 🤐
  responses:
  - (*) comment un jeu charge sa valeur ? [load]
  - (*) est-ce qu'il décrémente toujours sa valeur aux demi-frames ? [decrement]
  - codons ça [exercise]

load:
  messages:
  - il écrit dans un registre qui a <Length Counter Load> (ou sa forme abrégée, <LCL>) dans son nom
  - dans le cas des Canaux Pulse, c'est 🕛  PulseTimerHighLCL, où les 5 bits hauts sont l'<index de longueur>
  - cet index pointe vers une table fixe avec toutes les durées disponibles, regarde 📄  ~/lib/apu/noteLengths.js~
  - <{length_counter_load.png}>
  responses:
  - et si un jeu a besoin d'une durée qui n'est pas dans la liste ? [otherlengths]

otherlengths:
  messages:
  - c'est pas supporté !
  - du moins avec ce type de compteur de longueur
  - c'est pourquoi les jeux n'utilisent généralement pas cette méthode et finissent par changer le volume manuellement, ou en utilisant l'enveloppe
  responses:
  - ...length

decrement:
  messages:
  - seulement si son <flag d'arrêt> n'est pas activé
  - ça correspond au bit <L> dans 🟦  PulseControl
  - <{length_counter_halt.png;30x30}>
  responses:
  - ...length

exercise:
  messages:
  - |-
    📚  crée une classe 📏  `LengthCounter` avec ce qui suit :
    **constructor()**:
      **->** appelle ```javascript this.reset()```
    **reset()**:
      **->** met ```javascript this.counter = 0```
    **isActive()**:
      **->** retourne si ```javascript this.counter``` est supérieur à 0 ou non
    **clock(isEnabled, isHalted)**:
      **->** si `!isEnabled` :
        **->** appelle ```javascript this.reset()```
      **->** sinon :
        **->** si ```javascript this.isActive()``` et `!isHalted` :
          **->** décrémente le compteur
  - |-
    📚  dans 🟦  `PulseChannel` :
    **->** importe cette classe et ajoute une propriété `lengthCounter` avec une nouvelle instance
    **->** modifie **sample()** pour que si ```javascript !this.isEnabled()``` ou si le compteur de longueur n'est pas actif, il retourne le dernier sample généré sans rien changer
    **->** ajoute les méthodes suivantes :
    **quarterFrame()**:
      **[!]** laisse vide pour l'instant
    **halfFrame()**:
      **->** appelle la méthode `clock(...)` du compteur de longueur
        (utilise ```javascript this.isEnabled()``` comme premier argument)
        (pour le flag d'arrêt, cherche `envelopeLoopOrLengthCounterHalt` dans le registre 🟦  PulseControl)
  - |-
    📚  dans l'APU 🔊  `APU` :
    **onQuarterFrameClock()**:
      **->** appelle `quarterFrame()` sur les deux instances de canal Pulse
    **onHalfFrameClock()**:
      **->** appelle `halfFrame()` sur les deux instances de canal Pulse
  - |-
    📚  implémente dans 🕛  `PulseTimerHighLCL` :
    **onLoad()**:
      **->** utilise ```javascript this.addField(...)``` pour définir un champ `lengthCounterLoad` de 5 bits depuis le bit 3
    **onWrite(value)**:
      **->** __conserve le comportement existant__
      **->** détermine la nouvelle longueur en accédant au tableau `noteLengths` avec l'index ```javascript this.lengthCounterLoad```
        (utilise 📄  ~/lib/apu/noteLengths.js~ pour obtenir le tableau)
      **->** assigne la nouvelle longueur à la propriété `counter` du compteur de longueur du canal
  - |-
    📚  implémente dans 🎛️  `APUControl` :
    **onWrite(value)**:
      **->** __conserve le comportement existant__
      **->** si `!this.enablePulse1` :
        **->** réinitialise le compteur de longueur de <Pulse 1>
      **->** si `!this.enablePulse2` :
        **->** réinitialise le compteur de longueur de <Pulse 2>
  responses: []
