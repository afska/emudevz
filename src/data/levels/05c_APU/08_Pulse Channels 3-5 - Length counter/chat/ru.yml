---
main:
  messages:
  - "импульсные каналы могут замолкать по разным причинам:"
  - "🔇  когда игра выключает канал записью в 🎛️  APUControl"
  - "📏  когда счётчик длины равен 0"
  - "🧹  когда блок свипа заглушает канал"
  - "🔈  когда громкость канала равна 0"
  - "пока мы разобрали только последнюю ситуацию"
  - "(и то частично: ещё нужно заняться огибающей, но это позже!)"
  - "дальше обработаем первые две: выключение каналов и счётчик длины!"
  responses:
  - "а что такое счётчик длины? [length]"

length:
  messages:
  - "с его помощью APU отслеживает <длительность> нот!"
  - "игры <загружают> начальное значение, которое задаёт длину ноты"
  - "затем это значение уменьшается каждую половину кадра"
  - "когда оно достигает 0, канал замолкает! 🤐"
  responses:
  - "(*) как игра загружает это значение? [load]"
  - "(*) значение уменьшается на каждой половине кадра? [decrement]"
  - "давай напишем код [exercise]"

load:
  messages:
  - "игра записывает в регистр, в имени которого есть <Length Counter Load> («загрузка счётчика длины») или сокращение <LCL>"
  - "для импульсных каналов это 🕛  PulseTimerHighLCL: его старшие 5 бит задают <индекс длины>"
  - "индекс указывает на фиксированную таблицу всех доступных длительностей — загляни в 📄  ~/lib/apu/noteLengths.js~"
  - <{length_counter_load.png}>
  responses:
  - "а если игре нужна длина, которой нет в списке? [otherlengths]"

otherlengths:
  messages:
  - "это не поддерживается!"
  - "по крайней мере, этим типом счётчика длины"
  - "поэтому игры обычно обходятся без него: меняют громкость вручную или используют огибающую"
  responses:
  - ...length

decrement:
  messages:
  - "только если <флаг остановки> не установлен"
  - "это бит <L> в 🟦  PulseControl"
  - <{length_counter_halt.png;30x30}>
  responses:
  - ...length

exercise:
  messages:
  - |-
    📚  создай класс 📏  `LengthCounter` со следующим:
    **constructor()**:
      **->** вызывает ```javascript this.reset()```
    **reset()**:
      **->** задаёт ```javascript this.counter = 0```
    **isActive()**:
      **->** возвращает, больше ли ```javascript this.counter``` нуля
    **clock(isEnabled, isHalted)**:
      **->** если `!isEnabled`:
        **->** вызывает ```javascript this.reset()```
      **->** иначе:
        **->** если ```javascript this.isActive()``` и `!isHalted`:
          **->** уменьшает счётчик
  - |-
    📚  в 🟦  `PulseChannel`:
    **->** импортируй этот класс и добавь свойство `lengthCounter` с новым экземпляром
    **->** измени **sample()**: если ```javascript !this.isEnabled()``` или счётчик длины неактивен, возвращай последний созданный отсчёт, ничего не меняя
    **->** добавь следующие методы:
    **quarterFrame()**:
      **[!]** пока оставь пустым
    **halfFrame()**:
      **->** вызывает метод `clock(...)` счётчика длины
        (первым аргументом передай ```javascript this.isEnabled()```)
        (для флага остановки возьми `envelopeLoopOrLengthCounterHalt` из регистра 🟦  PulseControl)
  - |-
    📚  в 🔊  `APU`:
    **onQuarterFrameClock()**:
      **->** вызывает `quarterFrame()` у обоих экземпляров импульсных каналов
    **onHalfFrameClock()**:
      **->** вызывает `halfFrame()` у обоих экземпляров импульсных каналов
  - |-
    📚  реализуй в 🕛  `PulseTimerHighLCL`:
    **onLoad()**:
      **->** через ```javascript this.addField(...)``` задаёт 5-битное поле `lengthCounterLoad`, начиная с бита 3
    **onWrite(value)**:
      **->** __сохрани текущее поведение__
      **->** определяет новую длину по элементу массива `noteLengths` с индексом ```javascript this.lengthCounterLoad```
        (массив возьми из 📄  ~/lib/apu/noteLengths.js~)
      **->** записывает новую длину в свойство `counter` счётчика длины канала
  - |-
    📚  реализуй в 🎛️  `APUControl`:
    **onWrite(value)**:
      **->** __сохрани текущее поведение__
      **->** если `!this.enablePulse1`:
        **->** сбрось счётчик длины <импульсного канала 1>
      **->** если `!this.enablePulse2`:
        **->** сбрось счётчик длины <импульсного канала 2>
  responses: []
