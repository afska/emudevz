---
main:
  messages:
  - "🧠  CPU и 🔊  APU общаются через 21 регистр, отображённый в память"
  - "они находятся по адресам CPU $4000-$4013, $4015 и $4017"
  - "загляни в 📄  ~/docs/apu/audio_registers.ru.md~"
  responses:
  - "покажи пример 🙏 [example]"

example:
  messages:
  - "допустим, игре нужно настроить импульсный канал 1 на заполнение ~50%~ и постоянную громкость 6"
  - "за это отвечают биты $4000 (🟦  Pulse1Control)"
  - "в столбце ~Биты~ ~DD~ — коэффициент заполнения, ~C~ — флаг постоянной громкости, а ~NNNN~ — громкость"
  - "поэтому игра записывает в $4000 число 150 (в двоичной системе ~10010110~)"
  - "а 🔊  APU использует это значение, чтобы изменить импульсную волну"
  - "запись в $4000 меняет сразу 4 параметра (~DD~, ~L~, ~C~ и ~NNNN~)"
  - <{Pulse1Control.png}>
  responses:
  - "то есть эти регистры просто хранят числа? 🔢 [numbers]"

numbers:
  messages: 
  - "да, но некоторые вызывают <особые эффекты>, когда 🧠  CPU записывает в них значения"
  - "эти побочные эффекты могут сбрасывать длительность нот, запускать свип частоты или даже отключать целые каналы!"
  - "у меня есть класс, который поможет это реализовать — воспользуйся им 📖"
  responses:
  - "как им пользоваться? [exercise]"

exercise:
  messages:
  - "прочитай документацию в 📄  ~/docs/lib/InMemoryRegister.ru.md~"
  - "а для файла звуковых регистров возьми шаблон 📄  ~/tmpl/apu/AudioRegisters.js~"
  - "регистры 🟦  `PulseControl` и 🎛️  `APUControl` уже реализованы"
  - "обрати внимание: для каждого поля из столбца ~Биты~ они вызывают `addField(...)`"
  - "так создаются <автоматические свойства>: после записи APU может читать их значения (например, ```javascript pulse1Control.dutyCycleId```)"
  - "📚  создай класс `AudioRegisters` по этому шаблону"
  - |-
    📚  добавь в 🔊  `APU` свойство `registers` со значением:
      ```javascript new AudioRegisters(this)```
  - |-
    📚  наконец, отобрази их в 🐏  `CPUMemory` (области $4000-$4013, $4015 и $4017):
      - при <чтении> возвращай ```javascript this.apu.registers.read(address)```
      - при <записи> вызывай ```javascript this.apu.registers.write(address, value)``` и выходи из метода
  - "будь осторожнее с 🧮  APUFrameCounter: у него общий адрес со вторым портом 🎮  контроллера; <чтение> не отображай! только <запись>!"
  responses: []
