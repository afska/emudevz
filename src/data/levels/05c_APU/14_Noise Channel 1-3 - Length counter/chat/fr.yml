exercise:
  messages:
  - comme d'hab, en surveillant 🎛️  APUControl et le 📏  length counter
  - il a aussi une 📉  envelope ! qu'on verra plus tard
  - là c'est du classique, donc je vais fournir un template de base et tu vas tout brancher
  - 📚  crée une classe `NoiseChannel`, en utilisant 📄  ~/tmpl/apu/NoiseChannel.js~ comme template
  - |-
    📚  dans 🔊  `APU` :
    **->** importe le canal et ajoute une clé `noise` à ```javascript this.channels``` avec une nouvelle instance
    **->** dans `step()`, avant d'incrémenter le compteur de samples, appelle ```javascript this.channels.noise.step()```
    **->** aussi dans `step()`, ajoute le noise channel dans le mix :
      ```javascript const noise = this.channels.noise.sample();
      this.sample = (pulse1 + pulse2 + triangle + noise) * 0.01;

      onSample(this.sample, pulse1, pulse2, triangle, noise);```
    **->** dans `onQuarterFrameClock()`, appelle `quarterFrame()` sur l'instance du noise channel
    **->** dans `onHalfFrameClock()`, appelle `halfFrame()` sur l'instance du noise channel
  - |-
      📚  implémente dans 💥  `NoiseControl` :
      **onLoad()** :
        **->** utilise ```javascript this.addField(...)``` pour définir 3 champs : `volumeOrEnvelopePeriod`, `constantVolume`, `envelopeLoopOrLengthCounterHalt`
        (utilise 📄  ~/docs/apu/audio_registers.en.md~ pour référence)
      **onWrite(value)** :
        **->** définit la valeur avec ```javascript this.setValue(...)```
  - |-
      📚  implémente dans 📏  `NoiseLCL` :
      **onLoad()** :
        **->** utilise ```javascript this.addField(...)``` pour définir un champ `lengthCounterLoad` de 5 bits à partir du bit 3
      **onWrite(value)** :
        **->** définit la valeur avec ```javascript this.setValue(...)```
        **->** détermine la nouvelle longueur en accédant au tableau `noteLengths` avec l'index ```javascript this.lengthCounterLoad```
          (utilise 📄  ~/lib/apu/noteLengths.js~ pour obtenir le tableau)
        **->** assigne la nouvelle longueur à la propriété `counter` du length counter du canal
  - |-
    📚  implémente dans 🎛️  `APUControl` :
    **onWrite(value)** :
      **->** __garde le comportement existant__
      **->** si `!this.enableNoise` :
        **->** remet à zéro le length counter du canal
  responses:
  - "(*) pourquoi le template que t'as fourni utilise `random()` ? [random]"

