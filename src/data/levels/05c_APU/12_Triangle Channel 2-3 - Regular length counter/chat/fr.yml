exercise:
  messages:
  - |-
    📚  implémente dans 📏  `TriangleLengthControl` :
    **onLoad()** :
      **->** utilise ```javascript this.addField(...)``` pour définir un champ `halt` mappé au bit 7
    **onWrite(value)** :
      **->** définit la valeur avec ```javascript this.setValue(...)```
  - |-
    📚  dans 🔺  `TriangleChannel` :
    **->** importe la classe 📏  `LengthCounter` et ajoute une propriété `lengthCounter` avec une nouvelle instance
    **->** modifie **sample()** pour que si ```javascript !this.isEnabled()``` ou que le length counter n'est pas actif, il retourne le dernier sample généré, sans rien changer
    **->** ajoute les méthodes suivantes :
    **quarterFrame()** :
      **[!]** laisse vide pour l'instant
    **halfFrame()** :
      **->** appelle la méthode `clock(...)` du length counter
        (utilise ```javascript this.isEnabled()``` comme premier argument)
        (pour le flag halt, utilise le flag `halt` ajouté dans le registre 📏  TriangleLengthControl)
    **isEnabled()** :
      **->** retourne ```javascript !!this.apu.registers.apuControl.enableTriangle```
  - |-
    📚  dans 🔊  `APU` :
    **onQuarterFrameClock()** :
      **->** appelle `quarterFrame()` sur l'instance du triangle channel
    **onHalfFrameClock()** :
      **->** appelle `halfFrame()` sur l'instance du triangle channel
  - |-
    📚  implémente dans 🕛  `TriangleTimerHighLCL` :
    **onLoad()** :
      **->** utilise ```javascript this.addField(...)``` pour définir un champ `lengthCounterLoad` de 5 bits à partir du bit 3
    **onWrite(value)** :
      **->** __garde le comportement existant__
      **->** détermine la nouvelle longueur en accédant au tableau `noteLengths` avec l'index ```javascript this.lengthCounterLoad```
        (utilise 📄  ~/lib/apu/noteLengths.js~ pour obtenir le tableau)
      **->** assigne la nouvelle longueur à la propriété `counter` du length counter du canal
  - |-
    📚  implémente dans 🎛️  `APUControl` :
    **onWrite(value)** :
      **->** __garde le comportement existant__
      **->** si `!this.enableTriangle` :
        **->** remet à zéro le length counter du canal
  responses: []
