---
main:
  messages:
  - quand elle est activée, l'enveloppe peut diminuer progressivement le volume du canal, créant un <fondu> (fade out) 📉
  - elle commence toujours au volume maximum (~15~) et les jeux contrôlent la vitesse de diminution du volume en définissant une période de diviseur
  - quand le volume atteint 0, il peut revenir en boucle à 15 si son flag de boucle est activé
  responses:
  - et quand elle est désactivée ? [disabled]

disabled:
  messages:
  - quand elle est désactivée, le canal sort simplement le volume défini dans les 4 premiers bits du 🟦  PulseControl
  - <{volume_envelope_disabled.png}>
  - remarque comment ces 4 bits sont réutilisés comme période de diviseur quand elle est activée
  - <{volume_envelope_enabled.png}>
  responses:
  - ça a l'air simple ! [exercise]

exercise:
  messages:
  - |-
    📚  crée une classe 📏  `VolumeEnvelope` avec ce qui suit :
    **constructor()**:
      **->** met ```javascript this.startFlag = false```
      **->** met ```javascript this.dividerCount = 0```
      **->** met ```javascript this.volume = 0```
    **clock(period, loop)**:
      **->** si le <flag de départ> est activé :
        **->** efface le <flag de départ>
        **->** met le <volume> à 15
        **->** met le <compteur de diviseur> à `period`
        **->** retourne

      **->** si le <compteur de diviseur> est supérieur à 0 :
        **->** décrémente le <compteur de diviseur>
        **->** retourne

      **->** __(à ce stade, le diviseur est à 0, donc on doit agir)__

      **->** remet le <compteur de diviseur> à `period`
      **->** si le <volume> est 0 :
        **->** si `loop` :
          **->** remet le <volume> à 15
      **->** sinon :
        **->** décrémente le <volume>
  - |-
    📚  dans 🟦  `PulseChannel` :
    **->** importe cette classe et ajoute une propriété `volumeEnvelope` avec une nouvelle instance
    **->** modifie **sample()** pour que le volume de l'oscillateur dépende du flag `constantVolume` du 🟦  PulseControl :
      **->** quand on utilise un volume constant, conserve la logique actuelle
      **->** sinon, utilise ```javascript this.volumeEnvelope.volume```
    **->** implémente cette méthode :
    **quarterFrame()**:
      **->** appelle la méthode `clock(...)` de l'enveloppe de volume
        (pour `period`, utilise `volumeOrEnvelopePeriod` du 🟦  PulseControl)
        (pour `loop`, utilise `envelopeLoopOrLengthCounterHalt` du 🟦  PulseControl)
  - |-
    📚  implémente dans 🕛  `PulseTimerHighLCL` :
    **onWrite(value)**:
      **->** __conserve le comportement existant__
      **->** active le `startFlag` de l'enveloppe de volume du canal
  responses: []
