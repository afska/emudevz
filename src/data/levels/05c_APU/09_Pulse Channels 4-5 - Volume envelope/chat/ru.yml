exercise:
  messages:
  - |-
    📚  создай класс 📏  `VolumeEnvelope` со следующим:
    **constructor()**:
      **->** задаёт ```javascript this.startFlag = false```
      **->** задаёт ```javascript this.dividerCount = 0```
      **->** задаёт ```javascript this.volume = 0```
    **clock(period, loop)**:
      **->** если установлен <флаг запуска>:
        **->** сбрасывает <флаг запуска>
        **->** задаёт <громкость> 15
        **->** задаёт <счётчик делителя> равным `period`
        **->** выходит из метода

      **->** если <счётчик делителя> больше 0:
        **->** уменьшает <счётчик делителя>
        **->** выходит из метода

      **->** __(здесь делитель равен 0, значит, пора действовать)__
      
      **->** сбрасывает <счётчик делителя> в `period`
      **->** если <громкость> равна 0:
        **->** если `loop`:
          **->** сбрасывает <громкость> в 15
      **->** иначе:
        **->** уменьшает <громкость>
  - |-
    📚  в 🟦  `PulseChannel`:
    **->** импортируй этот класс и добавь свойство `volumeEnvelope` с новым экземпляром
    **->** измени **sample()**, чтобы громкость генератора зависела от флага `constantVolume` в 🟦  PulseControl:
      **->** при постоянной громкости сохрани текущую логику
      **->** иначе используй ```javascript this.volumeEnvelope.volume```
    **->** реализуй этот метод:
    **quarterFrame()**:
      **->** вызывает метод `clock(...)` огибающей громкости
        (для `period` возьми `volumeOrEnvelopePeriod` из 🟦  PulseControl)
        (для `loop` возьми `envelopeLoopOrLengthCounterHalt` из 🟦  PulseControl)
  - |-
    📚  реализуй в 🕛  `PulseTimerHighLCL`:
    **onWrite(value)**:
      **->** __сохрани текущее поведение__
      **->** устанавливает `startFlag` огибающей громкости канала
  responses: []
