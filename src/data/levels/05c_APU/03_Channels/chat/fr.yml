---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - on va faire un tour rapide des canaux audio de l'APU !
  - assure-toi que le <volume de la musique> n'est pas coupé, et continue
  responses:
  - ▶️  démarrer [start]

start:
  run: |
    {{Background}}.loadROM("/roms/.all/SuperTiltBro.neees", "demoRom");
  messages:
  - c'est l'incroyable musique de 🦸 🤸  <Super Tilt Bro>
  - ici, on peut voir presque tous les canaux audio en action
  - commençons par les 🟦  Canaux Pulse
  responses:
  - c'est quoi les Canaux Pulse ? 🟦 [pulse]

pulse:
  run: |
    if (emulation) {
      emulation.enabledChannels.pulse1 = true;
      emulation.enabledChannels.pulse2 = false;
      emulation.enabledChannels.triangle = false;
      emulation.enabledChannels.noise = false;
      emulation.enabledChannels.dmc = false;
    }
  messages:
  - ce sont des canaux dédiés à la production d'ondes pulse
  - il y en a <deux>
  - voici juste <Pulse 1>
  responses:
  - écoutons <Pulse 2> 👀 [pulse2]

pulse2:
  run: |
    if (emulation) {
      emulation.enabledChannels.pulse1 = false;
      emulation.enabledChannels.pulse2 = true;
      emulation.enabledChannels.triangle = false;
      emulation.enabledChannels.noise = false;
      emulation.enabledChannels.dmc = false;
    }
  messages:
  - voici <Pulse 2>
  - il crée le même type d'ondes que <Pulse 1>
  - et la magie commence quand ils jouent ensemble
  responses:
  - écoutons les deux ensemble [together]

together:
  run: |
    if (emulation) {
      emulation.enabledChannels.pulse1 = true;
      emulation.enabledChannels.pulse2 = true;
      emulation.enabledChannels.triangle = false;
      emulation.enabledChannels.noise = false;
      emulation.enabledChannels.dmc = false;
    }
  messages:
  - tu vois ?
  - ces deux canaux Pulse, combinés, peuvent créer de <puissantes mélodies> 🎶
  responses:
  - il se passe plein de trucs ici [alot]

alot:
  run: |
    {{Right}}.do((debuggerGUI) => {
      debuggerGUI.apu.selectedTab = "Pulse";
    });
  messages:
  - eh bien... ils supportent plein de <fonctionnalités>
  - comme les rapports cycliques configurables, les <fondus de volume> et les <balayages de note> !
  responses:
  - cool ! et les autres canaux ? [triangle]

triangle:
  run: |
    {{Right}}.do((debuggerGUI) => {
      debuggerGUI.apu.selectedTab = "Overview";
    });
    if (emulation) {
      emulation.enabledChannels.pulse1 = false;
      emulation.enabledChannels.pulse2 = false;
      emulation.enabledChannels.triangle = true;
      emulation.enabledChannels.noise = false;
      emulation.enabledChannels.dmc = false;
    }
  messages:
  - c'est le 🔺  Canal Triangle
  - il peut produire des ondes triangulaires à volume constant
  - et il est souvent utilisé pour les <lignes de basse> 🎸
  responses:
  - mélangeons-le avec la mélodie principale 🎶 [pulseagain]

pulseagain:
  run: |
    if (emulation) {
      emulation.enabledChannels.pulse1 = true;
      emulation.enabledChannels.pulse2 = true;
      emulation.enabledChannels.triangle = true;
      emulation.enabledChannels.noise = false;
      emulation.enabledChannels.dmc = false;
    }
  messages:
  - ouais
  - avec cette config, on a la mélodie principale et la basse
  - maintenant, la partie manquante...
  responses:
  - le Canal Bruit, j'imagine ? 💥 [noise]

noise:
  run: |
    if (emulation) {
      emulation.enabledChannels.pulse1 = false;
      emulation.enabledChannels.pulse2 = false;
      emulation.enabledChannels.triangle = false;
      emulation.enabledChannels.noise = true;
      emulation.enabledChannels.dmc = false;
    }
  messages:
  - yep !
  - le 💥  Canal Bruit génère du <bruit pseudo-aléatoire>
  - il est généralement utilisé pour les 🥁  <percussions> et les 💥  <effets spéciaux>
  responses:
  - écoutons aussi le Canal Triangle 🔺 [addtriangle]

addtriangle:
  run: |
    if (emulation) {
      emulation.enabledChannels.pulse1 = false;
      emulation.enabledChannels.pulse2 = false;
      emulation.enabledChannels.triangle = true;
      emulation.enabledChannels.noise = true;
      emulation.enabledChannels.dmc = false;
    }
  messages:
  - j'arrive déjà à voir ta tête qui groove, combinons à nouveau tous les canaux !
  responses:
  - ouais ! 🤘 [combined]

combined:
  run: |
    if (emulation) {
      emulation.enabledChannels.pulse1 = true;
      emulation.enabledChannels.pulse2 = true;
      emulation.enabledChannels.triangle = true;
      emulation.enabledChannels.noise = true;
      emulation.enabledChannels.dmc = false;
    }
  run-after-messages: |
    $.goTo("controls");
  messages:
  - comme tu peux le voir, avec un peu de <créativité>, on peut créer de jolies mélodies en combinant tous ces canaux ! ✨
  - il y a un canal supplémentaire qu'on n'a pas couvert ici, le 📦  Canal DMC
  - il permet aux jeux de fournir leurs ondes personnalisées directement à l'APU
  - |+
    celui-là aura droit à un traitement spécial plus tard, pas d'inquiétude !
  responses: []

controls:
  run: |
    {{Right}}.do((debuggerGUI) => {
      debuggerGUI.args.readOnly = false;
    });
  messages:
  - <! Contrôles activés.
  - j'ai <activé les contrôles> dans la vue débogueur pour que tu puisses t'amuser un moment
  - quand tu veux, fais-moi signe et on retournera à la programmation 👀
  responses:
  - ▶️  c'est bon, on continue [end]
