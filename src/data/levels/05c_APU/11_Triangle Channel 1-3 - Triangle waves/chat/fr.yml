main:
  messages:
  - implémentons le 🔺  Triangle Channel !
  - rappelle-toi, on doit d'abord récupérer la valeur du timer
  - ses 8 bits bas sont dans le registre 🕡  TriangleTimerLow, et ses 3 bits hauts dans 🕛  TriangleTimerHighLCL
  - <{triangle_timer.png}>
  - à partir du timer, on peut dériver la fréquence avec la même formule que pour les Pulse Channels
  - par contre, le pitch du triangle channel est <une octave plus bas>, donc on doit diviser la fréquence résultante par deux ⚗️
  - "```javascript frequency = 1789773 / (16 * (timer + 1)) / 2```"
  responses:
  - ah, c'est pour ça qu'il est utilisé pour les lignes de basse 🎸 [exercise]

exercise:
  messages:
  - exactement !
  - "je vais t'aider avec la génération de l'onde triangulaire, voici mon code d'oscillateur :"
  - 📄  ~/lib/apu/TriangleOscillator.js~
  - |-
    📚  implémente dans 🕛  `TriangleTimerHighLCL` :
    **onLoad()** :
      **->** utilise ```javascript this.addField(...)``` pour définir un champ `timerHigh` de 3 bits à partir du bit 0
    **onWrite(value)** :
      **->** définit la valeur avec ```javascript this.setValue(...)```
  - |-
    📚  crée une classe 🔺  `TriangleChannel` avec ce qui suit :
    **constructor(apu)** :
      **->** sauvegarde le paramètre en propriété (```javascript this.apu```)
      **->** sauvegarde l'objet de registres triangle dans une propriété :
        ```javascript this.registers = this.apu.registers.triangle;```
      **->** sauvegarde une propriété ```javascript this.oscillator``` avec une nouvelle instance du `TriangleOscillator` envoyé
    **sample()** :
      **->** calcule la valeur du timer à partir de 🕡  TriangleTimerLow et du champ `timerHigh` de 🕛  TriangleTimerHighLCL
        (utilise `byte.buildU16(...)` pour combiner les deux)
        (appelons ça `timer`)
      **->** si `timer` est inférieur à 2 ou supérieur à ~0x7ff~ :
        **->** retourne 0, le canal est mis en sourdine ici
      **->** définit la fréquence de l'oscillateur avec la formule :
        ```javascript this.oscillator.frequency = 1789773 / (16 * (timer + 1)) / 2;```
      **->** appelle la méthode `sample()` de l'oscillateur et retourne sa valeur
  - |-
    📚  dans 🔊  `APU` :
    **->** importe le canal et ajoute une clé `triangle` à ```javascript this.channels``` avec une nouvelle instance
    **->** dans `step()`, ajoute le triangle channel dans le mix :
      ```javascript const pulse1 = this.channels.pulses[0].sample();
      const pulse2 = this.channels.pulses[1].sample();
      const triangle = this.channels.triangle.sample();
      this.sample = (pulse1 + pulse2 + triangle) * 0.01;

      onSample(this.sample, pulse1, pulse2, triangle);```
  responses: []
