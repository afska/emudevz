---
main:
  messages:
  - "дальше можно запутаться, так что сразу поясню"
  - "в звуковой терминологии слово «sample» может означать две разные вещи:"
  - "📈  одно значение амплитуды в конкретный момент — отсчёт (то есть <одно число>)"
  - "🔊  записанный звуковой фрагмент — сэмпл (то есть <много чисел>!)"
  - "помни: регистры 🐏  DMCSampleAddress и 📐  DMCSampleLength используют <второе значение>!"
  - "(буду говорить «звуковой фрагмент», чтобы не путаться)"
  responses:
  - "понятно, как работает DPCM? [dpcm]"

dpcm:
  messages:
  - "игры записывают адрес звукового фрагмента в памяти в 🐏  DMCSampleAddress, а его длину в байтах — в 📐  DMCSampleLength"
  - |-
    точнее, настоящий адрес и длина вычисляются так:
      ```javascript clipAddress = 0xc000 + dmcSampleAddress * 64;
      clipLength = dmcSampleLength * 16 + 1;```
  - "затем в 📦  DMCControl записываются <период DPCM>, задающий частоту воспроизведения, и <флаг зацикливания>"
  - "наконец, игра записывает в 🎛️  APUControl значение с установленным битом 4: если канал DMC сейчас ничего не воспроизводит, начинается проигрывание"
  responses:
  - "а что дальше? [then]"

then:
  messages:
  - "дальше APU делает всё автоматически"
  - "канал начинает с выходного отсчёта 0 и настраивает делитель по <периоду DPCM>"
  - "на каждом тактовом событии делителя блок обрабатывает <один бит> потока и <меняет> выходной отсчёт"
  - |-
    этот бит задаёт <изменение>:
      **->** 1 означает ~+2~
      **->** 0 означает ~-2~
  - "когда все биты обработаны и звуковой фрагмент закончился, воспроизведение начинается заново, если установлен <флаг зацикливания>"
  responses:
  - "звучит сложно [exercise]"

exercise:
  messages:
  - "здесь много нюансов, и всё правильно реализовать непросто 😅"
  - "поэтому я дам тебе класс, который декодирует DPCM"
  - "а тебе останется подключить его к своему каналу"
  - |-
    📚  в 📦  `DMCChannel`:
    **->** импортируй 📄  ~/lib/apu/DPCM.js~ и добавь свойство `dpcm` с новым экземпляром
    **->** в `step()` вызывай ```javascript this.dpcm.update()```
  - |-
    📚  реализуй в 🎛️  `APUControl`:
    **onWrite(value)**:
      **->** __сохрани текущее поведение__
      **->** если `!this.enableDMC`:
        **->** вызывает ```javascript this.apu.channels.dmc.dpcm.stop()```
      **->** иначе если ```javascript this.apu.channels.dmc.dpcm.remainingBytes() === 0```
        **->** вызывает ```javascript this.apu.channels.dmc.dpcm.start()```
  responses: []
