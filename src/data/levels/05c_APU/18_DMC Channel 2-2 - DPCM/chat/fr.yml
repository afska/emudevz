---
main:
  messages:
  - ce qui suit pourrait prêter à confusion, alors autant le préciser tout de suite
  - "en jargon audio, \"sample\" peut avoir deux significations différentes :"
  - 📈  une seule valeur d'amplitude à un instant donné (alias <un nombre>)
  - 🔊  un clip sonore enregistré (alias <plusieurs nombres> !)
  - garde à l'esprit que les registres 🐏  DMCSampleAddress et 📐  DMCSampleLength font référence à la <deuxième signification> !
  - (j'essaierai de dire "clip sonore" pour éviter la confusion)
  responses:
  - compris, comment fonctionne DPCM ? [dpcm]

dpcm:
  messages:
  - les jeux écrivent l'adresse mémoire où est stocké le clip sonore dans 🐏  DMCSampleAddress et la longueur en octets dans 📐  DMCSampleLength
  - |-
    pas tout à fait, mais l'adresse et la longueur réelles peuvent être dérivées comme ça :
      ```javascript clipAddress = 0xc000 + dmcSampleAddress * 64;
      clipLength = dmcSampleLength * 16 + 1;```
  - ensuite, ils écrivent une <période DPCM> (qui détermine la fréquence de lecture) et un <flag de boucle> dans 📦  DMCControl
  - enfin, ils écrivent dans 🎛️  APUControl une valeur avec son bit 4 activé, ce qui démarre la lecture si le DMC Channel ne joue pas déjà un clip
  responses:
  - qu'est-ce qui se passe ensuite ? [then]

then:
  messages:
  - ensuite tout est géré automatiquement par l'APU
  - le canal démarre avec un sample de sortie à 0 et configure un diviseur basé sur la <période DPCM>
  - à chaque horloge du diviseur, l'unité traite <un bit> du flux et <modifie> le sample de sortie
  - |-
    ce bit détermine la <variation> :
      **->** un 1 signifie ~+2~
      **->** un 0 signifie ~-2~
  - quand il finit de traiter tous les bits (le clip sonore s'est terminé), la lecture repart depuis le début si le <flag de boucle> est activé
  responses:
  - ça a l'air compliqué [exercise]

exercise:
  messages:
  - il y a beaucoup de nuances là-dedans et ça peut être difficile à faire fonctionner correctement 😅
  - donc je vais te donner une classe qui gère le décodage DPCM
  - et tu peux juste l'intégrer dans ton canal
  - |-
    📚  dans 📦  `DMCChannel` :
    **->** importe 📄  ~/lib/apu/DPCM.js~ et ajoute une propriété `dpcm` avec une nouvelle instance
    **->** dans `step()`, appelle ```javascript this.dpcm.update()```
  - |-
    📚  implémente dans 🎛️  `APUControl` :
    **onWrite(value)**:
      **->** __garde le comportement existant__
      **->** si `!this.enableDMC` :
        **->** appelle ```javascript this.apu.channels.dmc.dpcm.stop()```
      **->** sinon si ```javascript this.apu.channels.dmc.dpcm.remainingBytes() === 0```
        **->** appelle ```javascript this.apu.channels.dmc.dpcm.start()```
  responses: []
