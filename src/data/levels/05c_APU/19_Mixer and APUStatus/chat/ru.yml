exercise:
  messages:
  - "📚  в 🔊  `APU` правильно смешай каналы по формуле выше"
  - |-
    📚  реализуй в 📊  `APUStatus`:
    **onRead()**:
      **->** возвращает байт, биты которого означают следующее:
        **->** бит 0: счётчик длины <импульсного канала 1> `> 0`
        **->** бит 1: счётчик длины <импульсного канала 2> `> 0`
        **->** бит 2: счётчик длины <треугольного канала> `> 0`
        **->** бит 3: счётчик длины <шумового канала> `> 0`
        **->** бит 4: у блока DPCM канала <DMC> `remainingBytes() > 0`
        **[!]** для сборки значения можно использовать `byte.bitfield(...)`
  responses: []
