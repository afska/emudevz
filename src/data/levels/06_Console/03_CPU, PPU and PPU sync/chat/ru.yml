---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - "до сих пор всё получалось отлично! 💪"
  - "на следующих уровнях покажу код по темам, которые мы ещё не обсуждали"
  - "давай посмотрим, как BrokenNEEES запускает наши компоненты <под капотом>"
  - <{unit_speeds.png}>
  - "🧠  CPU, 🖥️  PPU и 🔊  APU работают с такими скоростями"
  - "значит, на каждый цикл CPU должны приходиться 3 цикла PPU и ~0.5~ цикла APU"
  - "посмотри метод `step()`"
  - |-
    ещё можно посмотреть:
    - 💾  загрузку ROM (`load(...)`)
    - 🎮  обновление кнопок (`setButton(...)`)
    - 🔋  работу с файлом сохранения (`getSaveFile()`)
  responses:
  - "▶️  продолжить [end]"
