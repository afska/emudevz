---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - "так"
  - "{5}пора"
  - "{10}думаю, тебе уже можно рассказать"
  responses:
  - "что? [what]"

what:
  messages:
  - "на самом деле..."
  - "{30}BrokenNEEES — моя работа"
  - "{30}с тех пор как <ИИ> захватил всё, а программирование вручную почти исчезло, стало тяжело"
  - "{5}мне очень не хватает <программирования вручную>"
  - "{5}мне хотелось, чтобы кто-то ещё наслаждался программированием так же, как я"
  - "{5}а потом появилась наша переписка, и твой интерес к эмуляции вдохновил меня помочь"
  - "{10}на самом деле эмулятор не <сломан>: все эти ошибки там специально 😅"
  - "{5}это был повод научить кого-нибудь тому, что я люблю"
  - "{5}поэтому у меня всегда есть готовый код, чтобы помочь тебе двигаться дальше"
  - "{5}надеюсь, ты не злишься"
  responses:
  - "зачем придумывать ошибки? [why]"
  - "и что теперь? [integrate]"

why:
  messages:
  - "чтобы понять душу эмулятора, мало читать — нужно делать!"
  - "{5}а возможность играть без ошибок очень мотивирует 👾"
  responses:
  - "(*) значит, твоя «настоящая NEEES» тоже была эмулятором? [real]"
  - "ладно, что дальше? [integrate]"

real:
  messages:
  - "{10}😅 🤣 ☠️"
  responses:
  - ...why

integrate:
  run: |
    {{Top}}.load(null, "rom");
  messages:
  - "передам тебе полный контроль над 🕹️  эмулятором"
  - "{5}посмотрим..."
  run-after-messages: |
    level.startEffect("earthquake");
    setTimeout(() => {
      bus.emit("patching-end");
    }, 500);
  events: 
  - patching-end [done]

done:
  run: |
    level.stopEffect();
    book.unlock("useConsole");
  messages:
  - "✅  готово!"
  - "<! 🕹️  NEEES подключена."
  - "теперь значок 🕹️  в эмуляторе будет светиться ✨"
  - "если его включить, интерфейс будет искать класс `Emulator` в 📄  ~/code/index.js~"
  - "и от BrokenNEEES не останется и следа"
  responses:
  - "но у меня нет такого класса! [exercise]"

exercise:
  messages:
  - "да, сейчас передам тебе недостающий код"
  - "под твоим полным контролем будет как минимум 🌀  ядро эмулятора"
  - |-
    📚  создай файлы кода по этим шаблонам:
      📄  ~/tmpl/Emulator.js~
      📄  ~/tmpl/saveStates.js~
      📄  ~/tmpl/mappers/mappers.js~
      📄  ~/tmpl/mappers/0_NROM.js~
  - "📚  импортируй `Emulator.js` и экспортируй объект под ключом `Emulator` в 📄  ~/code/index.js~"
  - "учти, что пока будут работать только игры с <NROM> (маппер 0)"
  - "это исправим в главе 🗜️  Мапперы"
  responses:
  - "(*) а что с тестами? 🧪 [tests]"
  - "▶️  продолжить [credits]"

tests:
  messages:
  - "нужны модульные тесты? 🤔"
  - "да, если позже захочется улучшать эмулятор, они пригодятся для проверки, что всё работает"
  - |-
    и, конечно, со временем их тоже понадобится обновлять — вот они:
      📄  ~/tmpl/tests/apu.test.js~
      📄  ~/tmpl/tests/bus.test.js~
      📄  ~/tmpl/tests/cartridge.test.js~
      📄  ~/tmpl/tests/cpu.test.js~
      📄  ~/tmpl/tests/cpu_addressing_modes_1.test.js~
      📄  ~/tmpl/tests/cpu_addressing_modes_2.test.js~
      📄  ~/tmpl/tests/cpu_instructions_1.test.js~
      📄  ~/tmpl/tests/cpu_instructions_2.test.js~
      📄  ~/tmpl/tests/cpu_instructions_3.test.js~
      📄  ~/tmpl/tests/cpu_instructions_4.test.js~
      📄  ~/tmpl/tests/cpu_instructions_5.test.js~
      📄  ~/tmpl/tests/ppu.test.js~
  responses:
  - ...exercise

