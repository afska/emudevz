---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - ok
  - "{5}c'est l'heure"
  - "{10}je crois que c'est le moment de savoir"
  responses:
  - quoi ? [what]

what:
  messages:
  - en réalité...
  - "{30}j'ai créé BrokenNEEES"
  - "{30}c'est devenu difficile depuis que l'<IA> a tout pris et que la programmation manuelle a presque disparu"
  - "{5}la <programmation manuelle> me manque vraiment beaucoup"
  - "{5}je voulais que quelqu'un quelque part apprécie la programmation autant que moi"
  - "{5}puis je t'ai trouvé, et ton intérêt pour l'émulation m'a donné envie d'aider"
  - "{10}l'émulateur n'est pas vraiment <cassé>, c'étaient des bugs que j'ai plantés exprès 😅"
  - "{5}le but était d'avoir un prétexte pour enseigner à quelqu'un quelque chose que j'aime"
  - "{5}c'est pourquoi j'ai toujours du code prêt pour te guider"
  - "{5}j'espère que tu ne m'en veux pas"
  responses:
  - pourquoi de faux bugs ? [why]
  - et maintenant, on fait quoi ? [integrate]

why:
  messages:
  - on n'apprend pas l'âme d'un émulateur en lisant, on l'apprend en faisant !
  - "{5}et pouvoir vraiment jouer aux jeux sans bugs, c'est une super motivation 👾"
  responses:
  - (*) donc ton "vrai NEEES" c'était aussi ton émulateur ? [real]
  - ok, c'est quoi la suite ? [integrate]

real:
  messages:
  - "{10}😅 🤣 ☠️"
  responses:
  - ...why

integrate:
  run: |
    {{Top}}.load(null, "rom");
  messages:
  - je vais te donner le contrôle total de l'🕹️  Emulator
  - "{5}voyons voir..."
  run-after-messages: |
    level.startEffect("earthquake");
    setTimeout(() => {
      bus.emit("patching-end");
    }, 500);
  events:
  - patching-end [done]

done:
  run: |
    level.stopEffect();
    book.unlock("useConsole");
  messages:
  - ✅  fait !
  - <! 🕹️  NEEES intégré.
  - maintenant, l'icône 🕹️  dans l'émulateur va briller ✨
  - si tu l'actives, le frontend cherchera une classe `Emulator` dans 📄  ~/code/index.js~
  - et il n'y aura plus aucune trace de BrokenNEEES
  responses:
  - mais je n'ai pas cette classe ! [exercise]

exercise:
  messages:
  - ok, je vais te donner le code manquant
  - tu auras le contrôle total de, au moins, le 🌀  cœur de l'émulateur
  - |-
    📚  crée des fichiers de code depuis ces templates :
      📄  ~/tmpl/Emulator.js~
      📄  ~/tmpl/saveStates.js~
      📄  ~/tmpl/mappers/mappers.js~
      📄  ~/tmpl/mappers/0_NROM.js~
  - 📚  importe `Emulator.js` et exporte l'objet sous la clé `Emulator` dans 📄  ~/code/index.js~
  - note que de cette façon, seuls les jeux <NROM> (mapper 0) fonctionneront
  - tu corrigeras ça dans le chapitre 🗜️  Mappers
  responses:
  - (*) et les tests ? 🧪 [tests]
  - ▶️  continuer [credits]

tests:
  messages:
  - tu veux les tests unitaires ? 🤔
  - ouais, si tu améliores l'émulateur plus tard, ils peuvent être utiles pour s'assurer que tout marche
  - |-
    et bien sûr tu devras les mettre à jour tôt ou tard, donc les voilà :
      📄  ~/tmpl/tests/apu.test.js~
      📄  ~/tmpl/tests/bus.test.js~
      📄  ~/tmpl/tests/cartridge.test.js~
      📄  ~/tmpl/tests/cpu.test.js~
      📄  ~/tmpl/tests/cpu_addressing_modes_1.test.js~
      📄  ~/tmpl/tests/cpu_addressing_modes_2.test.js~
      📄  ~/tmpl/tests/cpu_instructions_1.test.js~
      📄  ~/tmpl/tests/cpu_instructions_2.test.js~
      📄  ~/tmpl/tests/cpu_instructions_3.test.js~
      📄  ~/tmpl/tests/cpu_instructions_4.test.js~
      📄  ~/tmpl/tests/cpu_instructions_5.test.js~
      📄  ~/tmpl/tests/ppu.test.js~
  responses:
  - ...exercise

credits:
  comment: |-
    // HACK: Using monospace numbers (𝟶 𝟷 𝟸 𝟹 𝟺 𝟻 𝟼 𝟽 𝟾 𝟿) to work around a dictionary bug
