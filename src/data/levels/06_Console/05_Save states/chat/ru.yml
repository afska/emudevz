---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - "📸  <сохранения состояния> — это просто снимки состояния выполнения, так что реализовать их легко"
  - "нужно <сериализовать> текущее состояние эмулятора в какую-нибудь структуру, например <объект>"
  - "и уметь <восстанавливать> его из готового снимка"
  - "чтобы не связывать все компоненты между собой, лучше поручить каждому классу сериализацию и восстановление собственного состояния"
  - "например, `CPU::getSaveState()` сериализует только состояние 🧠  CPU, а `APU::getSaveState()` — состояние 🔊  APU"
  - "а `CPU::setSaveState(saveState)` и `APU::setSaveState(saveState)` восстанавливают состояние соответствующего блока"
  responses:
  - "▶️  продолжить [end]"
