---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - 📸  les <états de sauvegarde> ne sont que des instantanés de l'état d'exécution, donc ils sont simples à implémenter
  - tu dois juste <sérialiser> l'état actuel de ton émulateur dans une structure (comme un <objet>)
  - et être capable de le <restaurer> depuis un instantané existant
  - pour éviter de coupler tous les composants entre eux, il serait conseillé de laisser chaque classe savoir comment se sérialiser et se restaurer elle-même
  - par exemple, `CPU::getSaveState()` pourrait sérialiser uniquement l'état du 🧠  CPU, et `APU::getSaveState()` l'état du 🔊  APU
  - de même, `CPU::setSaveState(saveState)` et `APU::setSaveState(saveState)` restaureraient l'état de chaque unité
  responses:
  - ▶️  continuer [end]
