---
main:
  run: |
    set((m) => {
      m.chat.winOnEnd = true;
      level.content = level.code["Screen.example.js"];
    });
  messages:
  - toutes les tâches qu'on a faites avant étaient liées à notre 🌀  cœur d'émulateur
  - et jusqu'ici j'ai volontairement évité de parler du 🌸  frontend de l'émulateur car il est <dépendant de la plateforme>
  - mais faisons un rapide tour de comment ça marche
  - notre frontend est fait avec des 🌐  <technologies web>
  - pour afficher les pixels, on initialise un élément ```raw <canvas />``` que la méthode `setBuffer(...)` remplit avec le tampon de trame (une matrice de pixels __$AABBGGRR__) généré par le 🖥️  PPU
  responses:
  - ok, et l'audio ? 🔊 [audio]

audio:
  run: |
    set(() => {
      level.content = level.code["audioWorklet.example.js"];
    });
    bus.emit("content-changed");
  messages:
  - pour l'audio, on crée un processeur <audio worklet> qui peut recevoir des échantillons de l'émulateur et les mettre dans un <ring buffer> 💍
  - à chaque fois que le périphérique audio <a besoin> d'autres échantillons, `process(...)` est appelé, et on dépile depuis le ring buffer pour les fournir
  - on demande aussi à l'émulateur d'autres échantillons, ce qui est important quand on <synchronise sur l'audio>
  responses:
  - synchroniser sur... l'<audio> ? 🤔 [syncmethods]

syncmethods:
  messages:
  - "en gros, on peut piloter notre émulateur de deux façons :"
  - "📹  <Sync vidéo> : on émule des trames entières, en synchronisant l'exécution avec notre affichage"
  - "🔊  <Sync audio> : on émule <N> échantillons à chaque fois que le périphérique audio en demande"
  - les deux méthodes ont leurs avantages et inconvénients, mais en général la <sync audio> est préférée et donne de meilleurs résultats
  responses:
  - (*) comment synchroniser sur la vidéo ? [synctovideo]
  - (*) comment synchroniser sur l'audio ? [synctoaudio]
  - montre-moi un exemple 🔍 [example]

synctovideo:
  run: |
    set(() => {
      level.content = level.code["FrameTimer.example.js"];
    });
    bus.emit("content-changed");
  messages:
  - on appelle `requestAnimationFrame(...)` pour être notifié quand on peut rafraîchir l'écran
  - ensuite, si <16.66 ms> (~1000~ / 60) se sont écoulées depuis la dernière fois, on demande au cœur de l'émulateur une nouvelle trame avec `onFrame()`
  - après la génération de la nouvelle trame, on peut mettre à jour notre canvas de pixels et envoyer les nouveaux échantillons audio
  - "⚠️  cette dernière partie nécessite une <attention particulière> lors d'une sync vidéo :"
  - si l'émulateur a généré plus d'échantillons que nécessaire en raison d'imprécisions de timing (par exemple, 740 au lieu de 735 (~44100~ / 60)), ce lot doit être <rééchantillonné> pour éviter de surcharger le ring buffer (et causer des artefacts audio)
  - |-
    le code du frontend ressemblerait à ça :
      ```javascript this.frameTimer = new FrameTimer(() => {
        // <<mettre à jour les entrées ici>>

        if (syncToVideo) {
          // exécuter pour une trame complète
          this.emulator.frame(); // envoie les pixels au canvas

          if (this.samples.length !== 735)
            this.samples = this._resample(this.samples, 735);

          this._updateAudio(); // envoie les échantillons au worklet audio
        }
      });```
  responses:
  - ...syncmethods

synctoaudio:
  run: |
    set(() => {
      level.content = level.code["Speaker.example.js"];
    }); 
    bus.emit("content-changed");
  messages:
  - on démarre un `AudioContext`, une instance de worklet, et on fournit une méthode `writeSamples(...)` pour que l'émulateur puisse envoyer des échantillons
  - à chaque fois que le système audio demande des échantillons, on appelle `onAudioRequested({ need, have, target })`
  - l'objectif ici est de maintenir le ring buffer rempli avec `target` échantillons, soit la moitié de la taille du buffer, en corrigeant si nécessaire
  - |-
    le code du frontend ressemblerait à ça :
      ```javascript this.speaker = new Speaker(
        ({ need, have, target }) => {
          if (syncToAudio) {
            let n = need;
            if (have > target + 64) n--;
            else if (have < target - 64) n++;

            // joue les n échantillons
            this.emulator.samples(n); //devrait envoyer les pixels au canvas
          
            this._updateSound(); // envoie les échantillons au worklet audio
          }
        });```
  responses:
  - ...syncmethods

