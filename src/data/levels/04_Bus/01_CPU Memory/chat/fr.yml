---
main:
  messages:
  - récapitulons rapidement le schéma mémoire du NEEES
  - le CPU a 2 Kio de RAM 🐏
  - mais les adresses mémoire vont de $0000 à $FFFF (~65535~)
  - donc l'espace adressable complet serait de 64 Kio
  responses:
  - si seulement 2 Kio sont de la vraie RAM, qu'est-ce qu'il y a dans les 62 Kio restants ? 🤨 [other62]

other62:
  messages:
  - <{memory.png}>
  - d'autres trucs, comme des miroirs RAM, des E/S mappées en mémoire, et les données de la cartouche
  - 🔗  tout est connecté à la mémoire !
  - c'est comme ça que le code machine interagit avec les périphériques
  - la carte mémoire a une structure très spécifique, voir 📄  ~/docs/cpu/cpu_memory.fr.md~
  responses:
  - (*) c'est quoi les "E/S mappées en mémoire" ? 🗺️ [io]
  - 👌  je vois... qu'est-ce que je dois implémenter ? [exercise]

io:
  messages:
  - un schéma dans lequel les adresses mémoire sont connectées à des périphériques physiques
  - par exemple...
  - lire $4016 lira les boutons appuyés de la 🎮  manette
  - écrire dans les registres 🖥️  PPU à $2000-$2007 modifiera l'écran
  - écrire dans les registres 🔊  APU à $4000-$4013 produira des sons
  - lire $8000 lira probablement le premier octet de PRG-ROM depuis la 💾  cartouche
  responses:
  - ...other62

exercise:
  messages:
  - pour l'instant, on va juste implémenter la première plage (🐏  WRAM)
  - 📚  crée une classe 🐏  `CPUMemory`, en utilisant 📄  ~/tmpl/CPUMemory.js~ comme modèle
  - 📚  son constructeur doit initialiser une propriété `ram` (un `Uint8Array` de 2048 octets)
  - |-
    📚  implémente le premier `// TODO` de chaque méthode :
    **read(address)**:
      **->** si `address` est dans la plage $0000-$07FF, retourne l'octet correspondant de `ram`
      **->** __laisse le reste du code tel quel__
    **write(address, value)**:
      **->** si `address` est dans la plage $0000-$07FF, écrit `value` dans l'octet correspondant de `ram` et retourne
      **->** __laisse le reste du code tel quel__
  - 📚  ensuite, comme avec 💾  `Cartridge`, ajoute la classe à 📄  ~/code/index.js~
  responses:
  - (*) et les octets miroirs ? 📐 [help]

help:
  messages:
  - j'ai géré ça pour toi, parce que cette partie peut être un peu délicate
  - en gros, appeler ```javascript read(0x0802)``` doit retourner la même chose que ```javascript read(0x0002)```
  - et appeler ```javascript write(0x0802, value)``` doit avoir le même effet que ```javascript write(0x0002, value)```
  - c'est pour ça que la plage $0800-$1FFF est appelée un 🚽  miroir de $0000-$07FF
  - "voilà un exemple avec l'autre plage miroir à $2008 :"
  - <{memory_mirror.png}>
  responses:
  - ...exercise
