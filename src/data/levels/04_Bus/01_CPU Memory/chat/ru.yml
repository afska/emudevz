---
main:
  messages:
  - быстро повторим схему памяти NEEES
  - у CPU есть 2 КиБ RAM 🐏
  - но адреса памяти идут от $0000 до $FFFF (~65535~)
  - так что всё адресуемое пространство занимает 64 КиБ
  responses:
  - если настоящая RAM занимает только 2 КиБ, что в остальных 62 КиБ? 🤨 [other62]

other62:
  messages:
  - <{memory.png}>
  - "всякое другое: зеркала RAM, ввод-вывод через память и данные картриджа"
  - 🔗  всё подключено к памяти!
  - так машинный код взаимодействует с устройствами
  - у карты памяти очень конкретная структура, смотри 📄  ~/docs/cpu/cpu_memory.ru.md~
  responses:
  - (*) что такое "ввод-вывод через память"? 🗺️ [io]
  - 👌  понятно... что нужно реализовать? [exercise]

io:
  messages:
  - это схема, в которой адреса памяти связаны с физическими устройствами
  - например...
  - чтение $4016 позволяет узнать, какие кнопки 🎮  контроллера нажаты
  - запись в регистры 🖥️  PPU по адресам $2000-$2007 меняет изображение
  - запись в регистры 🔊  APU по адресам $4000-$4013 создаёт звуки
  - чтение $8000, скорее всего, прочитает первый байт PRG-ROM из 💾  картриджа
  responses:
  - ...other62

exercise:
  messages:
  - пока реализуем только первый диапазон (🐏  WRAM)
  - 📚  создай класс 🐏  `CPUMemory`, взяв 📄  ~/tmpl/CPUMemory.js~ за шаблон
  - 📚  его конструктор должен создать свойство `ram` (`Uint8Array` на 2048 байт)
  - |-
    📚  реализуй первый `// TODO` в каждом методе:
    **read(address)**:
      **->** если `address` находится в диапазоне $0000-$07FF, возвращает соответствующий байт из `ram`
      **->** __остальной код оставь как есть__
    **write(address, value)**:
      **->** если `address` находится в диапазоне $0000-$07FF, записывает `value` в соответствующий байт `ram` и возвращается
      **->** __остальной код оставь как есть__
  - 📚  затем, как раньше с 💾  `Cartridge`, добавь класс в 📄  ~/code/index.js~
  responses:
  - (*) а что с зеркальными байтами? 📐 [help]

help:
  messages:
  - эта часть уже реализована за тебя, потому что с ней бывает непросто
  - в целом, вызов ```javascript read(0x0802)``` должен возвращать то же, что и ```javascript read(0x0002)```
  - а вызов ```javascript write(0x0802, value)``` должен давать тот же результат, что и ```javascript write(0x0002, value)```
  - поэтому диапазон $0800-$1FFF называют 🚽  зеркалом $0000-$07FF
  - "вот пример с другим зеркальным диапазоном по адресу $2008:"
  - <{memory_mirror.png}>
  responses:
  - ...exercise
