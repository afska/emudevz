---
main:
  messages:
  - rappelle-toi, chaque composant matériel doit être connecté à la mémoire
  - au fur et à mesure de ton développement, tu devras mettre à jour ta classe `CPUMemory` en ajoutant les bons mappings
  - un composant important à ajouter est le 🗜️  Mapper, qui gère toutes les interactions avec le code du jeu (🤖  PRG-ROM)
  - le 🧠  CPU accède au code simplement en lisant des octets dans $4020-$FFFF
  - on va faire en sorte que notre mémoire reçoive un ensemble de <composants> 📱
  - |-
    📚  ajoute la méthode suivante à ta 🐏  `CPUMemory` :
    **onLoad(ppu, apu, mapper, controllers)**:
      **->** sauvegarde les paramètres en tant que propriétés (```javascript this.ppu```, ```javascript this.apu```, ```javascript this.mapper```, et ```javascript this.controllers```)
  - 📚  ensuite, comme tu l'as fait avec ```javascript this.ram```, modifie `read(...)` et `write(...)` pour laisser ```javascript this.mapper``` gérer la plage $4020-$FFFF (espace 💾  Cartridge)
  - sur les <lectures>, tu dois retourner ```javascript this.mapper.cpuRead(address)```
  - sur les <écritures>, tu dois appeler ```javascript this.mapper.cpuWrite(address, value)``` et retourner
  responses:
  - (*) qui appelle la méthode `onLoad(...)` ? 🤔 [who]
  - (*) c'est quoi un mapper ? 🗜️ [mapper]

who:
  messages:
  - quand un jeu est chargé, BrokenNEEES appellera cette méthode automatiquement ✨
  - pour que la mémoire ait accès au reste du matériel
  responses:
  - ...main

mapper:
  messages:
  - les mappers sont des circuits à l'intérieur de la cartouche qui contrôlent comment la console lit les données de la ROM
  - chaque jeu utilise un mapper spécifique
  - plus ton émulateur supporte de mappers, plus il est compatible avec des jeux 👾
  - BrokenNEEES supporte les mappers les plus courants (~0-4~)
  - étonnamment, ils fonctionnent tous ! 🤯  donc tu les utiliseras pour l'instant
  - et tu apprendras comment en ajouter d'autres dans le chapitre 🗜️  Mappers
  responses:
  - ...main
