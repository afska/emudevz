---
main:
  messages:
  - "помни: каждый аппаратный компонент нужно подключить к памяти"
  - по мере разработки понадобится обновлять класс `CPUMemory`, добавляя нужные соответствия адресов
  - одно из важных устройств — 🗜️  Mapper, который будет обрабатывать все обращения к коду игры (🤖  PRG-ROM)
  - 🧠  CPU получает доступ к коду, просто читая байты в диапазоне $4020-$FFFF
  - пусть наша память принимает несколько <устройств> 📱
  - |-
    📚  добавь в свой 🐏  `CPUMemory` следующий метод:
    **onLoad(ppu, apu, mapper, controllers)**:
      **->** сохраняет параметры в свойствах (```javascript this.ppu```, ```javascript this.apu```, ```javascript this.mapper``` и ```javascript this.controllers```)
  - 📚  затем, как раньше с ```javascript this.ram```, измени `read(...)` и `write(...)`, чтобы ```javascript this.mapper``` обрабатывал диапазон $4020-$FFFF (область 💾  картриджа)
  - при <чтении> возвращай ```javascript this.mapper.cpuRead(address)```
  - при <записи> вызывай ```javascript this.mapper.cpuWrite(address, value)``` и возвращайся
  responses:
  - (*) кто вызывает метод `onLoad(...)`? 🤔 [who]
  - (*) что такое маппер? 🗜️ [mapper]

who:
  messages:
  - при загрузке игры BrokenNEEES автоматически вызывает этот метод ✨
  - чтобы у памяти был доступ к остальному оборудованию
  responses:
  - ...main

mapper:
  messages:
  - мапперы — это схемы внутри картриджа, которые управляют чтением данных ROM консолью
  - каждая игра использует определённый маппер
  - чем больше мапперов поддерживает эмулятор, тем больше совместимых игр 👾
  - BrokenNEEES поддерживает самые распространённые мапперы (~0-4~)
  - удивительно, но все они работают! 🤯  так что пока будем использовать их
  - а добавлять новые ты научишься в главе 🗜️  Мапперы
  responses:
  - ...main
