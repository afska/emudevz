---
main:
  messages:
  - comme exemple d'<I/O mappé en mémoire>, on va vraiment implémenter le contrôleur ! 🎮
  - j'ai documenté comment ça fonctionne !
  - jette un œil à 📄  ~/docs/controller.fr.md~
  responses:
  - alors on corrige enfin ce terrible bug du contrôleur ? [exercise]

exercise:
  messages:
  - ouais 😅
  - 📚  crée une classe 🎮  `Controller`, en utilisant 📄  ~/tmpl/Controller.js~ comme modèle
  - 📚  implémente `onRead()` et `onWrite(...)` en suivant la documentation
  - |-
    BrokenNEEES va instancier et connecter tes contrôleurs comme ça :
      ```javascript const controller1 = new Controller(1);
      const controller2 = new Controller(2);
      controller1.other = controller2;
      controller2.other = controller1;```
  - 📚  comme d'habitude, ajoute la classe dans 📄  ~/code/index.js~
  - 📚  ah, et mappe les lectures/écritures de $4016 et les lectures de $4017 dans 🐏  `CPUMemory`
  - |-
    par exemple, si `address` vaut ```javascript 0x4016```, retourne :
      ```javascript this.controllers[0].onRead()```
  responses:
  - (*) pourquoi dois-je référencer le contrôleur <other> ? [other]
  - (*) attends, explique-moi le modèle 🤔 [template]
  - (*) j'ai besoin d'aide pour implémenter `onRead(...)` [onread]
  - (*) j'ai besoin d'aide pour implémenter `onWrite(...)` [onwrite]

other:
  messages:
  - parce qu'ils sont connectés !
  - écrire un 1 dans $4016 réinitialise `cursor` sur <les deux contrôleurs>
  - et le flag `strobe` ne vit que dans le contrôleur du joueur 1
  - donc, si tu joues avec la manette 2, tu dois utiliser le flag `strobe` de l'autre manette
  responses:
  - ...exercise

template:
  messages:
  - la classe 🎮  `Controller` proposée configure un tableau `_buttons` avec des booléens
  - ça indique si un bouton est <appuyé> ou <relâché>
  - le tableau est trié en suivant la séquence décrite dans la documentation
  - la méthode `update(...)` sera appelée <automatiquement> par BrokenNEEES pour mettre à jour l'état de chaque bouton
  - et les jeux vont <sonder> les adresses $4016 et $4017 (appels `onRead(...)`) pour lire l'état courant
  responses:
  - comment fonctionne le polling ? [poll]

poll:
  messages:
  - |-
    dans un jeu NEEES, une procédure typique pour lire les entrées est :
      **->** écrire un 1 dans $4016
      **->** écrire un 0 dans $4016
      **->** (lire $4016 et $4017) 8 fois
  responses:
  - ...exercise

onread:
  messages:
  - |-
    **onRead()**:
      **->** stocke la valeur correcte de strobe dans une constante
        (c'est-à-dire ```javascript this.strobe``` pour le <joueur 1> et ```javascript this.other.strobe``` pour le <joueur 2>)
        (appelons ça `strobe`)

      **->** si le curseur est >= 8, retourne 1

      **->** si `strobe` :
        **->** retourne l'état du premier bouton <en tant que nombre>
          (```javascript +boolean``` le convertit en nombre)
      **->** sinon :
        **->** détermine si le bouton courant est appuyé (selon ```javascript this.cursor```)
          (appelons ça `isPressed`)
        **->** incrémente ```javascript this.cursor```
        **->** retourne ```javascript +isPressed```
  responses:
  - ...exercise

onwrite:
  messages:
  - |-
    **onWrite(value)**:
      **->** assigne le <bit 0> de `value` (en booléen) à ```javascript this.strobe```
        (tu peux utiliser `byte.getFlag(...)` depuis 📄  ~/lib/byte.js~)

      **->** si `this.strobe` :
        **->** remet ```javascript this.cursor``` à 0
        **->** remet ```javascript this.other.cursor``` à 0
  responses:
  - ...exercise

corollary:
