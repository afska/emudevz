---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - <! 📹  Entering video chat...
  - hey,
  - on joue à un jeu
  - |-
    ça s'appelle 🐺 🌲  ~Wolf Spirit~
    <{screenshot.png;30x30}>
  - un platformer avec un <esprit maléfique> qui a jeté une malédiction sur le monde
  - si tu le termines, je t'envoie le <fichier ROM>
  - au format ~*.neees~
  responses:
  - et je joue en loup ? [play]

play:
  run: |
    {{Right}}.stream.zoom();
    {{Right}}.stream.setIntegration("WolfSpirit");
    {{Right}}.loadROM("/roms/.all/WolfSpirit.neees", "stream");
  messages:
  - oui !
  - va arrêter l'esprit
  events:
  - wolfspirit-end [finish]

finish:
  run: |
    const directory = `${Drive.ROMS_DIR}`;
    filesystem.mkdirp(directory);

    ["WolfSpirit.neees", "FilthyKitchen.neees"].forEach((file) => {
      filesystem.cp(`${Drive.ALLROMS_DIR}/${file}`, `${directory}/${file}`);
    });
  messages:
  - ouah
  - l'équilibre a été rétabli
  - enfin, l'équilibre de la <démo>
  - "<! ROM received: 📄  /roms/WolfSpirit.neees"
  - comme promis, j'ai mis la ROM dans ton répertoire 📁  ~/roms~
  - "<! ROM received: 📄  /roms/FilthyKitchen.neees"
  - j'ai aussi envoyé un autre jeu appelé 🦟 🍳  ~Filthy Kitchen~
  - amuse-toi bien !
  responses:
  - ▶️  continuer [end]
