---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - <! 📹  Entering video chat...
  - hey,
  - on joue à un jeu
  - |-
    ça s'appelle 💎 ⛏️  ~Minekart Madness~
    <{screenshot.png;30x30}>
  - tu vas incarner un nain aux commandes d'un <wagonnet> qui s'emballe
  - si tu le termines, je t'envoie le <fichier ROM>
  - au format ~*.neees~
  responses:
  - sympa ! [play]

play:
  run: |
    {{Right}}.stream.zoom();
    {{Right}}.stream.setIntegration("MinekartMadness");
    {{Right}}.loadROM("/roms/.all/MinekartMadness.neees", "stream");
  messages:
  - c'est un hommage aux classiques des bornes d'arcade
  - voyons si tu arrives à terminer tous les niveaux !
  events:
  - minekartmadness-end [finish]

finish:
  run: |
    const directory = `${Drive.ROMS_DIR}`;
    filesystem.mkdirp(directory);

    ["MinekartMadness.neees", "GuildQuest.neees"].forEach((file) => {
      filesystem.cp(`${Drive.ALLROMS_DIR}/${file}`, `${directory}/${file}`);
    });
  messages:
  - t'es fort là-dedans !
  - "<! ROM received: 📄  /roms/MinekartMadness.neees"
  - comme promis, j'ai mis la ROM dans ton répertoire 📁  ~/roms~
  - "<! ROM received: 📄  /roms/GuildQuest.neees"
  - j'ai aussi envoyé un autre jeu appelé 🧙 ⚔️  ~Guild Quest~
  - à plus !
  responses:
  - ▶️  continuer [end]
