---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - "<! 📹  Подключение к видеочату..."
  - "привет,"
  - "давай поиграем"
  - |-
    игра называется 💎 ⛏️  ~Minekart Madness~
    <{screenshot.png;30x30}>
  - "теперь ты управляешь гномом в <вагонетке>, которая вышла из-под контроля"
  - "если получится пройти игру, я отправлю тебе <файл ROM>"
  - "в формате ~*.neees~"
  responses:
  - "здорово! [play]"

play:
  run: |
    {{Right}}.stream.zoom();
    {{Right}}.stream.setIntegration("MinekartMadness");
    {{Right}}.loadROM("/roms/.all/MinekartMadness.neees", "stream");
  messages:
  - "это дань классическим аркадным автоматам"
  - "посмотрим, получится ли пройти все уровни!"
  events:
  - minekartmadness-end [finish]

finish:
  run: |
    const directory = `${Drive.ROMS_DIR}`;
    filesystem.mkdirp(directory);

    ["MinekartMadness.neees", "GuildQuest.neees"].forEach((file) => {
      filesystem.cp(`${Drive.ALLROMS_DIR}/${file}`, `${directory}/${file}`);
    });
  messages:
  - "у тебя отлично получается!"
  - "<! Получен ROM: 📄  /roms/MinekartMadness.neees"
  - "как и обещалось, ROM теперь в твоей папке 📁  ~/roms~"
  - "<! Получен ROM: 📄  /roms/GuildQuest.neees"
  - "а ещё тебе отправлена игра 🧙 ⚔️  ~Guild Quest~"
  - "увидимся!"
  responses:
  - "▶️  продолжить [end]"
