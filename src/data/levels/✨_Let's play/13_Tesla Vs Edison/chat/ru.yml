---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - "<! 📹  Подключение к видеочату..."
  - "привет,"
  - "давай поиграем"
  - |-
    игра называется 📻 💡  ~Tesla Vs Edison~
    <{screenshot.png;30x30}>
  - "улучшенная версия классической игры для двоих, дополненная <усилениями>"
  - "если получится пройти игру, я отправлю тебе <файл ROM>"
  - "в формате ~*.neees~"
  responses:
  - "для двоих? [play]"

play:
  run: |
    {{Right}}.stream.zoom();
    {{Right}}.stream.setIntegration("TeslaVsEdison");
    {{Right}}.loadROM("/roms/.all/TeslaVsEdison.neees", "stream");
  messages:
  - "да, но можно играть и против ИИ"
  - "попробуй!"
  - "выбери <START> и постарайся выиграть матч"
  events:
  - teslavsedison-end [finish]

finish:
  run: |
    const directory = `${Drive.ROMS_DIR}`;
    filesystem.mkdirp(directory);

    ["TeslaVsEdison.neees", "MissingLands.neees"].forEach((file) => {
      filesystem.cp(`${Drive.ALLROMS_DIR}/${file}`, `${directory}/${file}`);
    });
  messages:
  - "потрясающе"
  - "<! Получен ROM: 📄  /roms/TeslaVsEdison.neees"
  - "как и обещалось, ROM теперь в твоей папке 📁  ~/roms~"
  - "<! Получен ROM: 📄  /roms/MissingLands.neees"
  - "а ещё тебе отправлена игра 🐸 🌍  ~Missing Lands~"
  - "до встречи!"
  responses:
  - "▶️  продолжить [end]"
