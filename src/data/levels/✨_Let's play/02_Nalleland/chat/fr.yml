---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - <! 📹  Entering video chat...
  - hey,
  - on joue à un jeu
  - |-
    ça s'appelle 🧸 📍  ~Nalleland~
    <{screenshot.png;30x30}>
  - cette fois, tu joues l'ours aventurier ~Nalle~, qui affronte des trucs dangereux avec son outil spécial, <l'épingle enchantée>
  - si tu relèves mon défi, je t'envoie le <fichier ROM>
  - au format ~*.neees~
  responses:
  - c'est quoi le défi ? 👀 [challenge]

challenge:
  messages:
  - tu dois terminer le jeu en mode "vies limitées"
  - active-le dans le menu <modes>, et atteins la fin !
  - (c'est conseillé de s'entraîner d'abord en mode normal 😅 )
  responses:
  - pigé 👾 [play]

play:
  run: |
    {{Right}}.stream.zoom();
    {{Right}}.stream.setIntegration("Nalleland");
    {{Right}}.loadROM("/roms/.all/Nalleland.neees", "stream");
  messages:
  - voyons ce que tu sais faire 👀
  events:
  - nalleland-end [finish]

finish:
  run: |
    const directory = `${Drive.ROMS_DIR}`;
    filesystem.mkdirp(directory);

    ["Nalleland.neees", "IsostasyDemo.neees"].forEach((file) => {
      filesystem.cp(`${Drive.ALLROMS_DIR}/${file}`, `${directory}/${file}`);
    });
  messages:
  - wow !
  - tu maîtrises ce jeu 🤯
  - "<! ROM received: 📄  /roms/Nalleland.neees"
  - comme promis, j'ai mis la ROM dans ton répertoire 📁  ~/roms~
  - "<! ROM received: 📄  /roms/IsostasyDemo.neees"
  - j'ai aussi envoyé un autre jeu appelé 🌌 🔫  ~Isostasy Demo~
  - profites-en 😎
  responses:
  - ▶️  continuer [end]
