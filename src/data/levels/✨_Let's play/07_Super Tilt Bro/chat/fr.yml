---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - <! 📹  Entering video chat...
  - hey,
  - on joue à un jeu
  - |-
    ça s'appelle 🦸 🤸  ~Super Tilt Bro~
    <{screenshot.png;30x30}>
  - un <jeu de combat> où tu dois éjecter l'autre joueur de la scène
  - si tu relèves mon défi, je t'envoie le <fichier ROM>
  - au format ~*.neees~
  responses:
  - c'est quoi le défi ? 👀 [challenge]

challenge:
  messages:
  - choisis <Local>, puis mets <Stocks> sur "Five" et <joueur 2> sur "Fair"
  - oh, et gagne le match 😅
  responses:
  - ouais, je peux le faire 🥊 [play]

play:
  run: |
    {{Right}}.stream.zoom();
    {{Right}}.stream.setIntegration("SuperTiltBro");
    {{Right}}.loadROM("/roms/.all/SuperTiltBro.neees", "stream");
  messages:
  - ok
  - FIGHT! 👊
  events:
  - supertiltbro-end [finish]

finish:
  run: |
    const directory = `${Drive.ROMS_DIR}`;
    filesystem.mkdirp(directory);

    ["SuperTiltBro.neees", "Wolfling.neees"].forEach((file) => {
      filesystem.cp(`${Drive.ALLROMS_DIR}/${file}`, `${directory}/${file}`);
    });
  messages:
  - TU AS
  - GAGNÉ !
  - "<! ROM received: 📄  /roms/SuperTiltBro.neees"
  - comme promis, j'ai mis la ROM dans ton répertoire 📁  ~/roms~
  - "<! ROM received: 📄  /roms/Wolfling.neees"
  - j'ai aussi envoyé un autre jeu appelé 🐺 ⛓️  ~Wolfling~
  - continue à te battre 💪
  responses:
  - ▶️  continuer [end]
