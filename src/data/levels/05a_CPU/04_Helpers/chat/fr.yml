---
main:
  messages:
  - on va définir quelques helpers pour simplifier les tâches futures
  - |-
    📚  dans tes classes 🔢  `Register8Bit` et 🔢  `Register16Bit`, implémente :
    **increment()**:
      **->** appelle `setValue(...)` avec le résultat de ```javascript getValue()+1```
    **decrement()**:
      **->** appelle `setValue(...)` avec le résultat de ```javascript getValue()-1```
  - |-
    📚  dans ton 🏁  `FlagsRegister`, implémente :
    **updateZero(value)**:
      **->** met ```javascript z=true``` si `value` vaut 0, ou ```javascript z=false``` sinon
    **updateNegative(value)**:
      **->** met ```javascript n=true``` si la valeur est négative, ou ```javascript n=false``` sinon
      (ici, « négatif » signifie que son <bit 7> vaut 1)
      (tu peux utiliser ```javascript byte.isNegative(value)``` de la <bibliothèque byte>)
    **updateZeroAndNegative(value)**:
      **->** appelle `updateZero(...)` et `updateNegative(...)` avec la `value`
  responses:
  - bibliothèque byte ? [library]

library:
  messages:
  - ouais, juste un helper pour faciliter les manipulations de bits
  - elle est dans 📄  ~/lib/byte.js~, importe-la comme un autre module et utilise-la
  responses: []
