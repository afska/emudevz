main:
  messages:
  - on va implémenter une méthode `step()` qui exécute la prochaine <opération>
  - elle va lire le prochain opcode et ses arguments depuis 🤖  PRG-ROM
  - appeler la bonne instruction et le bon mode d'adressage
  - et incrémenter les compteurs de cycles
  responses:
  - tu avais promis d'expliquer les cycles 🚲 [cycles]

cycles:
  messages:
  - et je vais le faire !
  - le temps que met le CPU à exécuter une action se mesure en cycles
  - les cycles sont très importants si on veut construire un émulateur « cycle-accurate » (ce qu'on ne fait pas !)
  - mais ils comptent quand même pour garder les différentes unités (CPU, PPU, APU) en sync 🔄
  - donc chaque opcode sait combien de cycles il doit prendre
  responses:
  - (*) pourquoi on ne veut pas construire un émulateur « cycle-accurate » ? [accuracy]
  - ✅  d'accord, comment on procède ? [exercise]

accuracy:
  messages:
  - parce que c'est une tâche complexe 🥵
  - et ça peut être particulièrement difficile pour quelqu'un sans expérience préalable en émulation
  - il y a des jeux difficiles à émuler qui exigent de la précision pour fonctionner
  - mais la plupart des autres jeux fonctionnent très bien sans, donc on n'en aura pas besoin de toute façon
  responses:
  - ...cycles

exercise:
  messages:
  - |-
    📚  d'abord, on va ajouter ces méthodes à ton 🧠  `CPU` :
    **_fetchOperation()**:
      **->** lit un octet à l'adresse mémoire que [PC] pointe
        (appelons ça `opcode`)
      **->** trouve l'opération liée à cet opcode :
        ```javascript this.operations[opcode]```
        (appelons ça `operation`)
      **->** si `operation` n'existe pas, lance une erreur « Invalid opcode. »
      **->** incrémente [PC]
      **->** retourne `operation`
    **_fetchInput(operation)**:
      **->** lit 0, 1 (avec `read(...)`) ou 2 octets (avec `read16(...)`) à l'adresse mémoire que [PC] pointe, selon ```javascript operation.addressingMode.inputSize```
        (appelons ça `input`)
      **->** incrémente [PC] (~0~, 1 ou 2 fois) pour sauter ces octets
      **->** retourne `input` (ou ```javascript null```)
    **_fetchArgument(operation, input)**:
      **->** retourne le résultat du traitement de `input` avec le mode d'adressage
        - si ```javascript operation.instruction.argument === "value"```, ce doit être :
            ```javascript operation.addressingMode.getValue(this, input, operation.hasPageCrossPenalty)```
        - sinon :
            ```javascript operation.addressingMode.getAddress(this, input, operation.hasPageCrossPenalty)```
    **_addCycles(operation)**:
      **->** calcule combien de cycles l'`operation` a pris :
        ```javascript operation.cycles + this.extraCycles```
        (appelons ça `cycles`)
      **->** met à jour les compteurs de cycles :
        ```javascript this.cycle += cycles;```
        ```javascript this.extraCycles = 0;```
      **->** retourne `cycles`
  responses:
  - et la méthode `step()` dont tu parlais ? [step]

step:
  messages:
  - |-
    📚  notre méthode `step()` devrait s'écrire facilement, en utilisant les autres :
      ```javascript step() {
        const originalPC = this.pc.getValue();

        const operation = this._fetchOperation();
        const input = this._fetchInput(operation);
        const argument = this._fetchArgument(operation, input);

        if (this.logger != null) {
          this.logger(
            this,
            originalPC,
            operation,
            input,
            argument
          )
        }

        operation.instruction.run(this, argument);
        return this._addCycles(operation);
      }```
  responses: []
