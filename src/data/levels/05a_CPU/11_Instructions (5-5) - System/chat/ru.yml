---
main:
  messages:
    - осталось всего две инструкции 🎉
    - "и одна из них совсем простая: `NOP`"
    - '`NOP` означает "No Operation" — и ничего не делает!'
    - разработчики игр использовали её как заглушку или для задержек, чтобы синхронизировать системы
    - а последняя — `BRK`, которая вызывает <программное прерывание>
  responses:
    - что такое прерывание? [interrupt]

interrupt:
  messages:
    - это сигнал, который приостанавливает текущую программу для обработки определённого события
    - когда такое событие происходит, CPU сохраняет своё состояние ([PC] и регистр флагов) в стеке
    - и переходит по заранее известному адресу памяти (вектору), связанному с этим событием
    - после обработки события выполнение обычно продолжается с того места, где остановилось
    - "в NEEES есть 4 события:"
    - "🔁  <RESET>: Возникает при включении системы"
    - "📹  NMI: Возникает, когда PPU заканчивает рисовать кадр"
    - "✋  <IRQ>: Возникает по сигналу APU или внешних устройств, например мапперов"
    - "🔢  <BRK>: Возникает при выполнении инструкции `BRK` в машинном коде"
  responses:
    - можешь привести пример? 🤔 [example]

example:
  messages:
    - конечно! представь, что ты игра
    - тебе нужно перемещать спрайты, когда PPU закончит рисовать текущий кадр, чтобы не делать это во время отрисовки (иначе появятся глюки 💥 )
    - поэтому ты размещаешь код перемещения спрайтов, например, по адресу $AA00
    - это будет расположение твоего <обработчика прерывания>
    - затем ты "подписываешься" на событие NMI, помещая указатель на $AA00 в вектор NMI (~$FFFA/B~)
    - (в порядке Little Endian, то есть в $FFFA находится $00, а в $FFFB — $AA)
    - посмотри 📄  ~/docs/cpu/interrupt_example.ru.md~
  responses:
    - что произойдёт при NMI? [nmi]

nmi:
  messages:
    - "в этом примере при NMI процессор:"
    - 🧱  поместит [PC] и флаги в стек
    - 🏁  установит ~I=1~, что запрещает маскируемые прерывания
    - 🐏  получит значение $AA00, прочитав $FFFA и $FFFB (вектор NMI)
    - 🦘  перейдёт к $AA00
    - 🚲  потратит на всё это 7 тактов
    - затем обработчик прерывания переместит спрайты и выполнит `RTI` ("Return from Interrupt", возврат из прерывания), чтобы восстановить прежнее состояние
  responses:
    - (*) что за 7 тактов? 🚲 [cycle]
    - (*) для чего нужен флаг ~I~? 🏁 [iflag]
    - отлично! думаю, можно приступать к реализации 😎 [exercise]

cycle:
  messages:
    - это время обработки прерывания 🕖
    - о тактах мы пока мало говорили
    - в классе 🧠  `CPU` у тебя появились только два загадочных свойства, помнишь?
    - те, что называются `cycles` и `extraCycles`
    - позже объясню подробнее, обещаю 😅
  responses:
    - ...nmi

iflag:
  messages:
    - это флаг "Interrupt Disable", то есть запрета прерываний
    - система устанавливает ~I=1~, чтобы обработчики прерываний... хмм... не прерывались 😅
    - |-
      дело в том, что... отключить можно только события <IRQ>
      <RESET> нельзя игнорировать по понятным причинам
      <BRK> вызывается кодом игры намеренно, поэтому игнорировать его бессмысленно
      NMI означает "Non-maskable interrupt", немаскируемое прерывание; оно очень важно, поэтому его нельзя маскировать (то есть "отключать")
  responses:
    - ...nmi

exercise:
  messages:
    - отлично
    - мы представим прерывания объектами `{ id, vector }`
    - посмотри 📄  ~/lib/interrupts.js~
    - |-
      📚  добавь в свой 🧠  `CPU` этот метод:
      **interrupt(interrupt, withBFlag = false)**:
        **->** если ```javascript interrupt.id === "IRQ"``` и ~I=1~, возвращает 0
          (прерывание игнорируется)
        **->** помещает [PC] в стек
        **->** помещает байт флагов в стек
          (если `withBFlag` равен ```javascript true```, значение помещается с включённым битом 4)
          (иначе значение помещается как есть)
        **->** добавляет 7 тактов (```javascript this.cycle += 7```)
        **->** устанавливает ~I=1~ в регистре флагов
        **->** устанавливает [PC] в результат чтения адресов ```javascript interrupt.vector``` и ```javascript interrupt.vector+1``` в порядке Little Endian
          (помни, что для этого у тебя есть метод `read16(...)`)
        **->** возвращает 7
  responses:
    - (*) а `BRK`? [brk]

brk:
  messages:
    - |-
      📚  инструкцию `BRK` можно реализовать так:
        - увеличить [PC]:
          ```javascript cpu.pc.increment()```
        - вызвать прерывание ~BRK~:
          ```javascript cpu.cycle -= cpu.interrupt(interrupts.BRK, true)```
  responses:
    - ...exercise
