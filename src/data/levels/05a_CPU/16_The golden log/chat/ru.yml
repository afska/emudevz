---
main:
  run: |
    set((m) => {
      m.chat.winOnEnd = true;
      m.$canRun = false;
    });
  messages:
    - если бы это была странная игра, в которой нужно написать эмулятор
    - тут был бы <финальный босс> 👹
    - ~NEEEStest~ — самодельная программа, которая тщательно проверяет работу CPU
    - я запущу твой эмулятор и запишу каждую инструкцию в лог
    - 'сравнивая каждую строку со следующим "эталонным логом":'
    - 📄  ~/roms/_test/golden.log~
    - 📄  ~/roms/_test/golden_log_format.ru.md~
  responses:
    - что такое эталонный лог? 🏆 [golden]

golden:
  messages:
    - это лог выполнения тестового ROM, созданный эмулятором, правильность работы которого подтверждена ✅
    - "в нём по порядку идут: [PC], машинный код, дизассемблированный код, состояние всех регистров (`P` — регистр флагов) и счётчик тактов"
    - до сих пор твой код проходил только базовые тесты
    - теперь проверим всевозможные граничные случаи и убедимся, что CPU надёжен
    - если найдутся расхождения, нужно выяснить причину или попросить помощи в интернете
    - редактировать файлы можно кнопкой "Найти файлы..." в правом верхнем углу
    - используй кнопку ⏩  и дойди до конца эталонного лога!
  run-after-messages: |
    set((m) => {
      m.$canRun = true;
    });
  events:
    - cpu-bug-page-boundary [pageboundary]
    - cpu-bug-unexpected [unexpected]
    - golden-log-end [success]

pageboundary:
  run: |
    bus.emit("console-changed");
    set((m) => {
      m.chat.instant = true
      m.$canRun = false;
    });
  messages:
    - а... <баг на границе страницы> 😅
    - он совсем вылетел у меня из головы!
    - у NEEES есть баг в обработке косвенного режима адресации ("Indirect")
    - да, баг в самом оборудовании
    - и для точной эмуляции оборудования... нужно эмулировать и его баги 😅
    - если попытаться его "исправить", нарушится совместимость с некоторыми играми, которые зависят от этого бага — случайно или намеренно
    - для него есть наскоро составленный документ
    - он находится в 📄  ~/docs/cpu/page_boundary_bug.ru.md~
    - 📚  добавь этот баг и попробуй снова!
  run-after-messages: |
    set((m) => {
      m.$canRun = true;
      m.chat.instant = false;
    });
  events:
    - ...golden

unexpected:
  run: |
    bus.emit("console-changed");
    set((m) => {
      m.chat.instant = true
      m.$canRun = false;
    });
  messages:
    - 💥  что?! 💥
    - возможно, в коде есть незаметный баг, который мои модульные тесты не поймали
    - попробуй разобрать именно эту строку лога
    - "инструкция, которая дала сбой, находится в <предыдущей строке>, например:"
    - <{failure_example.png}>
    - "здесь сбой дала инструкция `ADC #$69`: она должна была изменить [A] с $00 на $69, но вместо этого получилось $4B"
    - "и помни о формате лога: 📄  ~/roms/_test/golden_log_format.ru.md~"
    - так должно получиться найти причину
    - если нет, попроси помощи в интернете 🌎
  run-after-messages: |
    set((m) => {
      m.$canRun = true;
      m.chat.instant = false;
    });
  events:
    - ...golden

success:
  messages:
    - ого
    - ПОЛУЧИЛОСЬ! 🎉
    - класс, твой CPU теперь работает правильно!
    - можно двигаться дальше и подключить его к эмулятору
  responses:
    - погналиии 🥳 [end]
