---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - теперь подключу твой 🧠  CPU к эмулятору
  - задача <ОЧЕНЬ> сложная
  - так что это может занять время
  - скажи, когда можно будет начинать
  responses:
  - давай! 👀 [doit]

doit:
  run: |
    level.startEffect("slow-earthquake");
  messages:
  - ВАААУ
  - ого
  - нееет
  - вот блин
  - у меня всё сломалось 😅
  - хмм...
  - аргх
  - дааавай
  - __* усиленно печатает код *__
  run-after-messages: |
    setTimeout(() => {
      bus.emit("patching-end");
    }, 3000);
  events:
  - patching-end [done]

done:
  run: |
    level.stopEffect();
    book.unlock("useCPU");
  messages:
  - ✅  готово!
  - <! 🧠  CPU подключён.
  - теперь значок 🧠  в эмуляторе будет светиться ✨
  - попробуй запустить игры! разница будет заметна
  - время выполнения станет стабильнее, а баги, влияющие на игровую логику, исчезнут
  responses:
  - ▶️  продолжить [end]
