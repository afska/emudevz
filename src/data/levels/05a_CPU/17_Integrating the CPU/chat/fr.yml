---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - maintenant je vais intégrer ton 🧠  CPU dans l'émulateur
  - c'est une tâche <VRAIMENT> complexe
  - donc ça peut prendre un moment
  - dis-le-moi et je le ferai, quand tu veux
  responses:
  - fais-le ! 👀 [doit]

doit:
  run: |
    level.startEffect("slow-earthquake");
  messages:
  - WOOOW
  - omg
  - nooon
  - oh zut
  - j'ai tout cassé 😅
  - hmm...
  - argh
  - ouiii
  - "__* tape du code intensément *__"
  run-after-messages: |
    setTimeout(() => {
      bus.emit("patching-end");
    }, 3000);
  events:
  - patching-end [done]

done:
  run: |
    level.stopEffect();
    book.unlock("useCPU");
  messages:
  - ✅  c'est fait !
  - <! 🧠  CPU intégré.
  - maintenant, l'icône 🧠  dans l'émulateur va s'illuminer ✨
  - essaie de lancer des jeux ! tu remarqueras une grande amélioration
  - le timing devrait être plus cohérent, et tu ne rencontreras plus de bugs qui affectent la logique du jeu
  responses:
  - ▶️  continuer [end]
