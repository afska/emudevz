---
main:
  messages:
  - "есть 3 вида инструкций:"
  - 🚫  инструкции, которым <не нужны аргументы>
  - 🐏  инструкции, которым нужен <адрес памяти>
  - 🔢  инструкции, которым нужно <значение>
  - для примера я покажу реализацию 3 распространённых инструкций в определённом формате
  - посмотри файл 📄  ~/tmpl/cpu/instructions.js~!
  responses:
  - хорошо... а сколько всего арифметических инструкций? [exercise]

exercise:
  messages:
  - их 16, но 3 уже написаны за тебя! 😎
  - а некоторые очень похожи друг на друга
  - 📚  создай объект в таком же формате, как в примере
  - 📚  реализуй в нём все 16 арифметических инструкций
  - 📚  и экспортируй его под ключом `instructions` в 📄  ~/code/index.js~
  - понадобится документация о том, что делает каждая инструкция
  - так что посмотри 📄  ~/docs/cpu/instructions.ru.md~
  responses:
  - (*) нужна помощь со сдвигом битов 😅 [bits]
  - (*) нужна помощь с обновлением флагов ~Z~ и ~N~ 😅 [flags]

bits:
  messages:
  - оператор ~<<~ сдвигает биты влево, а ~>>~ — вправо
  - например
  - "```javascript 0b00001100 << 1``` даёт ```javascript 0b00011000```"
  - а ```javascript 0b01000001 >> 1``` даёт ```javascript 0b00100000```
  responses:
  - со сдвигом понятно, а что с циклическим сдвигом? [rotation]

rotation:
  messages:
  - для циклического сдвига вправо (допустим, ```javascript 0b00000001 >> 1```) нужно перенести бит 0 (который теряется после сдвига) на последнее место (бит 7)
  - |-
    то есть для `number` можно написать:
      ```javascript byte.setBit(number >> 1, 7, byte.getBit(number, 0))```
  - |-
    или без библиотеки byte:
      ```javascript (number >> 1) | ((number & 1) << 7)```
  - "обрати внимание: `ROL` и `ROR` работают иначе, они выполняют циклический сдвиг через флаг ~C~"
  responses:
  - ...exercise

flags:
  messages:
  - почти все инструкции, которые дают значение, обновляют флаги ~Z~ и ~N~
  - нужно устанавливать ~Z=1~, если полученное значение равно 0, иначе ~Z=0~
  - и ~N=1~, если байт отрицательный, иначе ~N=0~
  - |-
    у тебя уже есть методы для этой задачи, просто используй:
      `cpu.flags.updateZeroAndNegative(...)`
  responses:
  - ...exercise
