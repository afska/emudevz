---
main:
  messages:
  - помнишь режимы адресации из главы об ассемблере?
  - <{compilation_full.png}>
  - ну... пришло время их эмулировать 😏
  - вот краткий справочник для тебя
  - посмотри 📄  ~/docs/cpu/addressing_modes.ru.md~
  responses:
  - точно понадобится объяснение поподробнее [explain]

explain:
  messages:
  - ага
  - у каждого режима адресации есть <вход> и <выход>
  - ⬅️  <вход> — это аргумент операции (то, что следует за кодом операции в машинном коде, помнишь?)
  - в `JMP ($4080)` <входом> будет $4080
  - ➡️  <выход> — то, что в итоге получают инструкции
  - (аргумент `address` функции `run(...)` твоей инструкции `JMP`)
  - в этом случае <выходом> будет результат <16-битного чтения> по адресу $4080
  responses:
  - ✅  окей, давай это напишем [exercise]

exercise:
  messages:
  - вообще-то некоторые режимы уже написаны
  - так что тебе нужно реализовать только относительный ("Relative") и косвенный ("Indirect")
  - можно взять код из 📄  ~/tmpl/cpu/addressingModes.js~ и продолжить его!
  - 📚  реализуй недостающие режимы адресации
  - 📚  и экспортируй объект под ключом `addressingModes` в 📄  ~/code/index.js~
  responses:
  - (*) помоги с относительным режимом ("Relative") 😅 [relative]
  - (*) помоги с косвенным режимом ("Indirect") 😅 [indirect]

relative:
  messages:
  - 💡  помни, что он принимает "смещение" (байт со знаком)
  - людям бывает непросто разобраться с байтами со знаком
  - они используют дополнительный код ("Two's complement"), который кратко описан в 📄  ~/lib/byte.js~
  - например, если смещение равно ~-3~, ты получишь 253
  - преобразовать 253 в ~-3~ можно методом `toS8`
  - 💡  а для проверки пересечения границы страницы понадобится `highByteOf(...)`
  responses:
  - ...exercise

indirect:
  messages:
  - полная реализация есть в документе 😊
  - просто выполни `read16(...)` с этим адресом!
  responses:
  - ...exercise
