---
main:
  messages:
  - tu te souviens des modes d'adressage du chapitre Assembly ?
  - <{compilation_full.png}>
  - eh bien... c'est l'heure de les émuler 😏
  - j'ai fait une référence rapide pour toi
  - consulte 📄  ~/docs/cpu/addressing_modes.fr.md~
  responses:
  - j'aurai besoin que tu m'expliques ça un peu plus [explain]

explain:
  messages:
  - ouais
  - tu peux voir que chaque mode d'adressage a une <entrée> et une <sortie>
  - ⬅️  l'<entrée> est l'argument de l'opération (ce qui suit l'opcode dans le code machine, tu te souviens ?)
  - dans `JMP ($4080)` l'<entrée> serait $4080
  - ➡️  la <sortie> est ce que les instructions reçoivent finalement
  - (l'argument `address` dans la fonction `run(...)` de ton instruction `JMP`)
  - dans ce cas, la <sortie> serait le résultat d'une <lecture 16 bits> à l'adresse $4080
  responses:
  - ✅  ok, on code ça [exercise]

exercise:
  messages:
  - j'ai déjà codé certains de ces modes
  - donc tu n'auras qu'à implémenter « Relative » et « Indirect »
  - tu peux récupérer le code depuis 📄  ~/tmpl/cpu/addressingModes.js~ et continuer à partir de là !
  - 📚  implémente les modes d'adressage manquants
  - 📚  et exporte l'objet sous la clé `addressingModes` dans 📄  ~/code/index.js~
  responses:
  - (*) aide-moi avec le mode « Relative » 😅 [relative]
  - (*) aide-moi avec le mode « Indirect » 😅 [indirect]

relative:
  messages:
  - 💡  rappelle-toi qu'il prend un « offset » (un octet signé)
  - les octets signés peuvent être délicats à comprendre
  - ils utilisent la notation « Complément à deux », expliquée brièvement dans 📄  ~/lib/byte.js~
  - par exemple, si l'offset est ~-3~, tu recevras un 253
  - tu peux convertir ce 253 en ~-3~ avec la méthode `toS8`
  - 💡  aussi, pour détecter les événements de franchissement de page, tu auras besoin de `highByteOf(...)`
  responses:
  - ...exercise

indirect:
  messages:
  - tu as une implémentation complète dans le fichier de doc 😊
  - fais juste un `read16(...)` avec l'adresse !
  responses:
  - ...exercise
