main:
  messages:
  - tu te souviens de la pile ? 🧱
  - <{stack.png}>
  - 📚  crée une nouvelle classe pour elle
  - elle doit recevoir la `memory` (🐏  `CPUMemory`) et `sp` (🔢  `Register8Bit`) du CPU, car elle devra interagir avec eux
  - |-
    📚  implémente ces méthodes :
    **push(value)**:
      **->** écrit `value` à l'adresse mémoire `currentAddress`, puis décrémente `sp`
    **pop()**:
      **->** incrémente `sp` et retourne le résultat de la lecture de `currentAddress` en mémoire
  - l'`currentAddress` vaut toujours $0100 (là où vit la pile en RAM), plus la valeur dans [SP]
  - |-
    📚  quand tu as terminé, ajoute une nouvelle instance de la pile au CPU :
      ```javascript this.stack = new Stack(this.memory, this.sp);```
