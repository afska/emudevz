main:
  messages:
  - помнишь стек? 🧱
  - <{stack.png}>
  - 📚  создай для него новый класс
  - он должен получать от CPU `memory` (🐏  `CPUMemory`) и `sp` (🔢  `Register8Bit`), потому что ему нужно с ними взаимодействовать
  - |-
    📚  реализуй эти методы:
    **push(value)**:
      **->** записывает `value` по адресу памяти `currentAddress`, затем уменьшает `sp`
    **pop()**:
      **->** увеличивает `sp` и возвращает результат чтения `currentAddress` из памяти
  - "`currentAddress` всегда равен $0100 (началу стека в RAM) плюс значение [SP]"
  - |-
    📚  когда всё будет готово, добавь новый экземпляр стека в CPU:
      ```javascript this.stack = new Stack(this.memory, this.sp);```
