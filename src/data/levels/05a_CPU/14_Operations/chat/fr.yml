main:
  messages:
  - "opcode signifie « operation code »"
  - alors... c'est quoi une <opération> ? 🤔
  - c'est la combinaison d'une 📖  instruction et d'un 📍  mode d'adressage
  - "voici quelques exemples :"
  - |-
    `STA $4080` : l'instruction `STA` + le mode `ABSOLUTE`
      => opcode $8D
  - |-
    `STA $30,X` : l'instruction `STA` + le mode `INDEXED_ABSOLUTE_X`
      => opcode $9D
  - |-
    `STA ($55),Y` : l'instruction `STA` + le mode `INDIRECT_INDEXED`
      => opcode $91
  responses:
  - ça veut dire que `STA` peut avoir différents opcodes selon le mode d'adressage ? [exercise]

