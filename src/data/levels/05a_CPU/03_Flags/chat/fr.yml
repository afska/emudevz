main:
  messages:
  - comme tu l'as vu dans le chapitre Assembly, il y a aussi un 🏁  registre de flags qui représente l'état du processeur
  - |-
    c'est un registre de 8 bits, dans lequel chaque bit a une signification particulière :
     ```raw _______________________________```
    ```raw | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |```
    ```raw |---|---|---|---|---|---|---|---|```
    ```raw |``` ~N~ ```raw |``` ~V~ ```raw |``` ```raw 1``` ```raw |``` ```raw b``` ```raw |``` ~D~ ```raw |``` ~I~ ```raw |``` ~Z~ ```raw |``` ~C~ ```raw |```
     ```raw ‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾```
  - on a déjà vu ~C~ (« Carry ») et ~Z~ (« Zero ») par le passé, et on parlera des autres quand on commencera à coder les instructions CPU
  - tous les flags sont représentés par une lettre majuscule
  responses:
  - pas <tous> 😑 [notall]

notall:
  messages:
  - tous, oui, les bits 5 et 4 ne sont pas des flags !
  - le bit 5 vaut toujours 1
  - le bit 4 (« b »)... ça dépend... de... choses — considère qu'il vaut 0 pour l'instant 😂
  responses:
  - ok, et qu'est-ce que je dois faire ? [exercise]

exercise:
  messages:
  - 📚  crée une classe 🏁  `FlagsRegister` avec 6 propriétés booléennes (appelées `c`, `z`, `i`, `d`, `v` et `n`)
  - initialise-les avec ```javascript false```
  - |-
    📚  puis implémente, en suivant le tableau précédent :
    **getValue()**:
      **->** doit retourner un nombre de 8 bits avec tous les flags
    **setValue(value)**:
      **->** doit assigner tous les flags à partir du nombre de 8 bits reçu
  - autrement dit, avec `i` et `v` activés, ```javascript getValue()``` doit retourner ```javascript 0b01100100```
  - et ```javascript setValue(0b00000010)``` doit mettre tous les booléens à ```javascript false```, sauf `z`
  responses:
  - (*) j'ai besoin d'un peu d'aide 📐 [bits]
  - ✅  j'ai la classe [nowwhat]

