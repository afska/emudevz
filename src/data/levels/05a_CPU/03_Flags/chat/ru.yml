---
main:
  messages:
  - как мы видели в главе об ассемблере, есть ещё 🏁  регистр флагов, представляющий состояние процессора
  - |-
    это 8-битный регистр, в котором каждый бит имеет особое значение:
     ```raw _______________________________```
    ```raw | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |```
    ```raw |---|---|---|---|---|---|---|---|```
    ```raw |``` ~N~ ```raw |``` ~V~ ```raw |``` ```raw 1``` ```raw |``` ```raw b``` ```raw |``` ~D~ ```raw |``` ~I~ ```raw |``` ~Z~ ```raw |``` ~C~ ```raw |```
     ```raw ‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾```
  - с ~C~ ("Carry", перенос) и ~Z~ ("Zero", ноль) мы уже знакомы, а об остальных поговорим, когда начнём писать инструкции CPU
  - все флаги обозначаются заглавной буквой
  responses:
  - не <все> 😑 [notall]

notall:
  messages:
  - все-все, биты 5 и 4 — не флаги!
  - бит 5 всегда равен 1
  - а бит 4 ("b")... зависит... от... всякого — пока считай, что он равен 0 😂
  responses:
  - ладно, что нужно сделать? [exercise]

exercise:
  messages:
  - 📚  создай класс 🏁  `FlagsRegister` с 6 булевыми свойствами (`c`, `z`, `i`, `d`, `v` и `n`)
  - задай им начальное значение ```javascript false```
  - |-
    📚  затем реализуй по таблице выше:
    **getValue()**:
      **->** возвращает 8-битное число со всеми флагами
    **setValue(value)**:
      **->** устанавливает все флаги из полученного 8-битного числа
  - например, при установленных `i` и `v` вызов ```javascript getValue()``` должен возвращать ```javascript 0b01100100```
  - а ```javascript setValue(0b00000010)``` должен установить все булевы свойства в ```javascript false```, кроме `z`
  responses:
  - (*) немного помощи с битами 📐 [bits]
  - ✅  класс готов [nowwhat]

bits:
  messages:
  - 📄  ~/lib/byte.js~ спешит на помощь 🙌
  - чтобы собрать значение в ```javascript getValue()```, используй `bitfield(...)`
  - чтобы получить флаги в ```javascript setValue(value)```, используй `getFlag(...)`
  responses:
  - ...exercise

nowwhat:
