---
main:
  messages:
  - иногда для представления значения нужен не один байт
  - например, когда аргумент инструкции CPU — 16-битный адрес
  - или при выполнении `RTS`, когда CPU нужно восстановить [PC] из стека
  - в таких случаях используется порядок Little Endian 🔌
  - то есть сначала хранится младший байт ("low byte"), затем старший ("high byte")
  - <{little_endian.png}>
  - |-
    📚  реализуй в 🐏  `CPUMemory` этот метод:
    **read16(address)**:
      **->** возвращает 16-битное число
        - младший байт получается чтением `address` из памяти
        - старший байт получается чтением ```javascript address+1```
  - |-
    📚  а в 🧱  `Stack` — эти два метода:
    **push16(bigNumber)**:
      **->** дважды вызывает `push(...)` (сначала со старшим байтом `bigNumber`, затем с младшим)
    **pop16()**:
      **->** возвращает 16-битное число, полученное двумя вызовами `pop()` (сначала младший байт, затем старший)
  - 💡  не забудь использовать 📄  ~/lib/byte.js~!
  responses: []
