---
main:
  messages:
  - инструкции работы с данными довольно простые
  - как понятно из названия, они хранят и перемещают данные 😉
  - 📚  следуя 📄  ~/docs/cpu/instructions.ru.md~,
  - реализуй все инструкции работы с данными в объекте `instructions`!
  responses:
  - (*) нужна помощь с `PHP` 😅 [php]

php:
  messages:
  - а?
  - этим языком ещё пользуются?
  responses:
  - нет, речь об инструкции [inst]

inst:
  messages:
  - а, точно... 🤣
  - в `PHP` нужно поместить в стек число
  - это число — результат вызова ```javascript cpu.flags.getValue()```
  - но его бит 4 нужно установить в 1 (используй ```javascript byte.setBit(flags, 4, 1)```)
  responses:
  - почему? [why]

why:
  messages:
  - потому что именно так работает оборудование!
  - при разработке эмулятора нам не так важно, <почему> всё устроено определённым образом
  - нам важно, <как> оно работает 🤷
  - так что включи этот бит 4, пожалуйста
  responses:
  - ...main
