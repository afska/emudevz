main:
  messages:
  - "📚  начни с двух классов: 🔢  `Register8Bit` и 🔢  `Register16Bit`"
  - |-
    📚  у них должны быть два метода:
    **getValue()**:
      **->** возвращает содержимое регистра
    **setValue(value)**:
      **->** задаёт содержимое регистра
  - 📚  начальное содержимое регистра — 0, а возможные значения — 8-битные (~0-255~) или 16-битные (~0-65535~), в зависимости от класса
  responses:
  - (*) а если попробовать записать значение за пределами диапазона? 🚫 [limit]
  - (*) как лучше это реализовать? 🤔 [implement]
  - ✅  классы готовы, что дальше? [nowwhat]

limit:
  messages:
  - настоящая NEEES так никогда не сделает!
  - но значение должно оборачиваться 🔄 , чтобы результат всегда оставался в допустимом диапазоне
  - |-
    вот несколько примеров:
    ```raw ___________________________
    |  Type  | Write | Result |
    |--------|-------|--------|
    | 8-bit  | 258   | 2      |
    | 8-bit  | 518   | 6      |
    | 8-bit  | -2    | 254    |
    | 8-bit  | -128  | 128    |
    | 8-bit  | -200  | 56     |
    | 16-bit | 65536 | 0      |
     ‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾```
  responses:
  - ...main

implement:
  messages:
  - можно создать типизированные массивы с одним элементом, например ```javascript new Uint8Array(1)``` и ```javascript new Uint16Array(1)```
  - тогда при записи вроде ```javascript array[0] = 258;``` оборачивание произойдёт автоматически ✨
  responses:
  - ...main

