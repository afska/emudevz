    **getValue()**:
      **->** retourne le contenu du registre
    **setValue(value)**:
      **->** définit le contenu du registre
  - 📚  le contenu du registre part de 0 et peut être un nombre de 8 bits (~0-255~) ou de 16 bits (~0-65535~), selon la classe
