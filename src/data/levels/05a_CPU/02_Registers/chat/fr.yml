limit:
  messages:
  - le vrai NEEES ne ferait jamais ça !
  - mais ça doit boucler 🔄 , et la valeur résultante finit toujours dans la plage valide
  - |-
    voilà quelques exemples :
    ```raw ___________________________
    |  Type  | Write | Result |
    |--------|-------|--------|
    | 8-bit  | 258   | 2      |
    | 8-bit  | 518   | 6      |
    | 8-bit  | -2    | 254    |
    | 8-bit  | -128  | 128    |
    | 8-bit  | -200  | 56     |
    | 16-bit | 65536 | 0      |
     ‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾```
