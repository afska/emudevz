---
main:
  messages:
  - теперь твоя очередь 😛
  - 📚  напиши программу, которая записывает число $7C по адресам $4055 и $4072
  - 📚  а затем число $18 по адресу $40B8
  - проверь программу кнопкой ⏩
  - 📚  когда всё будет готово, закрой чат и запусти команду `test`
  responses:
  - нет, нужна помощь 😔 [help]
  - напомни, как запустить другую команду? [othercommands]

othercommands:
  messages:
  - конечно
  - нажми ~Ctrl+C~
  - введи `test`, затем нажми Enter
  responses:
  - всё понятно [main]

help:
  messages:
  - помни, что перед записью в память нужно загрузить значение в [A]
  - поэтому операция состоит из двух шагов
  - <{LDA_STA.png}>
  - ещё перед непосредственными числовыми значениями нужно ставить ~#~
  - "например, чтобы загрузить $99 в [A], нужно написать `LDA #$99`, а не `LDA $99`"
  - <{LDA_immediate.png}>
  - (иначе в [A] загрузится значение, которое находится по адресу памяти $0099)
  - <{LDA_memory.png}>
  responses:
  - спасибо, попробую [end]
