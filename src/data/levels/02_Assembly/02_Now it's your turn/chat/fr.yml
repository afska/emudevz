---
main:
  messages:
  - à toi de jouer 😛
  - 📚  fais un programme qui écrit le nombre $7C aux adresses $4055 et $4072
  - 📚  puis, le nombre $18 à l'adresse $40B8
  - teste ton programme avec le bouton ⏩
  - 📚  quand tu es prêt·e, ferme le chat et lance la commande `test`
  responses:
  - non, j'ai besoin d'aide 😔 [help]
  - tu peux me réexpliquer comment lancer l'autre commande ? [othercommands]

othercommands:
