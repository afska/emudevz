help:
  messages:
  - rappelle-toi qu'avant d'écrire en mémoire, tu dois charger la valeur dans [A]
  - c'est une opération en deux étapes
  - <{LDA_STA.png}>
  - "aussi, quand tu tapes des nombres littéraux, tu dois les préfixer par ~#~"
  - "par ex. si tu veux charger un $99 dans [A], c'est `LDA #$99` et pas `LDA $99`"
  - <{LDA_immediate.png}>
  - "(sinon, ça chargerait dans [A] la valeur qui se trouve à l'adresse mémoire $0099)"
  - <{LDA_memory.png}>
  responses:
  - merci, je vais essayer [end]
