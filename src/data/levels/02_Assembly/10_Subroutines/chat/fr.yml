---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - "`JSR` et `RTS` (\"Jump to SubRoutine\" et \"ReTurn from Subroutine\") sont un duo dynamique qu'on voit généralement utilisés ensemble"
  - "`JSR` saute à une autre partie du code, et `RTS` revient à la position précédente"
  - c'est essentiellement comme appeler une fonction et en retourner ! 📞
  - regarde l'exemple ⏩
  responses:
  - comment ça sait où retourner ? 😲 [where]

where:
  messages:
  - eh bien, `JSR` pousse l'adresse de l'instruction suivante (moins 1) sur la pile avant de sauter à l'emplacement donné
  - ensuite, `RTS` dépile cette adresse, y ajoute 1, et saute à cet emplacement
  - le code d'exemple illustre comment les deux peuvent être utilisés ensemble pour créer un code modulaire 🗃️
  - <{JSR_RTS.png}>
  responses:
  - (*) pourquoi t'as pas utilisé les noms de labels ? [label]
  - trop cool ! [awesome]

label:
  messages:
  - c'est aussi une option !
  - mais tu dois dire à l'assembleur où le code commence
  - en utilisant une directive comme `.org $4020`
  - dans ce cas, `JSR @init` génèrerait le même code machine que `JSR $4029`
  responses:
  - ...where

awesome:
  messages:
  - on a appris suffisamment d'assembleur 6502
  - passons au prochain chapitre, pour qu'on puisse commencer à coder notre émulateur 🙃
  responses:
  - "`JMP @nextChapter` [end]"
