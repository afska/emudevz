---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - '`JSR` и `RTS` ("Jump to Subroutine" и "Return from Subroutine", переход к подпрограмме и возврат из неё) — неразлучная парочка, обычно они используются вместе'
  - "`JSR` переходит в другую часть кода, а `RTS` возвращается на прежнее место"
  - по сути, это вызов функции и возврат из неё! 📞
  - посмотри пример ⏩
  responses:
  - откуда она знает, куда возвращаться? 😲 [where]

where:
  messages:
  - перед переходом `JSR` помещает в стек адрес следующей инструкции (минус 1)
  - а затем `RTS` извлекает этот адрес, прибавляет к нему 1 и переходит туда
  - код примера показывает, как с их помощью можно разделить код на модули 🗃️
  - <{JSR_RTS.png}>
  responses:
  - (*) почему без имён меток? [label]
  - круто! [awesome]

label:
  messages:
  - так тоже можно!
  - но нужно сообщить ассемблеру, где начинается код
  - с помощью директивы вроде `.org $4020`
  - в таком случае `JSR @init` создаст тот же машинный код, что и `JSR $4029`
  responses:
  - ...where

awesome:
  messages:
  - теперь мы достаточно знаем об ассемблере 6502
  - перейдём к следующей главе и начнём писать наш эмулятор 🙃
  responses:
  - "`JMP @nextChapter` [end]"
