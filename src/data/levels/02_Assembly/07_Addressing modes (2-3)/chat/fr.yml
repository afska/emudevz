---
main:
  run: |
    if (m.$exercise) {
      $.goTo("exercise");
    } else {
      set((m) => {
        m.chat.stopBlock = locales.get("not_now");
        m.$canRun = false;
        m.$canEdit = false;
      });
      {{Bottom}}.setMemoryStart(0x0);
    }
  messages: []
  events:
  - compiled [main2]

main2:
  run: |
    bus.emit("step");
  messages:
  - c'est là que l'adressage devient intéressant 🧐
  responses:
  - pourquoi ? [why]

why:
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - dans le mode d'adressage "Page zéro,X", une adresse en page zéro est fournie
  - et on y ajoute la valeur de [X]
  - lance les deux premières instructions ⏩
  events:
  - step [zero1]

zero1:
  messages: []
  events:
  - step [zero2]

zero2:
  run: |
    set((m) => m.$canRun = false);
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - ça a fini par écrire $CD (le contenu de [A]) en $0062
  - ce qui est le résultat de $60 + [X]
  - <{STA_zeropagex.png}>
  - note que j'ai modifié ta <Visionneuse de mémoire> pour afficher la page zéro
  - tu peux vérifier par toi-même 👀
  - lance les deux instructions suivantes ⏩
  events:
  - step [zero3]

zero3:
  messages: []
  events:
  - step [zero4]

zero4:
  run: |
    set((m) => m.$canRun = false);
  messages:
  - tu vois ? la <même> instruction (`STA $60,X`) a donné un résultat <différent> 🤯
  - comme [X] vaut maintenant 3, ça a écrit en $0063
  responses:
  - que se passe-t-il si le résultat de l'addition dépasse un octet ? [wrap]

wrap:
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - l'adresse se reboucle simplement 🎁
  - je vais te montrer
  - lance encore deux instructions ⏩
  events:
  - step [wrap1]

wrap1:
  messages: []
  events:
  - step [wrap2]

wrap2:
  run: |
    set((m) => m.$canRun = false);
  run-after-messages: |
    set((m) => m.$canRun = true);
    {{Bottom}}.setMemoryStart(0x4020);
  messages:
  - comme tu as vu, ça a écrit $CD en $05
  - le prochain mode d'adressage s'appelle "Absolu,X"
  - c'est la version absolue de "Page zéro,X"
  - je vais remettre la <Visionneuse de mémoire> à $4020 pour que tu puisses le voir
  - lance le reste du code ⏩
  events:
  - step [rest1]

rest1:
  messages: []
  events:
  - step [rest2]

rest2:
  messages:
  - ça a écrit $CD en $4052 😋
  - ($4050 + le contenu de [X])
  responses:
  - trop bien ! je peux utiliser [Y] à la place de [X] ? [yvariants]

yvariants:
  messages:
  - oui, il y a des équivalents de ces modes qui utilisent [Y]
  - toutes les instructions ne les supportent pas 👎
  - ils s'appellent "Page zéro,Y" et "Absolu,Y"
  - tu veux faire quelque chose d'amusant ?
  responses:
  - hmm... ouais ? [exercise]

exercise:
  run: |
    level.fillContentFromTemp();
    set((m) => {
      m.chat.stopBlock = null;
      m.$canRun = true;
      m.$canEdit = true;
      m.$exercise = true;
      m.content.useTemp = false;
    });
    {{Bottom}}.setDelay(0);
    {{Bottom}}.setMemoryStart(0x4020);
  messages:
  - 📚  efface tout le code
  - 📚  construis un programme qui parcourt les adresses mémoire en hurlant 😱
  - c'est-à-dire qu'il écrit $AA exactement 64 fois de $4080 à $40BF
  - 📚  comme toujours, quand c'est prêt, lance la commande `test`
  responses: []
