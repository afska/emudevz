---
main:
  run: |
    set((m) => {
      m.chat.stopBlock = locales.get("not_now");
      m.$canRun = false;
      m.$canEdit = false;
    });
  messages:
  - jusqu'ici, on n'a lancé que des programmes sans logique de <branchement>
  - on va changer ça
  - l'assembleur 6502 a plusieurs instructions de branchement 🌲
  - chacune branche selon si certains flags sont actifs ou non
  responses:
  - (*) 6502 quoi ? 🤔 [asm6502]
  - ok comment on branche [how]

asm6502:
  messages:
  - c'est le nom du processeur du NEEES, "6502"
  - chaque langage assembleur cible un CPU spécifique
  - avec son propre ensemble d'instructions
  - donc on écrit de l'"assembleur 6502" 🙂
  responses:
  - ...main

how:
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - on va regarder `BNE`
  - ("Branch on Not Equal")
  - lance les 5 premières instructions pour voir ce qu'elles font ⏩
  events:
  - step [step1]

step1:
  messages: []
  events:
  - step [step2]

step2:
  messages: []
  events:
  - step [step3]

step3:
  messages: []
  events:
  - step [step4]

step4:
  messages: []
  events:
  - step [step5]

step5:
  run: |
    set((m) => m.$canRun = false);
  messages:
  - voilà ce qui s'est passé
  - "`CPX #3` \"ComPare\" [X] avec 3, et active le Zero Flag s'ils sont égaux"
  - "[X] a un 7, et c'est pas égal à 3, donc ~Z~ = 0"
  - "`BNE @decrement` saute vers ce label si le Zero Flag n'est pas actif"
  - ce qui est le cas ! donc il a sauté 🦘
  - ([X] et 3 n'étaient "Not Equal", d'où le nom)
  responses:
  - ah, je vois [oh]

oh:
  run: |
    set((m) => m.$canRun = true);
  messages:
  - maintenant, lance le reste du code ⏩
  events:
  - end [exercise]

exercise:
  run: |
    level.fillContentFromTemp();
    set((m) => {
      m.chat.stopBlock = null;
      m.$canRun = true;
      m.$canEdit = true;
      m.content.useTemp = false;
    });
  messages:
  - l'opposé de `BNE` c'est `BEQ`, qui saute quand les nombres sont <égaux>
  - on va pratiquer 👾
  - 📚  supprime le code actuel
  - 📚  et construis un programme qui lit la valeur de $4080
  - 📚  si elle vaut 7, écrit $EE à $40BF
  - 📚  sinon, écrit $AA à $40BF
  - 📚  puis, lance la commande `test`
  responses:
  - attends, comment je teste ça ? 🧪 [testing]
  - j'ai besoin d'aide 😅 [help]

testing:
  messages:
  - j'ai mis en place un <générateur de nombres aléatoires> 🔢
  - à chaque fois que tu modifies/lances ton code, il va mettre soit un 7 soit un autre octet aléatoire dans $4080
  - avec ~50%~ de chance chacun
  - donc quand c'est 7, ton code doit écrire $EE
  - et quand c'est pas 7, $AA doit être écrit
  responses:
  - j'ai besoin d'aide 😅 [help]

help:
  messages:
  - 🔀  tu veux toujours utiliser `BEQ` et `BNE` après une instruction de comparaison (comme `CPX`)
  - "`CPX` met le flag ~Z~=1 si [X] est égal à la valeur, puis `BEQ`/`BNE` sautent selon si ~Z~ vaut 1 ou 0"
  - <{CPX_BEQ.png}>
  - 🏷️  rappelle-toi que l'exécution va toujours de haut en bas, en ignorant les labels
  - donc à un moment tu auras peut-être besoin d'<arrêter le programme> (pour éviter qu'il avance vers le label suivant)
  - 🛑  pour ça, tu peux mettre un label tout à la fin du code
  - et utiliser une instruction de branchement pour sauter jusqu'à lui
  - ou plus simplement, utiliser l'instruction `BRK`, qui stoppe l'exécution 😉
  - <{BRK.png}>
  responses: []
