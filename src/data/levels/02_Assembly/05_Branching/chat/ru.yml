---
main:
  run: |
    set((m) => {
      m.chat.stopBlock = locales.get("not_now");
      m.$canRun = false;
      m.$canEdit = false;
    });
  messages:
  - до сих пор мы запускали программы без <ветвлений>
  - давай это изменим
  - в ассемблере 6502 есть несколько инструкций ветвления 🌲
  - все они выполняют переход в зависимости от того, установлен определённый флаг или нет
  responses:
  - (*) 6502 что? 🤔 [asm6502]
  - окей, как сделать ветвление [how]

asm6502:
  messages:
  - '"6502" — название процессора NEEES'
  - каждый язык ассемблера предназначен для конкретного CPU
  - с его собственным набором инструкций
  - так что мы пишем на "ассемблере 6502" 🙂
  responses:
  - ...main

how:
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - посмотрим на `BNE`
  - ("Branch on Not Equal" — переход при неравенстве)
  - выполни первые 5 инструкций и посмотри, что они делают ⏩
  events:
  - step [step1]

step1:
  messages: []
  events:
  - step [step2]

step2:
  messages: []
  events:
  - step [step3]

step3:
  messages: []
  events:
  - step [step4]

step4:
  messages: []
  events:
  - step [step5]

step5:
  run: |
    set((m) => m.$canRun = false);
  messages:
  - вот что произошло
  - '`CPX #3` сравнивает ("ComPares") [X] с 3 и устанавливает флаг нуля, если они равны'
  - в [X] находится 7, а это не равно 3, поэтому ~Z~ = 0
  - "`BNE @decrement` переходит к этой метке, если флаг нуля не установлен"
  - он не установлен! поэтому переход состоялся 🦘
  - ([X] и 3 были не равны — "Not Equal", отсюда и название)
  responses:
  - а, понятно [oh]

oh:
  run: |
    set((m) => m.$canRun = true);
  messages:
  - теперь выполни оставшийся код ⏩
  events:
  - end [exercise]

exercise:
  run: |
    level.fillContentFromTemp();
    set((m) => {
      m.chat.stopBlock = null;
      m.$canRun = true;
      m.$canEdit = true;
      m.content.useTemp = false;
    });
  messages:
  - противоположность `BNE` — это `BEQ`, которая выполняет переход, когда числа <равны>
  - давай потренируемся 👾
  - 📚  удали текущий код
  - 📚  и напиши программу, которая читает значение по адресу $4080
  - 📚  если там 7, записывает $EE по адресу $40BF
  - 📚  иначе записывает $AA по адресу $40BF
  - 📚  затем запусти команду `test`
  responses:
  - погоди, как это проверить? 🧪 [testing]
  - нужна помощь 😅 [help]

testing:
  messages:
  - тут есть <генератор случайных чисел> 🔢
  - при каждом изменении или запуске кода он записывает по адресу $4080 либо 7, либо другой случайный байт
  - вероятность каждого варианта — ~50%~
  - так что при значении 7 твой код должен записать $EE
  - а при любом другом — $AA
  responses:
  - нужна помощь 😅 [help]

help:
  messages:
  - 🔀  `BEQ` и `BNE` стоит использовать после инструкции сравнения (например, `CPX`)
  - "`CPX` устанавливает флаг ~Z~=1, если [X] равен значению, а `BEQ`/`BNE` выполняют переход в зависимости от того, равен ~Z~ 1 или 0"
  - <{CPX_BEQ.png}>
  - 🏷️  помни, что выполнение всегда идёт сверху вниз, игнорируя метки
  - поэтому в какой-то момент может понадобиться <остановить программу> (чтобы она не дошла до следующей метки)
  - 🛑  для этого можно поставить метку в самом конце кода
  - и перейти к ней инструкцией ветвления
  - или просто использовать инструкцию `BRK`, которая останавливает выполнение 😉
  - <{BRK.png}>
  responses: []
