---
main:
  run: |
    set((m) => {
      m.chat.stopBlock = locales.get("not_now");
      m.$canRun = false;
      m.$canEdit = false;
    });
  run-after-messages: |
    $.goTo("main2");
  messages:
  - как уже говорилось, каждый регистр вмещает <один байт>
  - поэтому значения в них всегда от 0 ($00) до 255 ($FF)
  - например, число 260 в них записать нельзя 👮
  responses: []

main2:
  messages:
  - как думаешь, что случится, если вычислить 200 + 60 с помощью `ADC`?
  responses:
  - (*) [A] станет равен 2️⃣ 6️⃣ 0️⃣ [a260]
  - (*) [A] станет равен 2️⃣ 5️⃣ 5️⃣ [a255]
  - (*) [A] станет равен 4️⃣ [a4]
  - (*) возникнет ошибка ⚠️ [error]
  - (*) CPU взорвётся? 💥 [explodes]

a260:
  messages:
  - не-а, максимальное значение — 255, так что это невозможно 👮
  - попробуй ещё раз
  - ...main2
  responses:
  - ...main2

a255:
  messages:
  - звучит логично, но происходит другое 👎
  - попробуй ещё раз
  - ...main2
  responses:
  - ...main2

error:
  messages:
  - CPU не <выбрасывают ошибки>
  - попробуй ещё раз
  - ...main2
  responses:
  - ...main2

explodes:
  messages:
  - 💥 💥 💥
  - это объяснило бы проблемы с температурой у моего ПК 🌡️
  - наверное, какая-то программа пытается переполнить регистры CPU
  - нет, попробуй ещё раз
  - ...main2
  responses:
  - ...main2

a4:
  messages:
  - верно! ✅
  - но процессор не такой уж глупый
  - он сообщает программе, что значение не поместилось
  - устанавливая флаг переноса в 1
  responses:
  - что такое флаг? 🏁 [flags]

flags:
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - это булево (~1~-битное) значение, которое устанавливает процессор
  - оно сообщает что-то о предыдущей инструкции
  - флагов 6, поэтому все они помещаются в один байт
  - (этот байт называется регистром флагов)
  - попробуй запустить код ⏩
  events:
  - end [carry]

carry:
  messages:
  - теперь в отладчике видно, что флаг переноса установлен в 1
  responses:
  - (*) ого, а какие ещё полезные флаги есть? [exercise]
  - (*) погоди, всё это время числа можно было писать в десятичной системе? 😤 [decimal]

decimal:
  messages:
  - "ага! `LDA #200` — то же самое, что `LDA #$C8`"
  - "📝  итак, коротко повторим:"
  - "#$20 обозначает число 32 (десятичное) или $20 (шестнадцатеричное)"
  - "#20 обозначает число 20 (десятичное) или $14 (шестнадцатеричное)"
  - $20 обозначает ~33-й~ байт памяти с адресом 32 (десятичным) или $20 (шестнадцатеричным)
  - 20 обозначает ~21-й~ байт памяти с адресом 20 (десятичным) или $14 (шестнадцатеричным)
  responses:
  - ...carry

exercise:
  run: |
    level.fillContentFromTemp();
    set((m) => {
      m.chat.stopBlock = null;
      m.$canRun = true;
      m.$canEdit = true;
      m.content.useTemp = false;
    });
  messages:
  - "ага, есть флаг нуля: инструкции устанавливают его в 1, когда результат равен ~нулю~"
  - 📚  не удаляя текущий код, попробуй вычесть 4 из [A] инструкцией `SBC`
  - она работает как `ADC`, только вычитает вместо сложения
  - после этой инструкции флаг нуля должен быть равен 1 😊
  - 📚  когда всё будет готово, запусти команду `test`
  responses:
  - ...carry
