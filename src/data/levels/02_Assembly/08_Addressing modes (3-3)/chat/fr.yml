---
main:
  run: |
    set((m) => {
      m.chat.winOnEnd = true;
      m.chat.stopBlock = locales.get("not_now");
      m.$canRun = false;
    });
    {{Bottom}}.setMemoryStart(0x0);
  messages:
  - maintenant, les plus dingues 😓
  - commençons par "Indexé indirect"
  - c'est un croisement entre "Page zéro,X" et "Indirect"
  - en gros, tu prends l'adresse de page zéro, tu y ajoutes la valeur de [X]
  - puis tu utilises ça pour chercher une adresse de deux octets
  responses:
  - ça commence à devenir obscur [what]

what:
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - je sais 😅 🔫
  - essayons un exemple
  - lance les 4 premières instructions ⏩
  events:
  - step [step1]

step1:
  messages: []
  events:
  - step [step2]

step2:
  messages: []
  events:
  - step [step3]

step3:
  messages: []
  events:
  - step [step4]

step4:
  run: |
    set((m) => m.$canRun = false);
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - on a préparé la mémoire pour l'adressage indirect
  - à l'adresse $0003, on a un $80
  - à l'adresse $0004, on a un $40
  - maintenant je vais remettre la <Visionneuse de mémoire> à la section habituelle
  - lance les 3 autres instructions ⏩
  events:
  - step [step5]

step5:
  run: |
    {{Bottom}}.setMemoryStart(0x4020);
    {{Bottom}}.setSelectedCells([0x402c, 0x402d]);
  messages: []
  events:
  - step [step6]

step6:
  messages: []
  events:
  - step [step7]

step7:
  run: |
    set((m) => m.$canRun = false);
  messages:
  - on a chargé un $FA dans [A] et un $02 dans [X]
  - "`STA ($01,X)` peut être interprété comme `STA ($01+X)`"
  - donc si on ajoute [X], on aurait `STA ($0003)`
  - à partir de là, les choses se déroulent comme en adressage "Indirect" standard
  - ça finit par écrire la valeur de [A] en $4080
  - <{STA_indexedindirect.png}>
  responses:
  - (*) tu peux répéter ? 🤨 [whatwasthat]
  - ça fait totalement sens 👍 [makessense]

whatwasthat:
  messages:
  - tu te souviens du mode "Indirect" ?
  - il construit une adresse en lisant une autre adresse et l'octet consécutif
  - dans ce cas, il a lu un $80 depuis $0003 et un $40 depuis $0004
  - il a utilisé le premier comme octet de poids faible
  - et le second comme octet de poids fort
  - donc la nouvelle adresse résultante était $4080 ✨
  responses:
  - ...step7

makessense:
  run: |
    {{Bottom}}.setSelectedCells([0x4030, 0x4031]);
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - parlons de "Indirect indexé"
  - le dernier, je te le promets 🤞
  - au lieu d'ajouter [X] à l'adresse <avant> d'évaluer l'indirection
  - il ajoute [Y] directement <après> l'avoir fait
  - lance le reste du code ⏩
  - et garde en tête qu'il y a un $BE préchargé en $4085
  events:
  - step [step8]

step8:
  messages: []
  events:
  - step [step9]

step9:
  messages:
  - ce $BE a été chargé dans [A] 🤯
  - comme on l'a vu plus tôt, dans notre configuration actuelle `($0003)` s'évalue à $4080
  - l'instruction a juste ajouté [Y], donc l'adresse finale était $4085
  - <{LDA_indirectindexed.png}>
  responses:
  - je crois que j'en ai marre, on peut passer l'exercice ? 😓 [skip]

skip:
  messages:
  - bien sûr, tu ne verras pas ça trop souvent de toute façon
  - tu vas coder un émulateur
  - donc tu dois construire un <interpréteur> pour ces choses
  - pas les choses elles-mêmes 😉
  responses:
  - compris... [end]
