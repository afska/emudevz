---
main:
  run: |
    set((m) => {
      m.chat.winOnEnd = true;
      m.chat.stopBlock = locales.get("not_now");
      m.$canRun = false;
    });
  messages:
  - познакомимся с редактором кода
  - ну, пока это ещё не <редактор> 😅
  - а просто <просмотрщик>
  - в нём открыт пример простой программы для NEEES
  responses:
  - (*) просмотрщик меня не пугает, а вот странные числа внизу — ещё как [debugger]
  - что это за язык? 😮 [language]
  - ⏭️  я это уже знаю [iknow]

iknow:
  messages:
  - 🤔
  - ты <точно> знаешь ассемблер 6502?
  - (регистры, флаги, ветвления, режимы адресации, стек и подпрограммы)
  - если нет, в следующей главе придётся <помучиться>
  - хотя сюда всегда можно вернуться и пройти главу позже
  - хочешь пропустить ВСЮ главу?
  responses:
  - ⏭️  да, пропустить [skip]
  - ❌  нет, уверенности нет [main]

skip:
  run: |
    level.unlockLetsPlayLevelIfNeeded("lets-play-spacegulls");
    const book = store.getState().book.instance;
    const chapter = book.getChapterOf(level.id);
    const lastLevelId = chapter.levels[chapter.levels.length - 1].id;
    const nextLevelId = book.nextIdOf(lastLevelId, true);
    store.dispatch.savedata.unlockChapter(nextLevelId);
    store.dispatch.savedata.advanceTo(nextLevelId);
  messages: []
  events:
  - null [end]

debugger:
  messages:
  - отладчик CPU?
  - не переживай
  - сейчас всё объясню!
  responses:
  - ...main

language:
  messages:
  - это язык ассемблера!
  - самый низкий уровень абстракции в компьютерах 💻
  - он напрямую переводится в байты, которые выполняет CPU
  responses:
  - '"переводится"? [machinecode]'

machinecode:
  run: |
    {{Bottom}}.setSelectedCells([0x4020, 0x4021, 0x4022, 0x4023, 0x4024, 0x4025, 0x4026, 0x4027, 0x4028, 0x4029, 0x402A, 0x402B, 0x402C, 0x402D, 0x402E]);
  messages:
  - именно
  - ~ассемблер~ преобразует код на языке ассемблера в байты в памяти
  - эти байты называются машинным кодом, именно его понимает CPU
  - посмотри на <просмотр памяти> в правом нижнем углу экрана!
  - в этой симуляции код начинается с адреса памяти $4020
  - если навести мышь на один из адресов, появится подсказка, где начинается каждая инструкция
  - <{compilation.png}>
  responses:
  - (*) что такое адрес памяти? [address]
  - а что за остальные числа? 👀 [otherthings]

address:
  run: |
    set((m) => m.$address = true);
  messages:
  - число, которое обозначает место в памяти 🐏
  - в NEEES адреса занимают 2 байта
  - поэтому их значения бывают от 0 ($0000) до 65535 ($FFFF)
  - в каждой ячейке (как и почти везде в NEEES) помещается один байт
  - байт может хранить любое число от 0 ($00) до 255 ($FF)
  responses:
  - у NEEES всего 2048 байт WRAM, откуда тогда 65536 адресов? [butyousaid]
  - <<!m.$hasEnded>> ...machinecode
  - <<m.$hasEnded>> ...finish

butyousaid:
  messages:
  - отличный вопрос!
  - настоящей памяти у неё всего 2 КиБ
  - но CPU может <видеть> до 64 КиБ
  - поэтому первые два килобайта — это <настоящая RAM>
  - а остальное используется для взаимодействия с устройствами 💻
  - <{memory.png}>
  - в этой главе это не так важно
  - для простоты мы симулируем RAM размером 64 КиБ
  responses:
  - <<!m.$hasEnded>> ...machinecode
  - <<m.$hasEnded>> ...finish

otherthings:
  run-after-messages: |
    {{Bottom}}.setSelectedCells([]);
    set((m) => m.$canRun = true);
  messages:
  - давай запустим код и разберёмся
  - <! Выполнение включено.
  - в панели кода появилась кнопка ⏩
  - можешь её нажать? 🙏
  events:
  - step [lda]

lda:
  run: |
    set((m) => m.$canRun = false);
  messages:
  - отлично!
  - если внимательно посмотреть, видно, что [A] изменился с $00 на $01
  - а [PC] — с $4020 на $4022 🤯
  - это регистры CPU, ячейки с быстрым доступом
  - каждый регистр может хранить один байт (~8~ бит) данных
  - кроме [PC] ("Program Counter", счётчика команд), который занимает 2 байта
  responses:
  - для чего нужен каждый регистр? [registers]

registers:
  messages:
  - "[A] — это аккумулятор, а его назначение зависит от программы"
  - "[PC] всегда указывает на следующую инструкцию для выполнения"
  responses:
  - "то есть `LDA #$01` — это команда процессору записать число $01 в [A]? 😲 [ldaexplanation]"
  - "(*) интересно, а что за остальные: [X], [Y] и [SP]? [theothers]"

theothers:
  run: |
    set((m) => m.$others = true);
  messages:
  - об этом позже, но если коротко
  - "[X] и [Y] могут хранить любое значение, как и [A]"
  - при работе с адресами памяти у них особое назначение 🐏
  - а [SP] — это "Stack Pointer", указатель стека
  responses:
  - <<!m.$hasEnded>> ...registers
  - <<m.$hasEnded>> ...finish

ldaexplanation:
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - именно, `LDA` означает "LoaD Accumulator" — загрузить аккумулятор
  - 💸  числа с префиксом ~$~ записаны в шестнадцатеричной системе
  - 🔢  числа с префиксом ~#~ — это непосредственные значения
  - 🐏  числа без префикса ~#~ обозначают адреса памяти
  - теперь запусти следующую инструкцию! ⏩
  events:
  - step [sta]

sta:
  run: |
    set((m) => m.$canRun = false);
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - '`STA` означает "STore Accumulator" — сохранить аккумулятор'
  - и, как видишь, записывает содержимое [A] по адресу памяти
  - в этом примере — по адресу $4070
  - теперь в ячейке $4070 в <просмотре памяти> находится $01
  - попробуй выполнить остальные инструкции ⏩
  events:
  - end [finish]

finish:
  run: |
    set((m) => m.$hasEnded = true);
    {{Bottom}}.setDelay(500);
  messages:
  - класс, теперь ты знаешь основы работы CPU
  - нажми кнопку ⏮  и запускай симуляцию столько раз, сколько нужно
  - когда всё станет понятно, можно перейти к следующему уровню
  responses:
  - 💪  думаю, можно идти дальше [end]
  - <<!m.$others>> (*) а что с [X], [Y] и [SP]? [theothers]
  - <<!m.$address>> (*) ещё раз... что такое адрес памяти? [address]
  - (*) не люблю нажимать кнопки [clicking]

clicking:
  messages:
  - хмм...
  - можно перейти в панель кода сочетанием ~Alt+Up~
  - затем нажать ~Alt+Enter~
  - и вернуться обратно сочетанием ~Alt+Left~
  responses:
  - ...finish
