---
main:
  run: |
    set((m) => {
      m.chat.stopBlock = locales.get("not_now");
      m.$canRun = false;
      m.$canEdit = false;
    });
  messages:
  - стек 🧱  — структура <LIFO> ("Last In, First Out", последний на входе — первый на выходе), в которой программы могут хранить значения
  - текущая глубина стека определяется указателем стека ("Stack Pointer", [SP])
  - у процессора 6502 стек находится в памяти между $0100 и $01FF 🐏
  - изначально [SP] равен $FF и указывает на последний байт стека ($01FF)
  - когда в стек добавляется байт, [SP] становится $FE (адрес памяти $01FE), и так далее
  - вот пример стека с 2 значениями (в $01FF и $01FE), поэтому [SP] указывает на $01FD
  - <{stack.png}>
  responses:
  - а как положить в него значения? [put]

put:
  messages:
  - "для этого есть две инструкции:"
  - ⬆️  `PHA` ("PusH Accumulator"), которая помещает [A] в стек
  - <{stack_PHA.png}>
  - ⬇️  `PLA` ("PulL Accumulator"), которая извлекает последний байт из стека и загружает его в [A]
  - <{stack_PLA.png}>
  responses:
  - можешь объяснить код примера? [example]

example:
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - в нём два цикла ➰
  - "`@save` записывает нечётные числа с $4080 по $4087"
  - а `@load` записывает эти числа в обратном порядке с $4098 по $409F
  - первый <помещает> значения в стек, второй <извлекает> их из стека
  - теперь в твоём отладчике есть раздел стека 👀
  - запусти код и посмотри самостоятельно ⏩
  responses:
  - отлично, теперь понятно [exercise]
  - (*) почему `PLA` не удаляет значение из стека? [remove]

remove:
  messages:
  - она "удаляет" его, просто увеличивая [SP]
  - но само значение остаётся в памяти 😅
  - "удалять его незачем: к стеку обращаются только через подходящие инструкции"
  responses:
  - ...example

exercise:
  run: |
    level.test.precode = "pretest.asm";
    level.fillContentFromTemp();
    set((m) => {
      m.chat.stopBlock = null;
      m.$canRun = true;
      m.$canEdit = true;
      m.content.useTemp = false;
    });
  messages:
  - теперь упражнение
  - 📚  удали весь код
  - в твоём стеке будут 2 заранее загруженных случайных значения
  - 📚  нужно извлечь их и записать по 2 последовательным адресам памяти
  - 📚  затем выполнить косвенный `JMP` 🦘
  - например, если в стеке сверху вниз находятся $C4 и $3E, по завершении программы [PC] должен быть равен $3EC4
  - 📚  когда всё будет готово, запусти `test` 😊
  responses: []
