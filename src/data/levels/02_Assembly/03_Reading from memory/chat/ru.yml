---
main:
  run: |
    set((m) => {
      m.chat.stopBlock = locales.get("not_now");
      m.$canRun = false;
      m.$canEdit = false;
    });
  messages:
  - итак, сочетание `LDA` + `STA` позволяет записывать данные в память ✍️
  - "есть похожие инструкции для регистров [X] и [Y]:"
  - "`LDX`, `STX`, `LDY` и `STY`"
  - теперь воспользуемся вариантами для [X], просто ради интереса 👾
  responses:
  - а если нужно <прочитать> из памяти? 📖 [read]

read:
  messages:
  - в `LDX` можно передать адрес памяти, просто убрав префикс ~#~
  - то есть инструкция `LDX $4080` загрузит в [X] значение, находящееся по адресу памяти $4080
  - <{LDX_memory.png}>
  responses:
  - а потом что? 🤔 [then]

then:
  messages:
  - после загрузки в регистр со значением можно делать что угодно
  - обычно его <изменяют> и копируют в другой регистр
  - или по другому адресу памяти! 🐏
  - например, `INX` увеличивает значение в [X] на единицу
  responses:
  - можно попробовать? [tryit]

tryit:
  run-after-messages: |
    set((m) => m.$canRun = true);
  messages:
  - конечно, по адресу $4085 уже лежит $10
  - запусти текущий код и посмотри, что получится ⏩
  events:
  - end [result]

result:
  messages:
  - видишь? программа прочитала $10
  - увеличила его на единицу 3 раза
  - и записала результат по адресу $4086 😎
  responses:
  - слишком много возни, а если нужно увеличить его на 8? [8times]

8times:
  messages:
  - "тогда пишешь:"
  - <INX>
  - <INX>
  - <INX>
  - <INX>
  - <INX>
  - <INX>
  - <INX>
  - <INX>
  - ахах, шучу 😂
  - есть инструкция сложения
  - "можно написать `ADC #$08`, чтобы увеличить [A] на восемь"
  responses:
  - фух 😅 [iknow]
  - но... [iknow]

iknow:
  run-after-messages: |
    $.goTo("exercise");
  messages:
  - да-да, речь про [A], а не [X]
  - "`ADC` работает только с [A] 🤷"
  - хмм...
  responses: []

exercise:
  run: |
    level.fillContentFromTemp();
    set((m) => {
      m.chat.stopBlock = null;
      m.$canRun = true;
      m.$canEdit = true;
      m.content.useTemp = false;
    });
  messages:
  - давай переработаем код 💡
  - 📚  замени 3 инструкции увеличения на `ADC`
  - (не забудь заменить `LDX` и `STX` на `LDA` и `STA`)
  - 📚  когда всё будет готово, запусти команду `test`
  responses: []
