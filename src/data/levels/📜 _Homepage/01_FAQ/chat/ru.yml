---
main:
  messages:
  - "привет!"
  - "есть вопросы? 👀"
  responses:
  - "(*) игра про создание эмуляторов? <зачем>? [why]"
  - "(*) это <игра> или <учебник>? [tutorial]"
  - "(*) значит, NEEES? [name]"
  - "(*) нужны <знания программирования>? [requirements]"
  - "(*) какие <темы> разбираются? [topics]"
  - "(*) это сгенерировано <ИИ>? [ai]"
  - "(*) это <бесплатно> и с открытым кодом? [free]"

why:
  messages:
  - "да"
  - "создавать свой первый эмулятор было <очень весело> 👾"
  - "хочется, чтобы и другие научились делать свои!"
  responses:
  - ...main

tutorial:
  messages:
  - "честно — называй как хочешь! 🤷"
  - "думаю, и то и другое"
  - "но в первую очередь это пошаговый учебник, а уже потом игра"
  - "я всё равно называю это <игрой>: здесь есть ясная цель, правила и испытания, которые можно пройти или провалить"
  - "и потому что это весело!"
  responses:
  - ...main

name:
  messages:
  - "ага 🙂"
  - "это как <NES>, но упрощённая для обучения"
  - "большинство <игр для NES> работают нормально, кроме тех, которые полагаются на сложные детали оборудования"
  responses:
  - ...main

requirements:
  messages:
  - "предполагается знакомство с <объектно-ориентированным программированием> и <базовое понимание> устройства компьютеров"
  - "(то есть байты, целые числа со знаком, булева логика, системы счисления и так далее)"
  - "код будем писать на JavaScript"
  responses:
  - ...main

topics:
  messages:
  - "ты получишь эмулятор BrokenNEEES: <модульный>, но <с ошибками>"
  - "цель — заменить сломанные блоки новыми, написанными с нуля"
  - "в любом порядке!"
  - |-
    вот чему можно <научиться>:
      **->** 🔨  Основы ассемблера 6502
      **->** 💾  Эмуляция картриджа
      **->** 🚌  Эмуляция шин памяти
      **->** 🎮  Эмуляция контроллера
      **->** 🧠  Эмуляция CPU (официальные инструкции), проверяемая через <nestest> и модульные тесты
      **->** 🖥️  Эмуляция PPU, проверяемая видео- и модульными тестами
      **->** 🔊  Эмуляция APU, проверяемая аудио- и модульными тестами
      **->** 🗜️  Эмуляция мапперов как бонус
  - |-
    что останется <за рамками>:
      **->** 👮  Недокументированные опкоды
      **->** 🎯  Точные тайминги
      **->** 🔌  Поведение открытой шины
      **->** 👻  Малоизвестные особенности оборудования
      **->** ✋  Прерывания APU
  - |-
    что будет <частично за рамками> — с объяснением, но готовой реализацией:
      **->** 🔄  Синхронизация блоков
      **->** ✨  Интерфейс эмулятора (код, зависящий от платформы)
      **->** 📥  Сохранения состояния
  - |-
    ещё в игре есть библиотечные файлы, которые облегчают некоторые задачи:
      **->** 📜  Правильная прокрутка PPU (с регистрами `t` и `v` по схеме <Loopy>)
      **->** 🤏  Воспроизведение DPCM в APU
  responses:
  - "почему не стремиться к <точности>? [accuracy]"


accuracy:
  messages:
  - "думаю, стремиться к точности в самом первом эмуляторе — <плохая идея> 💀"
  - "это лишь добавит лишней сложности и помешает изучать важные понятия"
  - |+
    сначала можно изучить основы оборудования и эмуляции, а точностью заняться <позже>
  - "после прохождения у тебя будет добротный эмулятор, который запускает большую часть <игр для NES> с мапперами от 0 до 4"
  - |+
    он не пройдёт многие тестовые ROM от <Blargg>, но картинка и звук будут хорошими! просто не рассчитывай создать следующий <Mesen> 😊
  - "многое здесь <упрощено> — поэтому у консоли другое название"
  - "если что, это не <NES>! значит, нельзя быть неточной копией того, чем она не является 😉"
  responses:
  - ...main

ai:
  messages:
  - "нет!!!"
  - "мне просто нравятся эмодзи 😅"
  - "разработка игры началась ещё до того, как LLM стали популярны"
  - "а потом эмодзи начали ассоциироваться с ИИ"
  - "всё менять было уже поздновато"
  - "так что пусть этот стиль живёт!"
  responses:
  - ...main

free:
  messages:
  - "да 👍"
  - "но если проект тебе нравится, твоя поддержка очень порадует :-)"
  - "код распространяется по лицензии <MIT>, а уровни — по <CC BY-NC>"
  - "все подробности — в разделе <Авторы>"
  responses:
  - ...main
