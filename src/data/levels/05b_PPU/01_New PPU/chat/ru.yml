---
main:
  run: |
    {{Top}}.load("rendering.png");
  messages:
  - сейчас начнём рисовать на экране <настоящие пиксели>! 🖥️
  - но сначала нужно кое в чём разобраться
  - например, в 🚲  тактах, 🌠  строках развёртки и 🖼️  кадрах!
  responses:
  - что это значит? [wdym]

wdym:
  messages:
  - 📈  NEEES выдаёт видеосигнал с частотой ~60FPS~
  - 🖼️  каждый кадр — это изображение ~256x240~ (представь сетку пикселей)
  - 🌠  строка развёртки — это один ряд в этой сетке
  - 🚲  а на отрисовку каждой строки уходит 341 такт PPU
  responses:
  - а... что такое такт? 🚲 [cycles]

cycles:
  messages:
  - такт — это один импульс тактового генератора, минимальная единица выполнения!
  - это крошечные доли секунды, ведь за секунду проходит больше 5 миллионов тактов PPU
  - за один такт PPU может прочитать или записать данные, а то и нарисовать пиксель на экране 🎨
  responses:
  - (*) такты PPU и CPU — это одно и то же? 🤔 [same]
  - как происходит отрисовка? 🖌️ [drawing]

same:
  messages:
  - по смыслу да, но 🖥️  PPU работает <в 3 раза> быстрее 🧠  CPU
  - поэтому такты PPU короче (один такт PPU по времени занимает ~1/3~ такта CPU)
  - <{unit_speeds.png}>
  responses:
  - ...cycles

drawing:
  run: |
    {{Top}}.load("scanlines.gif");
  messages:
  - отрисовка идёт сверху вниз, строка за строкой, по одному пикселю за такт
  - первые 240 строк составляют видимую часть изображения
  - есть ещё несколько невидимых строк, которые дают PPU немного отдохнуть 🏖️
  responses:
  - что значит «отдохнуть»? [vblank_hblank]

vblank_hblank:
  run: |
    {{Top}}.load("rendering.png");
  messages:
  - в каждой строке, после отрисовки всех пикселей, есть короткий перерыв — горизонтальный интервал гашения, или HBlank
  - а после всех видимых строк начинается перерыв подольше — вертикальный интервал гашения, или VBlank 🏝️
  - во время VBlank/HBlank PPU не рисует пиксели, и программа может обновить экран
  responses:
  - ясно, что дальше? [exercise]

exercise:
  messages:
  - 📚  создай файл с кодом PPU, взяв 📄  ~/tmpl/ppu/PPU.js~ за шаблон
  - |-
    📚  чтобы отслеживать время, добавь этот метод:
    **step()**:
      **->** увеличивает `cycle`
      **->** если ```javascript cycle >= 341```:
        **->** задаёт ```javascript cycle = 0```
        **->** увеличивает `scanline`
        **->** если ```javascript scanline >= 261```:
          **->** задаёт ```javascript scanline = -1```
          **->** увеличивает `frame`
  - 📚  затем импортируй свой файл из 📄  ~/code/index.js~
  - и добавь соответствующий ключ `PPU` в экспортируемый объект
  responses:
  - (*) почему счётчик строк начинается с -1? 😕 [minus1]

minus1:
  messages:
  - строка ~-1~ (её ещё называют подготовительной) невидима, и в ней PPU готовится к следующему кадру
  - в это время сбрасываются некоторые важные флаги состояния
  - об этом чуть позже! 🔜
  responses:
  - ...exercise
