main:
  messages:
  - как мы видели в уровне про OAM, спрайты можно 🤸  <отражать> по горизонтали и вертикали
  - в классе `Sprite` это представлено атрибутами `flipX` и `flipY`
  - 📚  измени свой 🛸  `SpriteRenderer`, чтобы он рисовал правильные пиксели в зависимости от этих атрибутов
  - учти, что `Sprite::tileIdFor(...)` уже меняет идентификатор тайла при отражении в режиме ~8x16~, так что нужно поправить только внутренние координаты X и Y
  responses:
  - (*) погоди, что значит ~отражать~? [whats]
  - (*) нужна помощь с отражением по горизонтали [horizontal]

whats:
  messages:
  - допустим, исходный спрайт выглядит так
  - <{tile.png;8x8}>
  - если в его записи OAM включён бит <отражения по горизонтали> (байт 2, бит 6), он выглядит так
  - <{tile_hflip.png;8x8}>
  - а если включён бит <отражения по вертикали> (байт 2, бит 7), то так
  - <{tile_vflip.png;8x8}>
  responses:
  - ...main

horizontal:
  messages:
  - смотри, при вызове `tile.getColorIndex(...)` ты передаёшь координату `insideX`
  - при отражении спрайта по горизонтали нужно использовать <противоположный> пиксель
  - например, если `insideX` равно 0, используй 7; если равно 1 — используй 6
  - |-
    вот такая логика:
      0 => 7
      1 => 6
      2 => 5
      3 => 4
      4 => 3
      5 => 2
      6 => 1
      7 => 0
  - по сути, нужно вычислить `7 - insideX`
  responses:
  - а что с отражением по вертикали? [vertical]

vertical:
  messages:
  - отражение по вертикали похоже, но есть небольшая особенность
  - чтобы учесть спрайты ~8x16~, нужно использовать координату Y <внутри текущего тайла>
  - сначала определи ```javascript tileInsideY = insideY % 8;```
  - |-
    затем последним аргументом конструктора 🕊️  `Tile` передай:
      ```javascript sprite.flipY ? 7 - tileInsideY : tileInsideY```
  responses:
  - ...main

corollary:
  messages:
  - у тебя есть игра 🧸 📍  ~Nalleland~?
  - запусти её и увидишь, что теперь медведь <правильно отражается> при повороте налево
  responses:
  - ▶️  продолжить [end]
