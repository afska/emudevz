main:
  messages:
  - comme tu l'as vu dans le niveau OAM, les sprites peuvent être 🤸  <retournés>, aussi bien horizontalement que verticalement
  - c'est représenté dans notre classe `Sprite` avec les attributs `flipX` et `flipY`
  - 📚  modifie ton 🛸  `SpriteRenderer` pour qu'il trace les bons pixels en fonction de ces attributs
  - garde à l'esprit que `Sprite::tileIdFor(...)` retourne déjà l'id de tile en mode ~8x16~, donc tu dois seulement ajuster les coordonnées X et Y internes
  responses:
  - (*) attends, qu'est-ce que tu voulais dire par ~retourné~ ? [whats]
  - (*) j'ai besoin d'aide avec le retournement horizontal [horizontal]

whats:
  messages:
  - disons que le sprite original ressemble à ça
  - <{tile.png;8x8}>
  - quand son entrée OAM a le bit de <retournement horizontal> activé (octet 2, bit 6), il ressemble à ça
  - <{tile_hflip.png;8x8}>
  - et quand il a le bit de <retournement vertical> activé (octet 2, bit 7), il ressemble à ça
  - <{tile_vflip.png;8x8}>
  responses:
  - ...main

horizontal:
  messages:
  - tu vois, quand tu appelles `tile.getColorIndex(...)` tu passes la coordonnée `insideX`
  - quand le sprite est retourné horizontalement, tu dois utiliser le pixel <opposé>
  - par exemple, si `insideX` vaut 0, tu utilises 7 ; s'il vaut 1, tu utilises 6
  - |-
    en suivant cette logique :
      0 => 7
      1 => 6
      2 => 5
      3 => 4
      4 => 3
      5 => 2
      6 => 1
      7 => 0
  - donc en gros tu dois faire `7 - insideX`
  responses:
  - et le retournement vertical ? [vertical]

vertical:
  messages:
  - le retournement vertical est similaire, mais il a une petite particularité
  - pour prendre en compte les sprites ~8x16~, on doit utiliser la coordonnée Y <à l'intérieur de la tile courante>
  - commence par définir ```javascript tileInsideY = insideY % 8;```
  - |-
    puis, comme dernier argument du constructeur de 🕊️  `Tile`, utilise :
      ```javascript sprite.flipY ? 7 - tileInsideY : tileInsideY```
  responses:
  - ...main

corollary:
  messages:
  - tu as le jeu 🧸 📍  ~Nalleland~ ?
  - si tu le lances, tu verras que l'ours se <retourne correctement> maintenant quand il tourne à gauche
  responses:
  - ▶️  continuer [end]
