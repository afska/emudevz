main:
  messages:
  - puisqu'on sait déjà quels sprites on doit dessiner et comment rendre les tiles,
  - dessiner les sprites sera assez <facile>
  - |-
    notre méthode pour rendre une seule 🌠  scanline ressemblera à ça :
      ```javascript
      renderScanline() {
        const sprites = this._evaluate();
        this._render(sprites); // il faut définir ça !
      }```
  responses:
  - facile... vraiment ? [exercise]

exercise:
  messages:
  - voilà ce qu'on va faire
  - |-
      📚  dans la classe 🖥️  `PPU`, <modifie> :
      **_onVisibleLine()**:
        **->** juste en dessous de l'appel à `renderScanline()` de `backgroundRenderer`...
        **->** ...fais pareil avec `spriteRenderer`
  - |-
      📚  et maintenant, implémente ces méthodes dans 🛸  `SpriteRenderer` :
      **renderScanline()**:
        **->** utilise le code de mon message précédent !
      **_render(sprites)**:
        **->** détermine la coordonnée y :
          ```javascript this.ppu.scanline;```
          (appelons ça `y`)
        **->** pour chaque `sprite` dans `sprites` :
          **->** calcule la coordonnée Y "interne" :
            ```javascript sprite.diffY(y)```
            (appelons ça `insideY`)
          **->** instancie une 🕊️  `Tile` en passant le ppu, l'id de la pattern table, l'id de la tile, et `insideY % 8`
            (appelons ça `tile`)
          **->** crée un tableau avec les 4 couleurs de palette de ```javascript sprite.paletteId```
            (appelons ça `paletteColors`)
          **->** ```javascript for (let insideX = 0; insideX < 8; insideX++)``` :
            **->** récupère l'index de couleur pour ce pixel avec ```javascript tile.getColorIndex(insideX)```
              (appelons ça `colorIndex`)
            **->** si ```javascript colorIndex > 0``` (c'est-à-dire que le pixel n'est pas transparent) :
              **->** appelle ```javascript this.ppu.plot(...)``` pour dessiner le pixel
  responses:
  - (*) quelle pattern table utiliser ? [patterntable]
  - (*) quel id de tile utiliser ? [tileid]
  - (*) pourquoi ~insideY % 8~ ? [whymod8]
  - (*) comment obtenir les couleurs de palette ? [palette]
  - (*) quel ~X~ et ~Y~ utiliser lors du tracé des pixels ? [coordinates]
  - (*) quelle couleur utiliser lors du tracé des pixels ? [color]

