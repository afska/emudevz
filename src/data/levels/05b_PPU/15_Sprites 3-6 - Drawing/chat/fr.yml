whymod8:
  messages:
  - pour bien gérer les sprites ~8x16~ !
  - quand le mode ~8x16~ est activé via 🎛️  PPUCtrl, chaque sprite utilise deux tiles empilées verticalement
  - donc, par exemple, ~y=10~ dans un sprite ~8x16~, ça correspond à ~y=2~ de sa deuxième tile
  responses:
  - ...exercise

palette:
  messages:
  - |-
    tu peux obtenir, par exemple, la <couleur 2> avec :
    ```javascript this.ppu.getColor(sprite.paletteId, 2)```
  responses:
  - ...exercise

coordinates:
  messages:
  - la position ~x~ doit être ```javascript sprite.x + insideX```
  - la position ~y~ doit être la scanline courante
  responses:
  - ...exercise

color:
  messages:
  - accéder à `paletteColors` avec le `colorIndex` te donnera la ~couleur~
  responses:
  - ...exercise
