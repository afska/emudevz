main:
  messages:
  - мы уже знаем, какие спрайты нужно рисовать и как отрисовывать тайлы,
  - так что рисовать спрайты будет довольно <легко>
  - |-
    метод отрисовки одной 🌠  строки будет выглядеть так:
      ```javascript
      renderScanline() {
        const sprites = this._evaluate();
        this._render(sprites); // we need to define this!
      }```
  responses:
  - легко... да? [exercise]

exercise:
  messages:
  - сделаем следующее
  - |-
      📚  в классе 🖥️  `PPU` <измени>:
      **_onVisibleLine()**:
        **->** сразу после вызова `renderScanline()` у `backgroundRenderer`...
        **->** ...сделай то же самое для `spriteRenderer`
  - |-
      📚  теперь реализуй эти методы в 🛸  `SpriteRenderer`:
      **renderScanline()**:
        **->** используй код из моего предыдущего сообщения!
      **_render(sprites)**:
        **->** определяет координату y:
          ```javascript this.ppu.scanline;```
          (назовём её `y`)
        **->** для каждого `sprite` в `sprites`:
          **->** вычисляет «внутреннюю» координату Y:
            ```javascript sprite.diffY(y)```
            (назовём её `insideY`)
          **->** создаёт экземпляр 🕊️  `Tile`, передавая ppu, идентификатор таблицы паттернов, идентификатор тайла и `insideY % 8`
            (назовём его `tile`)
          **->** создаёт массив из 4 цветов палитры ```javascript sprite.paletteId```
            (назовём его `paletteColors`)
          **->** ```javascript for (let insideX = 0; insideX < 8; insideX++)```:
            **->** получает индекс цвета пикселя через ```javascript tile.getColorIndex(insideX)```
              (назовём его `colorIndex`)
            **->** если ```javascript colorIndex > 0``` (то есть пиксель непрозрачен):
              **->** вызывает ```javascript this.ppu.plot(...)``` для отрисовки пикселя
  responses:
  - (*) какую таблицу паттернов использовать? [patterntable]
  - (*) какой идентификатор тайла использовать? [tileid]
  - (*) почему ~insideY % 8~? [whymod8]
  - (*) как получить цвета палитры? [palette]
  - (*) какие ~X~ и ~Y~ использовать при отрисовке пикселей? [coordinates]
  - (*) какой цвет использовать при отрисовке пикселей? [color]

