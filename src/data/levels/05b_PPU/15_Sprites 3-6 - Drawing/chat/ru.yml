whymod8:
  messages:
  - чтобы правильно поддерживать спрайты ~8x16~!
  - когда режим ~8x16~ включён через 🎛️  PPUCtrl, каждый спрайт использует два тайла, расположенных один над другим
  - например, ~y=10~ в спрайте ~8x16~ означает ~y=2~ его второго тайла
  responses:
  - ...exercise

palette:
  messages:
  - |-
    например, <цвет 2> можно получить через:
    ```javascript this.ppu.getColor(sprite.paletteId, 2)```
  responses:
  - ...exercise

coordinates:
  messages:
  - позиция ~x~ должна быть ```javascript sprite.x + insideX```
  - позиция ~y~ — текущая строка развёртки
  responses:
  - ...exercise

color:
  messages:
  - обращение к `paletteColors` по `colorIndex` даст нужный ~цвет~
  responses:
  - ...exercise
