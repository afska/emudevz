main:
  messages:
  - при отборе спрайтов мы увидели, что спрайты с меньшими индексами OAM рисуются <впереди>
  - ещё есть бит приоритета <спрайта относительно фона> (байт 2, бит 5), который помещает спрайты <за> фоном
  - фон перекрывает спрайт только непрозрачными пикселями
  responses:
  - покажи пример [example]

example:
  run: |
    {{Top}}.loadROM("/roms/.all/SuperTiltBro.neees");
    layout.focus("Top");
  messages:
  - посмотри на <облако> в середине
  - облако — это спрайт, а название игры — часть фона
  - в какой-то момент оно перекрывает слова «TILT» и «BRO», хотя должно быть за ними
  - это потому, что мы неправильно учитываем приоритеты спрайтов
  - и BrokenNEEES тоже ошибается, так что неважно, какой PPU ты используешь!
  responses:
  - как это исправить? [fix]

fix:
  messages:
  - сначала нужно запоминать, какие пиксели фона прозрачны
  - то есть имеют индекс цвета 0
  - затем сохраним цвета и спрайты текущей строки во временный буфер
  - и будем рисовать пиксели из этого буфера, только если приоритет спрайта — <перед фоном> или пиксель фона прозрачен
  responses:
  - звучит вполне понятно [exercise]
  - (*) звучит сложно, зачем? 🤔 [why]

why:
  messages:
  - |-
    можно подумать, что слои NEEES устроены так:
      - 🛸  спрайты с приоритетом <перед фоном> сверху
      - 🏞️  фон посередине
      - 🛸  спрайты с приоритетом <за фоном> снизу
  - но это <неверно>
  - помнишь, спрайты с меньшими идентификаторами рисуются впереди?
  - так вот, если в данном пикселе приоритет <самого переднего> непрозрачного спрайта — <за фоном>, непрозрачный пиксель фона рисуется поверх него
  - "и главное: следующий по приоритету спрайт в этом пикселе использовать нельзя"
  - значит, самый передний спрайт может скрывать другие спрайты, даже находясь за фоном
  - поэтому сначала сохраняем пиксель победившего спрайта в буфер, а затем совмещаем его с фоном
  responses:
  - ...fix

exercise:
  messages:
  - |-
    📚  хорошо, добавь в конструктор класса 🖥️  `PPU`:
      ```javascript
      this.colorIndexes = new Uint8Array(256*240);```
  - |-
    📚  реализуй эти методы:
    **plotBG(x, y, color, colorIndex)**:
      **->** сохраняет `colorIndex`:
        ```javascript this.colorIndexes[y * 256 + x] = colorIndex;```
      **->** рисует пиксель:
        ```javascript this.plot(x, y, color);```
    **isBackgroundPixelOpaque(x, y)**:
      **->** возвращает, больше ли 0 значение пикселя ~(x, y)~ в `colorIndexes`
  - 📚  в 🏞️  `BackgroundRenderer` вместо метода `plot(...)` вызывай `plotBG(...)`, передавая `colorIndex` последним аргументом
  - |-
    📚  в 🛸  `SpriteRenderer` <измени> эти методы:
      **_render(...)**:
        **->** в начале объявляет пустой массив `buffer`
        **->** вместо вызова ```javascript this.ppu.plot(...)``` сохраняет данные в `buffer`:
          ```javascript const x = sprite.x + insideX;```
          ```javascript const color = paletteColors[colorIndex];```
          ```javascript buffer[x] = { x, sprite, color };```
        **->** в конце выполняет ```javascript return buffer;```
      **renderScanline()**:
        **->** присваивает результат ```javascript this._render(sprites)``` константе `buffer`
        **->** вызывает ```javascript this._draw(buffer);```
  - |-
    📚  и определи:
      **_draw(buffer)**:
        **->** определяет координату y:
          ```javascript this.ppu.scanline;```
          (назовём её `y`)
        **->** для каждого `element` в массиве `buffer`:
          **->** если `element` не равен ```javascript undefined```:
            **->** определяет, находится ли спрайт перед фоном:
              ```javascript element.sprite.isInFrontOfBackground;```
              (назовём это `isInFront`)
            **->** определяет, непрозрачен ли соответствующий пиксель фона:
              ```javascript this.ppu.isBackgroundPixelOpaque(element.x, y);```
              (назовём это `isBGOpaque`)
            **->** если ```javascript isInFront || !isBGOpaque```:
              **->** вызывает ```javascript this.ppu.plot(element.x, y, element.color);```
  responses: []

corollary:
  messages:
  - запусти 🦸 🤸  ~Super Tilt Bro~ и увидишь, что теперь облака рисуются правильно 🙂
  responses:
  - ▶️  продолжить [end]
