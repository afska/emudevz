  - ...main

backdrop:
  messages:
  - tu peux y penser comme une couleur d'arrière-plan universelle
  - elle est définie dans ~palette 0, index 0~ (alias $PPU $3F00)
  - tout pixel d'arrière-plan avec l'index de couleur 0 affiche cette couleur
  responses:
  - ...main
