exercise:
  messages:
  - simple, quand une <lecture> est demandée, tu lis dans un tampon, mais tu retournes la <valeur précédente> de ce tampon
  - check out this other example, 📄  ~/docs/ppu/ppudata_example.md~
  - |-
    📚  implémente ces méthodes dans 📦  `PPUData` :
    **onLoad()**:
      **->** initialise ```javascript this.buffer = 0```
    **onRead()**:
      **->** sauvegarde ```javascript this.buffer``` dans une variable nommée `data`
      **->** lit depuis l'adresse PPU ```javascript ppuAddr.address``` et sauvegarde le résultat dans ```javascript this.buffer```
      **->** si l'adresse est entre $3F00 et $3FFF, met ```javascript data = this.buffer``` (saute le tampon)
      **->** appelle ```javascript this._incrementAddress()```
      **->** retourne `data`
  responses:
  - (*) comment je peux accéder à 📍  PPUAddr ? [ppuaddr]

ppuaddr:
  messages:
  - souviens-toi que les registres ont ```javascript this.ppu```
  - donc tu peux accéder à l'instance 📍  PPUAddr avec ```javascript this.ppu.registers.ppuAddr```
