main:
  messages:
  - доступ к RAM палитр в NEEES устроен немного странно
  - некоторые адреса зеркалируют другие 🚽
  - давай быстро это исправим
  - |-
    📚  в 🐏  `PPUMemory` найди раздел 🎨  RAM палитр в `read(...)` и замени его этим кодом:
      ```javascript
      if (address >= 0x3f00 && address <= 0x3f1f) {
        if (address === 0x3f10) return this.read(0x3f00);
        if (address === 0x3f14) return this.read(0x3f04);
        if (address === 0x3f18) return this.read(0x3f08);
        if (address === 0x3f1c) return this.read(0x3f0c);
        return this.paletteRam[address - 0x3f00];
      }```
  - |-
    📚  сделай то же с `write(...)`, но используй этот код:
      ```javascript
      if (address >= 0x3f00 && address <= 0x3f1f) {
        if (address === 0x3f10) return this.write(0x3f00, value);
        if (address === 0x3f14) return this.write(0x3f04, value);
        if (address === 0x3f18) return this.write(0x3f08, value);
        if (address === 0x3f1c) return this.write(0x3f0c, value);
        this.paletteRam[address - 0x3f00] = value;
        return;
      }```
  responses: []

corollary:
  messages:
  - некоторые игры действительно от этого зависят!
  - например, та <игра про водопроводчика> известна тем, что небо в ней становится <чёрным> вместо <синего>, если зеркала RAM палитр не реализованы
  - теперь оно должно быть синим 😅
  responses:
  - ▶️  продолжить [end]
