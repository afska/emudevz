main:
  messages:
  - l'accès à la Palette RAM est un peu bizarre sur le NEEES
  - certaines adresses sont des miroirs d'autres adresses 🚽
  - corrigeons ça rapidement
  - |-
    📚  dans 🐏  `PPUMemory`, cherche la section 🎨  Palette RAM dans `read(...)` et remplace-la par ce code :
      ```javascript
      if (address >= 0x3f00 && address <= 0x3f1f) {
        if (address === 0x3f10) return this.read(0x3f00);
        if (address === 0x3f14) return this.read(0x3f04);
        if (address === 0x3f18) return this.read(0x3f08);
        if (address === 0x3f1c) return this.read(0x3f0c);
        return this.paletteRam[address - 0x3f00];
      }```
  - |-
    📚  fais pareil avec `write(...)`, mais utilise ceci à la place :
      ```javascript
      if (address >= 0x3f00 && address <= 0x3f1f) {
        if (address === 0x3f10) return this.write(0x3f00, value);
        if (address === 0x3f14) return this.write(0x3f04, value);
        if (address === 0x3f18) return this.write(0x3f08, value);
        if (address === 0x3f1c) return this.write(0x3f0c, value);
        this.paletteRam[address - 0x3f00] = value;
        return;
      }```
  responses: []

corollary:
  messages:
  - certains jeux en dépendent vraiment !
  - par exemple, ce <jeu de plombier> est célèbre pour afficher le ciel en <noir> au lieu de <bleu> si les miroirs de la Palette RAM ne sont pas implémentés
  - maintenant ça devrait être bleu 😅
  responses:
  - ▶️  continuer [end]
