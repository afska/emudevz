---
main:
  messages:
  - 🧠  CPU и 🖥️  PPU общаются через набор из 9 регистров, отображённых в память
  - они находятся по адресам CPU $2000-$2007 и $4014
  - загляни в 📄  ~/docs/ppu/video_registers.ru.md~
  - некоторые из них 🔍  <только для чтения> (🧠  CPU читает, 🖥️  PPU записывает)
  - некоторые ✏️  <только для записи> (🖥️  PPU читает, 🧠  CPU записывает)
  - а несколько — <двунаправленные>  🔍 ✏️
  responses:
  - приведи пример 🙏 [example]

example:
  messages:
  - помнишь, есть две 🕊️ 📖  таблицы паттернов?
  - так вот, коду игры нужно указать 🖥️  PPU, какую из них использовать
  - для фона за это отвечает бит 4 регистра $2000 (🎛️  PPUCtrl)
  - в столбце ~Биты~ он обозначен как ~B~
  - например, чтобы использовать вторую таблицу, игра запишет 16 (в двоичном виде ```raw 000```~1~```raw 0000```) по адресу $2000
  - или любое число с установленным битом 4!
  - запись в $2000 меняет сразу 6 параметров (~V~, ~H~, ~B~, ~S~, ~I~ и ~NN~)
  - <{PPUCtrl.png}>
  responses:
  - значит, эти регистры просто хранят числа? 🔢 [numbers]

numbers:
  messages: 
  - да, но некоторые вызывают <особые эффекты>, когда 🧠  CPU читает их или записывает в них
  - эти побочные эффекты могут сбрасывать внутренний буфер, увеличивать счётчики и даже копировать данные!
  - есть готовый класс, который поможет это реализовать, воспользуйся им 📖
  responses:
  - как им пользоваться? [exercise]

exercise:
  messages:
  - прочитай документацию в 📄  ~/docs/lib/InMemoryRegister.ru.md~
  - и возьми 📄  ~/tmpl/ppu/VideoRegisters.js~ за шаблон файла видеорегистров
  - регистры 🎛️  `PPUCtrl` и 📊  `PPUStatus` уже реализованы
  - обрати внимание, как они вызывают `addField(...)` для каждого бита из столбца ~Биты~
  - "это создаёт <автоматические свойства>: после записи PPU может читать их значения (например, ```javascript ppuCtrl.spriteSize```)"
  - 📚  создай класс `VideoRegisters` на основе этого шаблона
  - |-
    📚  добавь в 🖥️  `PPU` свойство `registers` со значением:
      ```javascript new VideoRegisters(this)```
  - |-
    📚  наконец, отобрази их в 🐏  `CPUMemory` (диапазоны $2000-$2007 и $4014):
      - при <чтении> возвращай ```javascript this.ppu.registers.read(address)```
      - при <записи> вызывай ```javascript this.ppu.registers.write(address, value)``` и завершай метод
  responses: []
