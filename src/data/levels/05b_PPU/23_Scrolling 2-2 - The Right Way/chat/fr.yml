exercise:
  messages:
  - |-
    📚  importe la bibliothèque et ajoute une propriété `loopy` au constructeur de 🖥️  `PPU`, assignée à :
      ```javascript new LoopyRegister()```
  - |-
    📚  à la fin de la méthode `_onPreLine()`, appelle :
      ```javascript this.loopy.onPreLine(this.cycle);```
  - |-
    📚  à la fin de la méthode `_onVisibleLine()`, appelle :
      ```javascript this.loopy.onVisibleLine(this.cycle);```
  - |-
    📚  à la fin de la méthode `plotBG(...)`, appelle :
      ```javascript if (this.registers.ppuMask.showBackground)
        this.loopy.onPlot(x);```
  - |-
    📚  dans 🎛️  `PPUCtrl`, supprime le champ `nameTableId`, et ajoute ça à la fin de `onWrite(...)` :
      ```javascript this.ppu.loopy.onPPUCtrlWrite(value);```
  - |-
    📚  dans 📊  `PPUStatus`, remplace le code qui désactive le `latch` de `PPUAddr` par :
      ```javascript this.ppu.loopy.onPPUStatusRead();```
  - |-
    📚  dans 📜  `PPUScroll`, supprime la méthode `onLoad()` et remplace `onWrite(...)` par :
      ```javascript onWrite(value) {
        this.ppu.loopy.onPPUScrollWrite(value);
      }```
  - |-
    📚  dans 📍  `PPUAddr`, supprime la méthode `onLoad()` et remplace `onWrite(...)` par :
      ```javascript onWrite(value) {
        this.ppu.loopy.onPPUAddrWrite(value);
      }```
    ajoute aussi cette propriété dynamique :
      ```javascript get address() {
        return this.ppu.loopy.vAddress.getValue()
      }

      set address(value) {
        this.ppu.loopy.vAddress.setValue(value);
      }```
  - |-
    📚  enfin, dans 🏞️  `BackgroundRenderer`, remplace les constantes `scrolledX`, `scrolledY` et `nameTableId` par :
      ```javascript const scrolledX = this.ppu.loopy.scrolledX(x);
      const scrolledY = this.ppu.loopy.scrolledY();
      const nameTableId = this.ppu.loopy.nameTableId(scrolledX);```
  responses: []

