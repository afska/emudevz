main:
  messages:
  - les jeux définissent aussi, au runtime, à quoi ressemblent les sprites 🛸
  - ils le font en écrivant une table appelée OAM ("Object Attribute Memory")
  - cette table se trouve dans une région mémoire <interne> appelée 🐏  OAM RAM
  responses:
  - comment un jeu peut écrire dans 🐏  OAM RAM ? [how]

how:
  messages:
  - "il y a deux façons :"
  - "1) en utilisant les registres 🏠  OAMAddr et 📝  OAMData"
  - "2) en utilisant ⚡  OAMDMA"
  responses:
  - (*) parle-moi de 🏠  OAMAddr et 📝  OAMData [addrdata]
  - (*) parle-moi de ⚡  OAMDMA [dma]
  - on implémente ce pont [exercise]

addrdata:
  messages:
  - y a pas grand chose à dire sur eux
  - c'est pareil que 📍  PPUAddr et 📦  PPUData
  - mais ils accèdent à 🐏  OAM RAM au lieu de la mémoire PPU
  responses:
  - ...how

dma:
  messages:
  - DMA ("Direct Memory Access") est un mécanisme matériel pour copier des octets d'une région mémoire à une autre très rapidement
  - dans la NEEES, c'est fourni par le registre ⚡  OAMDMA, qui permet aux jeux de remplir 🐏  OAM RAM en copiant des octets de la mémoire CPU
  - écrire ```raw $```~XX~ dans ce registre copie 256 octets depuis les adresses CPU ```raw $```~XX~```raw 00```-```raw $```~XX~```raw FF``` vers l'OAM RAM interne
  - cette opération prend environ 513 cycles CPU, pendant lesquels le CPU est suspendu
  responses:
  - ...how

exercise:
  messages:
  - 📚  comme tu l'as fait avec `PPUMemory::vram`, ajoute une propriété `oamRam` dans 🐏  `PPUMemory`
  - le tableau doit stocker 256 octets
  - cette fois, tu n'as pas à le mapper, OAM est vraiment <interne>
  - |-
    📚  implémente ces méthodes dans 📝  `OAMData` :
    **onRead()**:
      **->** sauvegarde l'adresse OAM actuelle :
        ```javascript const oamAddress = this.ppu.registers.oamAddr.value;```
        (le champ `value` est défini dans `InMemoryRegister` et représente la valeur actuelle)
      **->** retourne l'octet correspondant de OAM RAM, en utilisant `oamAddress`
    **onWrite(value)**:
      **->** sauvegarde l'adresse OAM actuelle (`oamAddress`)
      **->** écrit `value` dans l'octet correspondant de OAM RAM, en utilisant `oamAddress`
      **->** incrémente l'adresse OAM :
        ```javascript this.ppu.registers.oamAddr.setValue(oamAddress + 1);```
  - |-
    📚  implémente cette méthode dans ⚡  `OAMDMA` :
    **onWrite(value)**:
      **->** ```javascript for (i = 0; i < 256; i++)```:
        **->** construit l'adresse (octet de poids fort : `value`, octet de poids faible : `i`)
        **->** lit l'adresse depuis la mémoire CPU (```javascript this.ppu.cpu``` récupère le 🧠  `CPU`)
        **->** assigne l'octet obtenu à ```javascript oamRam[i]```
      **->** ajoute 513 à ```javascript this.ppu.cpu.extraCycles```
  responses: []

corollary:
  messages:
  - en lançant un jeu, tu pourras maintenant visualiser l'OAM et ses sprites dans la 🐞  <fenêtre du débogueur>
  responses:
  - ▶️  continuer [end]
