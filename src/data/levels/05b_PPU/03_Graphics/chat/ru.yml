---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
    const saveState = JSON.parse(level.code["spacegulls_demo.ss"]);
    {{Background}}.loadROM("/roms/.all/Spacegulls.neees", "demoRom", saveState);
  messages:
  - небольшое введение в графику NEEES! 🖌️
  - вся графика состоит из 🕊️  тайлов
  - тайл — это сетка пикселей ~8x8~
  - <{tile_grayscale.png;8x8}>
  - а ~8x8~ — это очень мало! поэтому один тайл обычно представляет собой часть большой картинки
  - все они хранятся в 🕊️ 📖  таблицах паттернов внутри 👾  CHR-ROM (или CHR-RAM) картриджа
  - <{tiles_grayscale.png;30x30}>
  responses:
  - а что с цветами? 🌈 [colors]

colors:
  run: |
    {{Right}}.do((debuggerGUI) => {
      debuggerGUI.ppu.selectedTab = "Palettes";
    });
  messages:
  - тайлы могут использовать 4 цвета (~2~ бита на пиксель), но не знают, какие это будут <конкретные цвета>
  - им известно лишь, что определённый пиксель — это «цвет 0», «цвет 1», «цвет 2» или «цвет 3»
  - цвет добавляется <во время выполнения> с помощью 🎨  палитр, которые определяют, каким должен быть каждый цвет
  - "после применения палитры тайлы могут выглядеть так:"
  - <{tile.png;8x8}>
  - <{tiles.png;30x30}>
  responses:
  - значит, с помощью палитры можно задать любой цвет? 🤔 [anycolor]

anycolor:
  messages:
  - ну... нет 😅
  - NEEES умеет показывать только 64 строго определённых цвета
  - <{colors.png}>
  - каждая палитра ссылается на элементы этого набора, который называется основной палитрой
  responses:
  - расскажи ещё про тайлы 👀 [moreabouttiles]

moreabouttiles:
  run: |
    {{Right}}.do((debuggerGUI) => {
      debuggerGUI.ppu.selectedTab = "Sprites";
    });
  messages:
  - кадр состоит из одного 🏞️  фона и нескольких 🛸  спрайтов
  - <{full.png;30x30}>
  - 🏞️  фон статичен, но игры могут двигать его с помощью прокрутки
  - <{background.png;30x30}>
  - 🛸  спрайты — это объекты поверх фона, которые можно легко перемещать или отражать
  - <{sprites.png;30x30}>
  - и то и другое рисуется из тайлов
  responses:
  - ага, понятно [enough]

enough:
  run: |
    {{Right}}.do((debuggerGUI) => {
      debuggerGUI.args.readOnly = false;
    });
  run-after-messages: |
    store.dispatch.savedata.openFile("/docs/ppu/definitions.ru.md");
  messages:
  - <! Управление включено.
  - теперь в отладчике <включено управление>, можешь немного поэкспериментировать
  - позже разберём структуры памяти для тайлов, фона и спрайтов
  - а пока уже понятно, как устроена графика на экране ✨
  - "вот основные моменты..."
  - 🏞️  есть фоновое изображение
  - 🛸  есть несколько спрайтов
  - 🕊️  и то и другое рисуется из тайлов
  - 👾  все тайлы лежат в CHR-ROM или CHR-RAM, без цвета
  - 🎨  цвет задаётся через палитры
  - 👑 🎨  палитры ссылаются на элементы фиксированной основной палитры из 64 цветов
  - "запишу всё это подробнее сюда: 📄  ~/docs/ppu/definitions.ru.md~"
  responses:
  - отлично [end]
