main:
  messages:
  - теперь наш эмулятор умеет обращаться к 🛸 📖  OAM
  - и можно приступать к чтению 🛸  спрайтов!
  responses:
  - что находится в OAM? [oam]

oam:
  messages:
  - "вот документ, который объясняет формат таблицы OAM:"
  - 📄  ~/docs/ppu/sprite_rendering.ru.md~
  - "ещё пригодится мой класс `Sprite`:"
  - 📄  ~/lib/ppu/Sprite.js~
  - он берёт на себя некоторые задачи, например разбор атрибутов
  responses:
  - спасибо, но читать OAM всё равно нужно самостоятельно, да? [exercise]

exercise:
  messages:
  - верно ✅
  - 📚  создай класс 🛸  `SpriteRenderer`
  - 📚  его конструктор должен принимать экземпляр PPU и сохранять его в свойство `ppu`
  - |-
    📚  внеси это изменение в класс 🖥️  `PPU`:
    **constructor(cpu)**:
      **->** создаёт экземпляр отрисовщика спрайтов:
        ```javascript this.spriteRenderer = new SpriteRenderer(this)```
        (не забудь импортировать его, если класс находится в другом файле!)
  - |-
    📚  теперь в классе 🛸  `SpriteRenderer` определи:
    **_createSprite(id)**:
      **->** возвращает новый экземпляр `Sprite`, читая запись OAM с индексом `id`
        (не забудь прибавить 1 к координате Y!)
  responses:
  - (*) почему нужно прибавить 1 к координате Y? ➕ [addone]
  - (*) как узнать, спрайт ~8x8~ или ~8x16~? 📏 [spritesize]
  - (*) как узнать идентификатор тайла / таблицы паттернов? 🕊️ 📖 [patterntable]

addone:
  messages:
  - потому что данные спрайтов задерживаются на одну строку развёртки 💤
  - на настоящем железе спрайты рисуются на строку ниже координаты Y, которую игра задаёт в OAM
  - то есть, если байт 0 записи OAM равен 0, спрайт рисуется на строке 1
  - и нарисовать спрайт, начинающийся со строки 0, невозможно
  responses:
  - ...exercise

spritesize:
  messages:
  - это глобальная настройка в 🎛️  PPUCtrl
  - при ```javascript ppu.registers.ppuCtrl.spriteSize === 1``` спрайты должны использовать режим ~8x16~
  responses:
  - ...exercise

patterntable:
  messages:
  - в режиме ~8x8~ идентификатор тайла — `byte1` записи OAM, а идентификатор таблицы паттернов — ```javascript ppu.registers.ppuCtrl.sprite8x8PatternTableId```
  - в режиме ~8x16~ идентификатор тайла — ```javascript (byte1 & 0b11111110)```, а идентификатор таблицы паттернов — ```javascript (byte1 & 0b00000001)```
  responses:
  - ...exercise
