main:
  messages:
  - у железа есть механизм обнаружения столкновений первого спрайта в OAM (нулевого спрайта) с фоном
  - он называется попаданием нулевого спрайта и срабатывает, когда непрозрачный пиксель нулевого спрайта перекрывает непрозрачный пиксель фона
  - тогда PPU устанавливает флаг попадания нулевого спрайта в 📊  `PPUStatus`, и игра может его прочитать
  responses:
  - для чего это используется? [usage]

usage:
  run: |
    {{Top}}.load("sprite_zero_splitscreen.png");
  messages:
  - игры используют его для <эффектов разделения экрана> (например, неподвижной панели сверху и прокручиваемого фона снизу)
  - была одна игра про водопроводчика с таким приёмом 👨 🔧
  - <{sprite_zero_splitscreen.png}>
  - если поместить спрайт монетки (нулевой спрайт) поверх монетки на фоне, PPU зафиксирует попадание нулевого спрайта при отрисовке этой части экрана
  - так игра узнаёт, что PPU дошёл до нужной строки, и меняет координаты прокрутки посреди кадра
  responses:
  - вот это трюк [exercise]

exercise:
  run: |
    {{Top}}.load(null, "rom");
  messages:
  - |-
    📚  в 🛸  `SpriteRenderer` <измени> метод `_render(...)`; после `buffer[x] = ...` добавь:
    **->** если `sprite.id` равно 0 <И> пиксель фона в ~(x, y)~ непрозрачен:
      **->** задаёт ```javascript this.ppu.registers.ppuStatus.sprite0Hit = 1```
  - 📚  а ещё сбрасывай `sprite0Hit` в `PPU::_onPreLine()`, как и два других флага!
  responses: []

corollary:
  messages:
  - игры, использующие этот приём для <эффектов разделения экрана>, часто зависают, если попадание нулевого спрайта реализовано неправильно
  - попробуй запустить 👨‍ 🔧  ту <игру про водопроводчика> или 🐺 ⛓️  ~Wolfling~, теперь они не должны зависать!
  responses:
  - ▶️  продолжить [end]
