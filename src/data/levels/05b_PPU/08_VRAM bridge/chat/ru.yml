---
main:
  messages:
  - игры задают внешний вид фона во время выполнения 🏞️
  - они составляют карту из тайлов и хранят её в 🐏  VRAM
  responses:
  - как игра может записывать в 🐏  VRAM? [how]

how:
  messages:
  - через видеорегистры 📍  PPUAddr и 📦  PPUData
  - они работают как мост между 🧠  CPU и 🖥️  PPU
  - сначала игра записывает в 📍  PPUAddr адрес PPU, по которому хочет записать данные
  - "(две последовательные записи: одна для старшего байта, другая для младшего)"
  - затем записывает в 📦  PPUData байт, который нужно поместить по этому адресу
  - <{PPUAddr_PPUData.png}>
  - это даёт коду игры доступ к любой области памяти PPU, включая 👾  CHR-RAM, 🐏  VRAM и 🎨  RAM палитр
  responses:
  - (*) приведи ещё пример 🤔 [example]
  - здорово, наверное, нужно где-то создать VRAM [exercise]

example:
  messages:
  - приведу тот же пример, но на ассемблере
  - допустим, игра для NEEES хочет записать байт $D7 по адресу PPU $208F
  - машинный код может записывать только по адресам CPU, верно?
  - адреса PPU находятся в отдельном адресном пространстве
  - поэтому 📍  PPUAddr и 📦  PPUData используются <как мост> между 🧠  CPU и 🖥️  PPU
  - |-
    в нашем примере это выглядит так:
    ```raw
    LDA #$20
    STA $2006
    LDA #$8F
    STA $2006

    LDA #$D7
    STA $2007```
  responses:
  - ...how

exercise:
  messages:
  - ага, лучше начать с этого
  - 📚  по примеру `CPUMemory::ram` добавь в 🐏  `PPUMemory` свойство `vram`
  - массив должен вмещать 4096 байт
  - (знаю, уже несколько раз говорилось, что VRAM всего 2 КиБ, но некоторые игры расширяют её дополнительными чипами в картридже, и для эмуляции проще сразу выделить большой блок на 4 КиБ 🤷 )
  - 📚  отобрази диапазон $2000-$2FFF в VRAM (для чтения и записи)
  - |-
    📚  реализуй эти методы в 📍  `PPUAddr`:
    **onLoad()**:
      **->** инициализирует два свойства:
        ```javascript this.latch = false```
        ```javascript this.address = 0```
        (они помогут чередовать запись старшего и младшего байта при каждой операции записи)
    **onWrite(value)**:
      **->** если `latch` равно ```javascript false```:
        **->** записывает `value` только в старший байт `address`
          (младшая часть остаётся прежней)
      **->** если равно ```javascript true```:
        **->** записывает `value` только в младший байт `address`
          (старшая часть остаётся прежней)
      (можно использовать `buildU16(...)`, `highByteOf(...)` и `lowByteOf(...)`)
      **->** переключает `latch` на противоположное значение
  - |-
    📚  реализуй эти методы в 📦  `PPUData`:
    **onWrite(value)**:
      **->** записывает `value` по адресу PPU ```javascript ppuAddr.address```
        (экземпляр 🐏  `PPUMemory` доступен через ```javascript this.ppu.memory```)
        (экземпляр 📍  `PPUAddr` доступен через ```javascript this.ppu.registers.ppuAddr```)
      **->** вызывает ```javascript this._incrementAddress()```
    **_incrementAddress()**:
      **->** если ```javascript ppuCtrl.vramAddressIncrement32``` равно ~1~:
        **->** увеличивает ```javascript ppuAddr.address``` на 32
      **->** иначе:
        **->** увеличивает ```javascript ppuAddr.address``` на 1
     **[!]** следи, чтобы адрес не превышал 65535, используя `byte.toU16(...)`
  - |-
    📚  наконец, <измени> в 📊  `PPUStatus`:
    **onRead()**:
      **->** после сброса `isInVBlankInterval` также сбрасывает `latch` в 📍  `PPUAddr`
  responses:
  - (*) что это за увеличение адреса? 🤔 [increment]

increment:
  messages:
  - ага, об этом ещё не было речи
  - после записи в 📦  PPUData PPU автоматически увеличивает адрес
  - в зависимости от 🎛️  PPUCtrl это может быть ~+1~ или ~+32~
  - автоматическое увеличение помогает играм быстрее заполнять VRAM
  responses:
  - ...exercise

