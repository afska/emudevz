help:
  messages:
  - известно, что ```javascript y = this.ppu.scanline```
  - и что рисовать нужно от ~x = 0~ до ~x = 255~
  - ещё известно, что экран — это сетка из ~32x30~ тайлов (по ~8x8~ пикселей каждый)
  - и наконец, рисование тайлов через класс 🕊️  `Tile` уже освоено!
  - |-
    один из вариантов реализации выглядит примерно так:
      ```javascript
      const FIXED_PALETTE = [0xff000000, 0xff555555, 0xffaaaaaa, 0xffffffff];

      const y = this.ppu.scanline;
      for (let x = 0; x < 256; x += 8) {
        const nameTableId = 0; // TODO: Get name table id
        const patternTableId = 0; // TODO: Get pattern table id

