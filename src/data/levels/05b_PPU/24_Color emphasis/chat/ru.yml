main:
  messages:
  - PPU умеет в некоторой степени «преобразовывать» выходные цвета
  - в 🎭  PPUMask есть биты для включения <режима оттенков серого> и <усиления цветов>
  - то есть усиления красной, зелёной или синей составляющей каждого цвета
  responses:
  - как это работает? [how]

how:
  messages:
  - бит 0 переводит изображение в <оттенки серого>
  - бит 5 усиливает <красный> (затемняя зелёный и синий на 25%)
  - бит 6 усиливает <зелёный> (затемняя красный и синий на 25%)
  - бит 7 усиливает <синий> (затемняя красный и зелёный на 25%)
  - если включить все три бита усиления одновременно, все цвета станут на ~25%~ темнее
  - <усиление цветов> не зависит от <режима оттенков серого>, так что биты усиления всё равно придают оттенок серому изображению
  responses:
  - значит... [exercise]

exercise:
  messages:
  - открой 📄  ~/docs/ppu/video_registers.ru.md~
  - 📚  в 🎭  `PPUMask` измени метод `onLoad()` и через `addField(...)` отобрази биты `grayscale`, `emphasizeRed`, `emphasizeGreen` и `emphasizeBlue`
  - |-
    📚  добавь этот метод:
    **transform(color)**:
      **->** разделяет цвет на составляющие `r`, `g` и `b`:
        ```javascript let r = (color >> 0) & 0xff;```
        ```javascript let g = (color >> 8) & 0xff;```
        ```javascript let b = (color >> 16) & 0xff;```

      **->** если ```javascript this.grayscale```:
        **->** `r = g = b = Math.floor((r + g + b) / 3)`

      **->** если установлен ХОТЯ БЫ ОДИН бит усиления:
        **->** проверяет, установлены ли ВСЕ биты усиления
          (назовём это `all`)
        
        **->** для каждой составляющей `r`, `g` и `b`:
          **->** если её бит НЕ включён или включены `all`:
           **->** уменьшает яркость составляющей на ~25%~:
              например, для красного:
              ```javascript r = Math.floor(r * 0.75)```

      **->** возвращает обновлённый цвет:
        ```javascript 0xff000000 | (r << 0) | (g << 8) | (b << 16);```
  - 📚  и самое главное, теперь `PPU::plot(...)` должен вызывать метод transform у 🎭  `PPUMask` вместо прямого использования `color`
  responses: []

corollary:
  messages:
  - усиление цветов используется, например, в 🕊️ 🛰️  ~Spacegulls~ во время паузы
  - поставь игру на паузу кнопкой <Start>, и экран станет красноватым
  responses:
  - ▶️  продолжить [end]
