main:
  messages:
  - la PPU est capable de "transformer" les couleurs de sortie dans une certaine mesure
  - 🎭  PPUMask a des bits qui activent le <mode niveaux de gris> ou l'<accentuation des couleurs>
  - c'est-à-dire, accentuer les composantes rouge, verte, ou bleue de chaque couleur
  responses:
  - comment ça fonctionne ? [how]

how:
  messages:
  - le bit 0 convertit la sortie en <niveaux de gris>
  - le bit 5 accentue le <rouge> (assombrit le vert et le bleu de 25%)
  - le bit 6 accentue le <vert> (assombrit le rouge et le bleu de 25%)
  - le bit 7 accentue le <bleu> (assombrit le rouge et le vert de 25%)
  - si les trois bits d'accentuation sont activés en même temps, toutes les couleurs seront ~25%~ plus sombres
  - l'<accentuation des couleurs> est indépendante du <mode niveaux de gris>, donc les bits d'accentuation teintent quand même la couleur de l'image en gris
  responses:
  - donc... [exercise]

exercise:
  messages:
  - ouvre 📄  ~/docs/ppu/video_registers.fr.md~
  - 📚  dans 🎭  `PPUMask`, modifie la méthode `onLoad()` et utilise `addField(...)` pour mapper les bits `grayscale`, `emphasizeRed`, `emphasizeGreen`, et `emphasizeBlue`
  - |-
    📚  ajoute cette méthode :
    **transform(color)**:
      **->** divise la couleur en composantes `r`, `g`, et `b` :
        ```javascript let r = (color >> 0) & 0xff;```
        ```javascript let g = (color >> 8) & 0xff;```
        ```javascript let b = (color >> 16) & 0xff;```

      **->** si ```javascript this.grayscale``` :
        **->** `r = g = b = Math.floor((r + g + b) / 3)`

      **->** si N'IMPORTE QUEL bit d'accentuation est activé :
        **->** vérifie si TOUS les bits d'accentuation sont activés
          (appelons ça `all`)

        **->** pour chaque `r`, `g`, et `b` :
          **->** si le bit n'est PAS activé ou si `all` sont activés :
           **->** réduit la luminosité de la composante de ~25%~ :
              par exemple, le rouge serait :
              ```javascript r = Math.floor(r * 0.75)```

      **->** retourne la couleur mise à jour :
        ```javascript 0xff000000 | (r << 0) | (g << 8) | (b << 16);```
  - 📚  et surtout, `PPU::plot(...)` doit maintenant appeler la méthode transform de 🎭  `PPUMask` au lieu d'utiliser `color` directement
  responses: []

corollary:
  messages:
  - l'accentuation des couleurs est utilisée, par exemple, dans 🕊️ 🛰️  ~Spacegulls~ lors de la pause
  - essaie de mettre le jeu en pause avec <Start> et l'écran deviendra rougeâtre
  responses:
  - ▶️  continuer [end]
