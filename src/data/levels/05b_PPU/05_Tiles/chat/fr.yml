---
main:
  messages:
  - ok, on va dessiner des tiles
  - lis 📄  ~/docs/ppu/tile_rendering.fr.md~
  - ça devrait expliquer comment les tiles sont encodés en mémoire
  - on va créer une classe pour nous aider à récupérer les couleurs des tiles
  - comme la PPU rend par 🌠  scanlines, il recevra un paramètre (`y`) représentant l'index de la rangée à dessiner
  - |-
    📚  crée une classe 🕊️  `Tile` avec ce qui suit :
    **constructor(ppu, patternTableId, tileId, y)**:
      **->** calcule l'adresse de début de la pattern table :
        $0000 ou $1000 selon `patternTableId` (~0~ ou ~1~)
        (appelons ça `tableAddress`)
      **->** calcule l'adresse de début du 💜  plan bas du tile :
        ```javascript tableAddress + tileId * 16```
        (appelons ça `lowPlaneAddress`)
      **->** calcule l'adresse de début du 💚  plan haut du tile :
        ```javascript lowPlaneAddress + 8```
        (appelons ça `highPlaneAddress`)
      **->** lit la bonne rangée de chaque <bitplane> :
        ```javascript this._lowRow``` = lit l'adresse PPU ```javascript lowPlaneAddress + y``` depuis ```javascript ppu.memory```
        ```javascript this._highRow``` = lit l'adresse PPU ```javascript highPlaneAddress + y``` depuis ```javascript ppu.memory```
    **getColorIndex(x)**:
      **->** détermine la position du bit qui correspond à `x` (un nombre entre 0 et 7)
        (garde en tête que ~x=0~ est le pixel le plus à gauche, et ça correspond au ~bit 7~)
      **->** récupère ce bit depuis ```javascript this._lowRow``` et ```javascript this._highRow``` en utilisant `byte.getBit(...)`
      **->** retourne l'index de couleur résultant, en combinant les deux bits avec `byte.buildU2(...)`
  responses:
  - comment on va tester ça ? 🧐 [test]

test:
  messages:
  - bonne question ! 😁
  - |+
    📚  dans ton 🖥️  `PPU`, importe la classe 🕊️  `Tile` et remplace le code de test (avant l'appel à `onFrame`) par :

      ```javascript
      // <test>
      const testPalette = [0xff000000, 0xff555555, 0xffaaaaaa, 0xffffffff];
      const scale = 2;
      
      for (let tileId = 0; tileId < 240; tileId++) {
        const scaledSize = 8 * scale;
        const tilesPerRow = 256 / scaledSize;
        const startX = (tileId % tilesPerRow) * scaledSize;
        const startY = Math.floor(tileId / tilesPerRow) * scaledSize;
        
        for (let y = 0; y < 8; y++) {
          const tile = new Tile(this, 0, tileId, y);
          
          for (let x = 0; x < 8; x++) {
            const color = testPalette[tile.getColorIndex(x)];
            
            for (let scaledY = 0; scaledY < scale; scaledY++) {
              for (let scaledX = 0; scaledX < scale; scaledX++) {
                this.plot(
                  startX + x * scale + scaledX, 
                  startY + y * scale + scaledY, 
                  color
                );
              }
            }
          }
        }
      }
      // </test>```
  - ça dessinera les 240 premiers tiles de la 👾  CHR-ROM
  - avec une échelle de ~2x~ (tiles ~16x16~ au lieu de ~8x8~)
  - ⚠️  ça fonctionnera <uniquement> sur les jeux qui utilisent la 👾  CHR-ROM ⚠️
  responses:
  - que se passe-t-il avec les jeux qui utilisent la 👾  CHR-RAM ? [chrram]

chrram:
  messages:
  - ces jeux chargent les tiles dynamiquement via le code du jeu 🤖
  - et actuellement, le 🧠  CPU n'a <aucun moyen> d'écrire dans notre mémoire 🖥️  PPU
  - donc dans ces cas-là, tu ne verras qu'un écran vide
  responses: []
