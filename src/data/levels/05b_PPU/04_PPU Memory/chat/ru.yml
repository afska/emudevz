---
main:
  messages:
  - возможно, возникает вопрос, почему класс 🐏  `CPUMemory` называется именно так
  - а не просто `Memory` 🤷
  - всё потому, что есть 2 разные шины памяти 🚌
  responses:
  - как это? [howso]

howso:
  messages: 
  - у PPU есть отдельное адресное пространство размером 16 КиБ специально для чтения 🕊️  тайлов, 🏞️  фона и 🎨  палитр
  - загляни в 📄  ~/docs/ppu/ppu_memory.ru.md~
  - большую часть времени он использует адреса PPU
  - а адреса CPU нужны лишь как мост для связи с CPU
  - теперь будем говорить "адрес PPU $1F2A" или "адрес CPU $1F2A", чтобы различать эти два пространства
  responses:
  - как это эмулировать? 😮 [exercise]

exercise:
  messages:
  - 📚  создай класс 🐏  `PPUMemory`, взяв 📄  ~/tmpl/ppu/PPUMemory.js~ за шаблон
  - 📚  реализуй только первый диапазон ($0000-$1FFF) для операций `read(...)` и `write(...)`
  - при <чтении> возвращай ```javascript this.mapper.ppuRead(address)```
  - при <записи> вызывай ```javascript this.mapper.ppuWrite(address, value)``` и завершай метод
  - |-
    📚  затем добавь в конструктор своего PPU:
      ```javascript
      this.memory = new PPUMemory();```
  - не забудь импортировать файл!
  responses: []
