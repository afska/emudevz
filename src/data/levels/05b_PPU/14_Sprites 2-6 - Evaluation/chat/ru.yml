main:
  messages:
  - на каждой строке отрисовщик выполняет отбор спрайтов 🕵️
  - он подготавливает спрайты, которые нужно нарисовать
  responses:
  - м-м... а как он их определяет? [how]

how:
  messages:
  - просматривает всю таблицу OAM и проверяет, нужно ли рисовать каждый спрайт в текущей строке (по ~x~, ~y~ и ~высоте~)
  - выбирает первые 8 спрайтов
  - если после 8 (максимума спрайтов на строку) найдутся <ещё> видимые спрайты, устанавливается 🏁  флаг переполнения спрайтов (бит 5 регистра 📊  PPUStatus), сообщающий разработчикам игры об ошибке
  - спрайты с меньшими идентификаторами рисуются поверх спрайтов с большими, поэтому список выбранных спрайтов нужно развернуть!
  responses:
  - хорошо, кажется, понятно [exercise]
  - (*) всего 8 спрайтов на строку? [only8]

only8:
  messages:
  - ага
  - но игры используют хитрости, чтобы обойти этот предел
  - например, заставляют спрайты мерцать, создавая иллюзию, что их в одной строке больше
  responses:
  - ...how

exercise:
  messages:
  - |-
    📚  отлично, реализуй следующий метод в 🛸  `SpriteRenderer`:
    **_evaluate()**:
      **->** создаёт массив `sprites`
      **->** для каждого возможного идентификатора спрайта (~0-63~):
        **->** создаёт `sprite` через ```javascript this._createSprite(...)```
        **->** если `sprite` нужно рисовать в текущей строке:
          **->** если в `sprites` меньше 8 элементов:
            **->** добавляет `sprite` в массив `sprites`
          **->** иначе:
            **->** задаёт ```javascript this.ppu.registers.ppuStatus.spriteOverflow = 1```
            **->** завершает цикл
      **->** возвращает `sprites` в обратном порядке
  - 📚  ещё нужно сбрасывать `spriteOverflow` в 0 при ~scanline=-1; cycle=1~, как раньше для `isInVBlankInterval`
  - сделай это в `PPU::_onPreLine()`
  responses:
  - (*) как определить, нужно ли рисовать спрайт? [visible]

visible:
  messages:
  - для этой проверки в моей библиотеке Sprite есть метод
  - используй ```javascript sprite.shouldRenderInScanline(this.ppu.scanline)```
  responses:
  - ...exercise
