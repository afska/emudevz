---
main:
  messages:
  - нам нужен удобный доступ к коду программы 🤖
  - 📚  создай метод ```javascript prg()```, возвращающий `Uint8Array` с байтами PRG-ROM
  - "код находится сразу после 16-байтового заголовка, но помни: возможно, нужно пропустить ещё 512 байт, если так указано в заголовке"
  - <{prg.png}>
  responses:
  - (*) как вырезать нужные байты? ✂️ [cut]

cut:
  messages:
  - у всех массивов есть метод `slice(start, end)` 🍕
  - он извлекает подмассив с `start` по `end-1`
  - например, ```javascript ["a", "b", "c", "d"].slice(1, 3)``` возвращает ```javascript ["b", "c"]```
  - (элемент с индексом 3, ```javascript "d"```, не включается)
  responses:
  - не работает [morehelp]

morehelp:
  messages:
  - "помни: второй аргумент — индекс <конца>, а не длина"
  - |-
    если нужны 30 байт начиная с байта 5, нужно написать
      ```javascript array.slice(5, 5 + 30)```
  responses:
  - ...main
