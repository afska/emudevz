---
main:
  messages:
  - теперь графика 👾
  - 📚  создай метод ```javascript chr()```, возвращающий `Uint8Array` с её байтами
  - "графика находится сразу после программы, но помни: её может и не быть!"
  - <{chr.png}>
  - 📚  если в заголовке указано, что игра использует CHR-RAM вместо CHR-ROM, просто верни ```javascript new Uint8Array(8192)```
  responses:
  - (*) кажется, расхождение на 99? [offby99]

offby99:
  messages:
  - файлы не обязательно заканчиваются <разделом графики> (в конце могут быть <заполнитель> или <дополнительные данные>), так что не рассчитывай на это!
  - вырежи нужные байты, пропустив заголовок, 512 байт заполнителя (если он есть) и область PRG-ROM
  - и не используй ```javascript bytes.length``` или отрицательные границы среза
  - тесты добавляют 99 <байт заполнителя>, чтобы проверить правильность обработки, но не <зашивай> эти 99 в код, иначе ничего не заработает!
  responses:
  - ...main
