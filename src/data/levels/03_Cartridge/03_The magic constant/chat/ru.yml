---
main:
  messages:
    - мы сохраняем игры в цифровом виде с помощью <файлов игр> (их ещё называют <ROM>)
    - в них содержатся 🤖  <код>, 👾  <графика> и 🗣️  <заголовок>, описывающий оборудование
  responses:
    - это те самые файлы <*.neees>, да? [neeesfiles]

neeesfiles:
  messages:
    - да, формат называется iNEEES, и начинать стоит с чтения его <заголовка>
    - "первые 4 байта файла игры всегда содержат:"
    - $4E $45 $53 $1A
    - это <магическая константа> ✨
    - по этим байтам нужно проверять, корректен ли ROM
  responses:
    - что мне нужно сделать? [exercise]

exercise:
  messages:
    - 📚  добавь в класс 💾  `Cartridge` конструктор, принимающий байты ROM
    - 📚  сохрани их в свойстве `bytes`
    - 📚  если магическая константа не совпадает с $4E $45 $53 $1A, выброси ошибку с сообщением "Invalid ROM."
  responses:
    - (*) как добавить конструктор? 😳 [constructor]
    - (*) нужна помощь с проверкой байтов 🥺 [help]
    - (*) помоги выбросить ошибку 🤔 [errors]
    - (*) как отлаживать код? 🐞 [debug]

constructor:
  messages:
    - |-
      после добавления конструктора и сохранения байтов код должен выглядеть так:
        ```javascript
        export default class Cartridge {
          constructor(bytes) {
            this.bytes = bytes;
            // check the bytes here!
          }
        }```
  responses:
    - ...exercise

help:
  messages:
    - ты получишь `Uint8Array`, который работает почти как обычный массив!
    - так что ```javascript bytes[0]``` — первый байт, ```javascript bytes[1]``` — второй, и так далее
    - помни, что шестнадцатеричные числа записываются с префиксом ~0x~, например `0x4e`
  responses:
    - ...exercise

errors:
  messages:
    - |-
      чтобы выбросить ошибку, используй:
        ```javascript throw new Error("a message");```
  responses:
    - ...exercise

debug:
  messages:
    - отлаживать код можно несколькими способами
    - ➰  командой `repl`, чтобы вручную создавать экземпляры классов или пробовать JS-выражения
    - 🐞  добавляя в код `debugger;` и используя встроенные инструменты разработчика браузера
    - 🧾  вызывая `console.log(...)`, который выводит данные в инструменты разработчика браузера
    - |-
      🗃️  вызывая `EmuDevz.log(...)`, который выводит строку во вкладку `Log` в 🐞  <отладчике>
        (это пригодится позже, при запуске ROM в эмуляторе)
  responses:
    - ...exercise

corollary:
  messages:
    - теперь изменения можно смотреть командой `diff`
    - если нужно отменить изменения, запусти команду `restore`
  responses:
    - ▶️  продолжить [end]
