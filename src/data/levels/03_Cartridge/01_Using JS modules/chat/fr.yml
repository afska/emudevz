exercise:
  messages:
  - 📚  crée un fichier dans 📄  ~/code/Cartridge.js~
  - 📚  son <export par défaut> doit être une <classe vide>
  - 📚  ensuite, importe ce fichier depuis 📄  ~/code/index.js~
  - 📚  et exporte un <objet littéral> avec une seule clé (`Cartridge`) pointant vers cette classe
  - |-
    ton fichier ~index.js~ devrait ressembler à ça :
      ```javascript
      import Cartridge from "./Cartridge";
      export default { Cartridge }```
  responses:
  - (*) export ? modules ? 🧐 [modules]
  - (*) comment copier du code depuis le terminal ? [copy]

modules:
  messages:
  - ouais, chaque fichier est un module, et il a une valeur <exportée>
  - cette valeur peut être n'importe quelle <expression JS>, et on peut l'utiliser ailleurs en <important> le module
  - |-
    quelques explications...

    pour définir la valeur exportée d'un module :
      ```javascript export default "A_STRING"```
      ```javascript export default { an: "object", number: 123 }```
      ```javascript export default [1, 2, 3]```
      ```javascript export default function aFunction() { }```
      ```javascript export default class SomeClass { }```
    pour importer un module :
      ```javascript import aFunction from "./relative/path/to/aFunction"```
      ```javascript import SomeClass from "./relative/path/to/SomeClass"```
  responses:
  - ...exercise

copy:
