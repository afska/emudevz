---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - ни за что не угадаешь, что мне удалось найти
  - рабочий эмулятор NEEES!
  - хотя "рабочий" — это слишком громко сказано 😅
  responses:
  - так он работает или нет? 🤨 [works]

works:
  messages:
  - ну...
  - проблемы почти во всём
  - куча <багов>
  - будто его писали под градусом или что-то такое 🙃 🔫
  - хотя название честное — BrokenNEEES
  - но попробовать всё равно можно...
  - 💡  перетащи ROM в телевизор или используй одну из игр в 📁  ~/roms~
  - (если игр пока нет, вернись и поиграй в главе "👾 "!)
  - ROM можно запускать командой `open`
  responses:
  - (*) какие баги там нашлись? 🐞 [bugs]
  - это ужасно 👎 [awful]

bugs:
  messages:
  - во-первых, 💾  Cartridge, похоже, начинает читать CHR-ROM не с того байта, так что вся графика искажается
  - "у 🎮  Controllers забавный баг: пока нажата <A>, направления <Left> и <Right> меняются местами ☠️"
  - время выполнения 🧠  CPU совершенно случайное (отсюда проблемы с синхронизацией), а инструкции `ADC` и `BIT` <случайным образом ломаются>
  - ещё 🖥️  PPU добавляет шум на экран, странно меняет регистры прокрутки и рисует спрайты не там, где нужно
  - и наконец основные каналы 🔊  APU <фальшивят>, поэтому почти весь звук — мусор
  - к счастью, 🗜️  Mappers работают нормально 😅
  responses:
  - ...works

awful:
  messages:
  - да, понимаю
  - но кое-что хорошее в нём есть
  - у него <модульная> архитектура
  - так что его компоненты можно использовать повторно ♻️
  - это позволит нам реализовывать всё в любом порядке!
  - например, ты можешь начать с графики (🖥️  PPU), а я настрою твой эмулятор так, чтобы он использовал 🧠  CPU и 🔊  APU из BrokenNEEES
  - потом можно продолжать чинить остальное в своём темпе
  - давай сначала исправим 💾  Cartridge
  responses:
  - ▶️  продолжить [end]
