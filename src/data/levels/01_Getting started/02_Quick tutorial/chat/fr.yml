---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - avant de commencer, voyons comment utiliser l'ordi
  - tu peux lancer plusieurs apps depuis ce terminal
  responses:
  - (*) 💬  parle-moi de cette app [app]
  - (*) 💬  parle-moi des autres apps [otherapps]
  - (*) 💬  c'est quoi dans l'autre moitié de l'écran ? [tv]
  - (*) 💬  des raccourcis clavier à connaître ? [shortcuts]
  - 👌  pigé [end]

app:
  messages:
  - tu utilises l'app `chat` en ce moment
  - tu peux la fermer avec ~Ctrl+C~
  - et la rouvrir en tapant simplement `chat`, puis ~Enter~
  responses:
  - ...main

otherapps:
  messages:
  - pour voir quelles commandes sont disponibles, appuie sur ~Ctrl+C~ et lance l'app `help`
  - elle les liste toutes avec une brève explication de ce qu'elles font
  responses:
  - ...main

tv:
  messages:
  - c'est la <TV>
  - elle va être super utile pour ouvrir des fichiers multimédias
  - ou lancer notre émulateur 👀
  responses:
  - tu peux l'allumer ? 😮 [turnontv]

turnontv:
  run: |
    {{Right}}.load("spacegulls.webp");
  messages:
  - voilà...
  - "un extrait d'un jeu NEEES populaire : 🕊️ 🛰️  ~Spacegulls~"
  responses:
  - ...main

shortcuts:
  messages:
  - tu peux les lister à tout moment en lançant `help keys`
  responses:
  - ...main
