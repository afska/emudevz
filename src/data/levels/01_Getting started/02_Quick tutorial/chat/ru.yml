---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
  messages:
  - перед началом давай вспомним, как пользоваться компьютером
  - из этого терминала можно запускать разные приложения
  responses:
  - (*) 💬  расскажи об этом приложении [app]
  - (*) 💬  расскажи о других приложениях [otherapps]
  - (*) 💬  что на другой половине экрана? [tv]
  - (*) 💬  какие горячие клавиши стоит запомнить? [shortcuts]
  - 👌  всё понятно [end]

app:
  messages:
  - сейчас у тебя запущено приложение `chat`
  - его можно закрыть сочетанием ~Ctrl+C~
  - а чтобы открыть снова, просто введи `chat` и нажми ~Enter~
  responses:
  - ...main

otherapps:
  messages:
  - чтобы посмотреть доступные команды, нажми ~Ctrl+C~ и запусти приложение `help`
  - оно покажет все команды и кратко объяснит, что они делают
  responses:
  - ...main

tv:
  messages:
  - это <телевизор>
  - он очень пригодится для открытия мультимедийных файлов
  - и запуска нашего эмулятора 👀
  responses:
  - можешь его включить? 😮 [turnontv]

turnontv:
  run: |
    {{Right}}.load("spacegulls.webp");
  messages:
  - вот, смотри...
  - "фрагмент популярной игры для NEEES: 🕊️ 🛰️  ~Spacegulls~"
  responses:
  - ...main

shortcuts:
  messages:
  - в любой момент можно посмотреть их все командой `help keys`
  responses:
  - ...main
