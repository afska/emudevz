---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
    {{Right}}.load("architecture.png");
  messages:
  - итак... у этой штуки 3 основных компонента, которые работают почти независимо друг от друга
  - "это: 🧠  CPU, 🖥️  PPU и 🔊  APU"
  - "чтобы играть, нужно подключить два устройства:"
  - 💾  картридж (саму игру!)
  - 🎮  контроллер, геймпад с 8 кнопками
  responses:
  - 🧠  расскажи про CPU [cpu]
  - 🖥️  расскажи про PPU [ppu]
  - 🔊  расскажи про APU [apu]
  - ⏭️  с чего лучше начать? [start]

cpu:
  run: |
    {{Right}}.load("architecture.png");
  messages:
  - это <центральный процессор> (Central Processing Unit)
  - он читает код игры и выполняет её инструкции
  - как процессор в твоём компьютере, только в <несколько> раз медленнее
  - у него есть доступ к банку WRAM (рабочей памяти) размером 2 КиБ
  responses:
  - а где находится код игры? [thecode]
  - ...main

thecode:
  run: |
    {{Right}}.load("cartridge.png");
  messages:
  - в картридже!
  - а точнее, в чипе под названием 🤖  PRG-ROM (память программы)
  responses:
  - ...main

ppu:
  run: |
    {{Right}}.load("architecture.png");
  messages:
  - это <процессор обработки изображения> (Picture Processing Unit)
  - он рисует графику, размещая пиксели на экране
  - в великолепном разрешении ~256x240~!
  - и у него есть доступ к банку VRAM (видеопамяти) размером 2 КиБ
  responses:
  - а где хранится эта графика? [thegraphics]
  - ...main

thegraphics:
  run: |
    {{Right}}.load("cartridge.png");
  messages:
  - в картридже! :)
  - а точнее, в чипе под названием 👾  CHR-ROM (память символов)
  responses:
  - ...main

apu:
  run: |
    {{Right}}.load("architecture.png");
  messages:
  - это <процессор обработки звука> (Audio Processing Unit)
  - он отвечает за звук и генерирует звуковые волны
  - импульсные и треугольные волны, шум и даже произвольные семплы!
  responses:
  - ...main

start:
  messages:
  - сначала стоит изучить, как работает 🧠  CPU
  - для его эмуляции нам понадобится интерпретировать код игр
  - игры написаны на ассемблере, так что сперва разберёмся с ним
  - ну что, начинаем?
  responses:
  - ага, погнали [end]
