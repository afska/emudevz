---
main:
  run: |
    set((m) => m.chat.winOnEnd = true);
    {{Right}}.load("architecture.png");
  messages:
  - donc... ce truc a 3 composants principaux qui fonctionnent de façon assez indépendante
  - "ce sont : 🧠  CPU, 🖥️  PPU et 🔊  APU"
  - "pour lancer des jeux, il faut connecter deux éléments hardware :"
  - 💾  une cartouche (le jeu lui-même !)
  - 🎮  la manette, un gamepad de 8 boutons
  responses:
  - 🧠  parle-moi du CPU [cpu]
  - 🖥️  parle-moi de la PPU [ppu]
  - 🔊  parle-moi de l'APU [apu]
  - ⏭️  par où commencer ? [start]

cpu:
  run: |
    {{Right}}.load("architecture.png");
  messages:
  - c'est l'<Unité Centrale de Traitement>
  - lit le code des jeux et exécute leurs instructions
  - comme celui de ton ordi, mais <plusieurs> fois plus lent
  - il a accès à une banque de 2 Kio de WRAM (Work RAM)
  responses:
  - et où se trouve le code du jeu ? [thecode]
  - ...main

thecode:
  run: |
    {{Right}}.load("cartridge.png");
  messages:
  - dans la cartouche !
  - plus précisément, dans une puce appelée 🤖  PRG-ROM (Program ROM)
  responses:
  - ...main

ppu:
  run: |
    {{Right}}.load("architecture.png");
  messages:
  - c'est l'<Unité de Traitement d'Image>
  - dessine les graphismes en plaçant des pixels sur l'écran
  - dans la magnifique résolution de ~256x240~ !
  - et elle a accès à une banque de 2 Kio de VRAM (Video RAM)
  responses:
  - et où sont stockés ces graphismes ? [thegraphics]
  - ...main

thegraphics:
  run: |
    {{Right}}.load("cartridge.png");
  messages:
  - dans la cartouche ! :)
  - plus précisément, dans une puce appelée 👾  CHR-ROM (Character ROM)
  responses:
  - ...main

apu:
  run: |
    {{Right}}.load("architecture.png");
  messages:
  - c'est l'<Unité de Traitement Audio>
  - gère le son en produisant des ondes audio
  - comme des ondes pulse, triangulaires, du bruit, et même des samples personnalisés !
  responses:
  - ...main

start:
  messages:
  - tu devrais d'abord apprendre comment fonctionne le 🧠  CPU
  - pour l'émuler, on va devoir interpréter le code des jeux
  - ils sont écrits en assembleur, alors étudions ça d'abord
  - on commence ?
  responses:
  - ouais, c'est parti [end]
